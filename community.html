<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="AI 전문가 커뮤니티 — AI 전문가들의 지식 공유, 프로젝트 협업, 네트워킹 공간">
<meta property="og:title" content="AI 전문가 커뮤니티 — AX-On">
<meta property="og:description" content="AI 전문가들의 지식 공유, 프로젝트 협업, 네트워킹 공간">
<meta property="og:image" content="https://www.ax-on.net/images/og-default.png">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 110'><rect rx='20' width='100' height='110' fill='%23e8920d'/><text x='50' y='38' text-anchor='middle' dominant-baseline='central' font-family='Arial Black,Impact,sans-serif' font-weight='900' font-size='65' fill='white'>A</text><text x='50' y='74' text-anchor='middle' dominant-baseline='central' font-family='Arial Black,Impact,sans-serif' font-weight='900' font-size='65' fill='white'>X</text></svg>">
<title>AI 전문가 커뮤니티 — AX-On</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --ink: #1a1a2e;
  --ink-muted: #5a5f7d;
  --surface: #faf9f7;
  --surface-warm: #f5f0eb;
  --surface-card: #ffffff;
  --amber: #e8920d;
  --amber-light: #f5b942;
  --amber-glow: rgba(232, 146, 13, 0.12);
  --teal: #0d9488;
  --teal-light: #2dd4bf;
  --coral: #e85d4a;
  --violet: #7c5ce0;
  --sky: #3b82f6;
  --radius: 20px;
  --radius-sm: 12px;
  --shadow-soft: 0 4px 24px rgba(26, 26, 46, 0.06);
  --shadow-hover: 0 12px 40px rgba(26, 26, 46, 0.12);
  --dark-bg: #002451;
  --dark-bg-deep: #001126;
  --dark-text-muted: #7285b7;
  --dark-border: rgba(114, 133, 183, 0.15);
  --border: rgba(26, 26, 46, 0.08);
}

html { scroll-behavior: smooth; }
body {
  font-family: 'Noto Sans KR', sans-serif;
  background: var(--surface);
  color: var(--ink);
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* ── NAV ── */
.nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: rgba(250, 249, 247, 0.85);
  backdrop-filter: blur(20px) saturate(1.4);
  border-bottom: 1px solid rgba(26, 26, 46, 0.06);
  transition: all 0.4s ease;
}
.nav.scrolled {
  background: rgba(250, 249, 247, 0.95);
  box-shadow: 0 2px 20px rgba(26, 26, 46, 0.08);
}
.nav-inner {
  max-width: 1280px; margin: 0 auto;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 40px; height: 72px;
}
.nav-logo {
  display: flex; align-items: center; gap: 10px;
  text-decoration: none; color: var(--ink);
}
.logo-mark {
  width: 42px; height: 42px; border-radius: 12px;
  background: linear-gradient(135deg, var(--amber), var(--amber-light));
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  box-shadow: 0 4px 16px rgba(232, 146, 13, 0.3);
}
.logo-text {
  font-family: 'Outfit', sans-serif;
  font-weight: 800; font-size: 22px;
  letter-spacing: -0.5px; color: var(--ink);
}
.logo-text span { color: var(--amber); }
.nav-links { display: flex; gap: 4px; align-items: center; }
.nav-links a {
  text-decoration: none; color: var(--ink-muted);
  font-size: 15px; font-weight: 500;
  padding: 8px 14px; border-radius: 10px;
  transition: all 0.25s ease;
}
.nav-links a:hover { color: var(--ink); background: rgba(26, 26, 46, 0.04); }
.nav-links a.active { color: var(--violet); }
.nav-right { display: flex; align-items: center; gap: 8px; }
.nav-auth-btn {
  text-decoration: none; font-size: 14px; font-weight: 600;
  padding: 8px 18px; border-radius: 10px; transition: all 0.3s ease;
  font-family: 'Noto Sans KR', sans-serif;
}
.nav-login { color: var(--ink-muted); }
.nav-login:hover { color: var(--ink); }
.nav-signup {
  background: var(--ink); color: #fff; border-radius: 12px;
}
.nav-signup:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(26,26,46,0.2); }
.mobile-toggle {
  display: none; background: none; border: none;
  width: 44px; height: 44px; cursor: pointer;
  flex-direction: column; align-items: center; justify-content: center; gap: 5px;
}
.mobile-toggle span {
  display: block; width: 22px; height: 2px;
  background: var(--ink); border-radius: 2px; transition: all 0.3s ease;
}
.mobile-toggle.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.mobile-toggle.open span:nth-child(2) { opacity: 0; transform: scaleX(0); }
.mobile-toggle.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
/* Desktop: hide mobile auth links */
.nav-auth-mobile { display: none; }

/* NAV USER — index.html과 동일 */
.nav-user-wrap { display: flex; align-items: center; gap: 8px; }
.nav-user-name {
  font-size: 14px; font-weight: 600; color: var(--ink);
  text-decoration: none; padding: 8px 12px; border-radius: 10px;
  transition: all 0.25s ease;
}
.nav-user-name:hover { background: rgba(26,26,46,0.04); text-decoration: none; }
.nav-logout-btn {
  font-size: 13px; font-weight: 600; color: var(--ink-muted);
  background: none; border: 1.5px solid rgba(26,26,46,0.12);
  padding: 6px 14px; border-radius: 10px; cursor: pointer;
  font-family: 'Noto Sans KR', sans-serif; transition: all 0.25s ease;
}
.nav-logout-btn:hover { color: var(--ink); border-color: var(--ink); }

/* ── PAGE HEADER ── */
.page-header {
  padding: 100px 40px 48px;
  background: var(--surface-warm);
  position: relative; overflow: hidden;
}
.page-header::before {
  content: ''; position: absolute; top: -100px; left: 50%; transform: translateX(-50%);
  width: 600px; height: 400px;
  background: radial-gradient(ellipse, rgba(124, 92, 224, 0.12) 0%, transparent 70%);
  pointer-events: none;
}
.page-header-inner {
  max-width: 1280px; margin: 0 auto;
  display: flex; align-items: center; gap: 20px;
  position: relative; z-index: 1;
}
.page-title-wrap {}
.page-title {
  font-family: 'Outfit', sans-serif;
  font-size: clamp(28px, 4vw, 40px);
  font-weight: 900; letter-spacing: -1px; color: var(--ink);
}
.page-title span { color: var(--violet); }
.page-subtitle {
  font-size: 15px; color: var(--ink-muted); margin-top: 4px;
}
.page-header-actions { margin-left: auto; }
.btn-write {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 12px 24px; border-radius: 12px;
  background: var(--violet); color: #fff;
  font-size: 15px; font-weight: 700;
  border: none; cursor: pointer;
  transition: all 0.3s ease;
  font-family: 'Noto Sans KR', sans-serif;
  text-decoration: none;
  box-shadow: 0 4px 16px rgba(124, 92, 224, 0.3);
}
.btn-write:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(124, 92, 224, 0.4); }

/* ── GATE OVERLAY ── */
.gate-overlay {
  max-width: 600px; margin: 120px auto 60px; padding: 60px 40px;
  background: var(--surface-card); border: 1px solid var(--border);
  border-radius: var(--radius); text-align: center;
  box-shadow: var(--shadow-soft);
}
.gate-icon { font-size: 56px; margin-bottom: 16px; }
.gate-title {
  font-size: 24px; font-weight: 900; color: var(--ink); margin-bottom: 12px;
}
.gate-desc {
  font-size: 15px; color: var(--ink-muted); line-height: 1.7; margin-bottom: 28px;
}
.gate-btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 14px 32px; border-radius: 12px;
  background: var(--violet); color: #fff;
  font-size: 15px; font-weight: 700; border: none; cursor: pointer;
  font-family: 'Noto Sans KR', sans-serif;
  text-decoration: none; transition: all 0.3s ease;
  box-shadow: 0 4px 16px rgba(124, 92, 224, 0.3);
}
.gate-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(124, 92, 224, 0.4); }
.gate-btn-secondary {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 14px 32px; border-radius: 12px;
  background: var(--surface-warm); color: var(--ink);
  font-size: 15px; font-weight: 700; border: 1px solid var(--border); cursor: pointer;
  font-family: 'Noto Sans KR', sans-serif;
  text-decoration: none; transition: all 0.3s ease;
  margin-left: 12px;
}
.gate-btn-secondary:hover { border-color: rgba(26,26,46,0.2); box-shadow: var(--shadow-soft); }

/* ── LAYOUT ── */
.community-layout {
  max-width: 1280px; margin: 0 auto; width: 100%;
  display: grid; grid-template-columns: 240px 1fr;
  gap: 24px; padding: 32px 40px 80px;
  flex: 1;
}

/* ── SIDEBAR LEFT: 카테고리 ── */
.sidebar-left {
  position: sticky; top: 88px; height: fit-content;
}
.sidebar-section { margin-bottom: 24px; }
.sidebar-title {
  font-size: 11px; font-weight: 700;
  color: var(--ink-muted); text-transform: uppercase;
  letter-spacing: 1.5px; margin-bottom: 8px;
  padding: 0 8px;
}
.cat-list { display: flex; flex-direction: column; gap: 2px; }
.cat-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 12px; border-radius: 10px;
  cursor: pointer; transition: all 0.2s ease;
  color: var(--ink-muted); font-size: 14px; font-weight: 500;
  border: 1px solid transparent;
}
.cat-item:hover { background: var(--surface-card); color: var(--ink); box-shadow: var(--shadow-soft); }
.cat-item.active {
  background: rgba(124, 92, 224, 0.12);
  color: var(--violet); border-color: rgba(124, 92, 224, 0.2);
}
.cat-icon { margin-right: 8px; font-size: 15px; }
.cat-count {
  font-size: 11px; background: rgba(26,26,46,0.06);
  padding: 2px 7px; border-radius: 20px; color: var(--ink-muted);
}
.cat-item.active .cat-count { background: rgba(124, 92, 224, 0.15); color: var(--violet); }

/* ── MAIN FEED ── */
.feed-main { min-width: 0; }

/* ── POST CARD ── */
.post-card {
  background: var(--surface-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  margin-bottom: 8px;
  transition: all 0.2s ease;
  overflow: hidden;
}
.post-card:hover {
  border-color: rgba(26,26,46,0.15);
  transform: translateY(-1px);
  box-shadow: var(--shadow-hover);
}
.post-card-header {
  padding: 14px 16px; cursor: pointer;
}
.post-meta {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 6px; flex-wrap: wrap;
}
.post-category-badge {
  font-size: 11px; font-weight: 700;
  padding: 2px 8px; border-radius: 20px;
  text-transform: uppercase; letter-spacing: 0.5px;
}
.badge-notice { background: rgba(220,38,38,0.1); color: #DC2626; }
.badge-reference { background: rgba(37,99,235,0.1); color: #2563EB; }
.badge-discussion { background: rgba(13,148,136,0.1); color: #0d9488; }
.badge-knowledge { background: rgba(232,146,13,0.1); color: #e8920d; }

.post-title {
  font-size: 15px; font-weight: 700;
  color: var(--ink); margin-bottom: 6px;
  line-height: 1.4;
}
.post-title:hover { color: var(--violet); }
.post-preview {
  font-size: 13px; color: var(--ink-muted); line-height: 1.6;
  margin-bottom: 10px;
  display: -webkit-box; -webkit-line-clamp: 2;
  -webkit-box-orient: vertical; overflow: hidden;
}
.post-footer {
  display: flex; align-items: center; gap: 14px;
  font-size: 12px; color: var(--ink-muted);
}
.author-info { display: flex; align-items: center; gap: 6px; }
.author-avatar {
  width: 20px; height: 20px; border-radius: 50%;
  background: var(--violet); display: flex; align-items: center;
  justify-content: center; font-size: 10px; color: #fff; font-weight: 700;
  flex-shrink: 0;
}
.author-name { font-weight: 600; color: var(--ink); font-size: 12px; }
.post-stat { display: flex; align-items: center; gap: 4px; }
.post-time { margin-left: auto; }

/* ── ACCORDION EXPAND ── */
.post-expand {
  max-height: 0; overflow: hidden;
  transition: max-height 0.4s ease;
}
.post-card.expanded .post-expand {
  max-height: 2000px;
}
.post-card.expanded {
  border-color: rgba(124, 92, 224, 0.3);
  box-shadow: 0 4px 24px rgba(124, 92, 224, 0.08);
  transform: none;
}
.post-expand-inner {
  padding: 0 16px 16px;
  border-top: 1px solid var(--border);
}
.post-full-content {
  font-size: 15px; line-height: 1.8; color: var(--ink);
  padding: 16px 0; white-space: pre-wrap; word-break: break-word;
}
.post-collapse-btn {
  display: flex; align-items: center; gap: 6px;
  padding: 8px 16px; border-radius: 8px;
  background: var(--surface-warm); border: 1px solid var(--border);
  color: var(--ink-muted); font-size: 13px; font-weight: 600;
  cursor: pointer; margin-bottom: 16px;
  font-family: 'Noto Sans KR', sans-serif;
  transition: all 0.2s;
}
.post-collapse-btn:hover { color: var(--ink); border-color: rgba(26,26,46,0.2); }

/* ── COMMENTS (inside accordion) ── */
.comments-section { margin-top: 16px; }
.comments-title {
  font-size: 15px; font-weight: 700; color: var(--ink);
  margin-bottom: 12px;
}
.comment-item {
  display: flex; gap: 10px; margin-bottom: 12px;
  padding: 10px; background: var(--surface-warm);
  border-radius: 10px;
}
.comment-avatar {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--teal); display: flex; align-items: center;
  justify-content: center; font-size: 11px; color: #fff; font-weight: 700;
  flex-shrink: 0;
}
.comment-content-wrap { flex: 1; min-width: 0; }
.comment-author-row {
  display: flex; align-items: center; gap: 8px; margin-bottom: 4px;
}
.comment-author { font-size: 13px; font-weight: 700; color: var(--ink); }
.comment-time { font-size: 11px; color: var(--ink-muted); }
.comment-text {
  font-size: 14px; line-height: 1.7; color: var(--ink);
  white-space: pre-wrap; word-break: break-word;
}

/* Reply (nested comment) */
.reply-list {
  margin-left: 38px; margin-top: 8px;
}
.reply-item {
  display: flex; gap: 8px; margin-bottom: 8px;
  padding: 8px 10px; background: rgba(26,26,46,0.03);
  border-radius: 8px; border-left: 3px solid var(--violet);
}
.reply-item .comment-avatar {
  width: 24px; height: 24px; font-size: 10px;
  background: var(--violet);
}
.reply-item .comment-author { font-size: 12px; }
.reply-item .comment-text { font-size: 13px; }
.btn-reply-toggle {
  background: none; border: none; cursor: pointer;
  font-size: 12px; font-weight: 600; color: var(--violet);
  padding: 2px 6px; margin-top: 4px;
  font-family: 'Noto Sans KR', sans-serif;
  transition: opacity 0.2s;
}
.btn-reply-toggle:hover { opacity: 0.7; }
.reply-write {
  display: flex; gap: 8px; margin-top: 8px; margin-left: 38px;
  align-items: flex-start;
}
.reply-write .comment-textarea {
  min-height: 44px; font-size: 13px; padding: 8px 10px;
}
.reply-write .btn-comment-submit {
  padding: 8px 14px; font-size: 12px;
}

/* Comment write */
.comment-write {
  display: flex; gap: 10px; margin-top: 16px;
  align-items: flex-start;
}
.comment-textarea {
  flex: 1; min-height: 60px;
  background: var(--surface-card); border: 1px solid var(--border);
  border-radius: 10px; padding: 10px 12px;
  color: var(--ink); font-size: 14px; line-height: 1.6;
  resize: vertical; outline: none;
  font-family: 'Noto Sans KR', sans-serif;
  transition: border-color 0.2s;
}
.comment-textarea:focus { border-color: rgba(124, 92, 224, 0.5); }
.comment-textarea::placeholder { color: var(--ink-muted); }
.btn-comment-submit {
  padding: 10px 20px; border-radius: 10px;
  background: var(--violet); color: #fff;
  border: none; cursor: pointer; font-size: 13px; font-weight: 700;
  font-family: 'Noto Sans KR', sans-serif;
  transition: all 0.2s; white-space: nowrap;
  align-self: flex-end;
}
.btn-comment-submit:hover { background: #6a49d4; }

/* ── WRITE MODAL ── */
.write-modal-overlay {
  position: fixed; inset: 0; z-index: 600;
  background: rgba(26,26,46,0.5); backdrop-filter: blur(6px);
  display: none; align-items: center; justify-content: center;
  padding: 20px;
}
.write-modal-overlay.open { display: flex; }
.write-modal {
  background: var(--surface-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  width: 100%; max-width: 700px;
  padding: 32px; position: relative;
  animation: fadeUp 0.35s ease both;
  max-height: 90vh; overflow-y: auto;
  box-shadow: var(--shadow-hover);
}
.write-modal-title {
  font-size: 20px; font-weight: 900;
  margin-bottom: 24px; color: var(--ink);
}
.modal-close {
  position: absolute; top: 20px; right: 20px;
  width: 36px; height: 36px; border-radius: 10px;
  background: var(--surface-warm); border: 1px solid var(--border);
  color: var(--ink-muted); font-size: 18px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
}
.modal-close:hover { background: var(--surface-warm); color: var(--ink); border-color: rgba(26,26,46,0.2); }
.form-group { margin-bottom: 18px; }
.form-label {
  display: block; font-size: 13px; font-weight: 700;
  color: var(--ink-muted); margin-bottom: 8px;
}
.form-input, .form-textarea {
  width: 100%; background: var(--surface-warm);
  border: 1px solid var(--border);
  border-radius: 10px; padding: 12px 16px;
  color: var(--ink); font-size: 14px;
  font-family: 'Noto Sans KR', sans-serif;
  outline: none; transition: border-color 0.2s;
}
.form-input:focus, .form-textarea:focus {
  border-color: rgba(124, 92, 224, 0.5);
  background: var(--surface-card);
}
.form-textarea { min-height: 160px; resize: vertical; line-height: 1.7; }
.form-footer {
  display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px;
}
.btn-cancel {
  padding: 10px 24px; border-radius: 10px;
  background: transparent; color: var(--ink-muted);
  border: 1px solid var(--border); cursor: pointer; font-size: 14px;
  font-family: 'Noto Sans KR', sans-serif;
  transition: all 0.2s; font-weight: 600;
}
.btn-cancel:hover { color: var(--ink); border-color: rgba(26,26,46,0.2); }
.btn-submit {
  padding: 10px 24px; border-radius: 10px;
  background: var(--violet); color: #fff;
  border: none; cursor: pointer; font-size: 14px; font-weight: 700;
  font-family: 'Noto Sans KR', sans-serif;
  transition: all 0.2s;
}
.btn-submit:hover { background: #6a49d4; }

/* Category radio group */
.cat-radio-group {
  display: flex; gap: 8px; flex-wrap: wrap;
}
.cat-radio-item {
  display: flex; align-items: center; gap: 6px;
  padding: 8px 16px; border-radius: 20px;
  border: 1.5px solid var(--border);
  background: var(--surface-warm); cursor: pointer;
  font-size: 13px; font-weight: 600; color: var(--ink-muted);
  transition: all 0.2s;
}
.cat-radio-item:hover { border-color: rgba(26,26,46,0.2); color: var(--ink); }
.cat-radio-item input[type="radio"] { display: none; }
.cat-radio-item.selected-notice { background: rgba(220,38,38,0.1); color: #DC2626; border-color: rgba(220,38,38,0.3); }
.cat-radio-item.selected-reference { background: rgba(37,99,235,0.1); color: #2563EB; border-color: rgba(37,99,235,0.3); }
.cat-radio-item.selected-discussion { background: rgba(13,148,136,0.1); color: #0d9488; border-color: rgba(13,148,136,0.3); }
.cat-radio-item.selected-knowledge { background: rgba(232,146,13,0.1); color: #e8920d; border-color: rgba(232,146,13,0.3); }

/* ── TOAST ── */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px);
  background: var(--ink); color: #fff; padding: 14px 28px;
  border-radius: 12px; font-size: 14px; font-weight: 600;
  box-shadow: 0 8px 32px rgba(26,26,46,0.3);
  z-index: 9999; opacity: 0; transition: all 0.4s ease;
  pointer-events: none;
}
.toast.show {
  opacity: 1; transform: translateX(-50%) translateY(0);
}
.toast.error { background: var(--coral); }

/* ── EMPTY STATE ── */
.empty-state {
  text-align: center; padding: 80px 20px; color: var(--ink-muted);
}
.empty-icon { font-size: 48px; margin-bottom: 16px; }
.empty-text { font-size: 15px; }

/* ── LOADING ── */
.loading-state {
  text-align: center; padding: 60px 20px; color: var(--ink-muted);
}

/* ── FOOTER ── */
.footer {
  padding: 24px 40px 16px;
  background: var(--dark-bg);
  color: var(--dark-text-muted);
}
.footer-inner {
  max-width: 1280px; margin: 0 auto;
  display: flex; flex-direction: column; align-items: center;
  gap: 6px;
}
.footer-logo {
  font-family: 'Outfit', sans-serif;
  font-weight: 800; font-size: 20px; color: #fff;
}
.footer-logo span { color: var(--amber); }
.footer-links { display: flex; gap: 24px; }
.footer-links a {
  color: var(--dark-text-muted);
  text-decoration: none; font-size: 14px;
  transition: color 0.3s ease;
}
.footer-links a:hover { color: var(--amber); }
.footer-copyright {
  max-width: 1280px; margin: 6px auto 0; padding: 6px 40px 0;
  border-top: 1px solid var(--dark-border);
  text-align: center; font-size: 12px; color: var(--dark-text-muted); opacity: 0.7;
}

/* ── ANIMATIONS ── */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ── SCROLLBAR ── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(26,26,46,0.1); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: rgba(26,26,46,0.2); }

/* ── ACCESSIBILITY ── */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}
:focus-visible { outline: 3px solid var(--violet); outline-offset: 2px; border-radius: 4px; }

<script>
// =============================================================
//  AX-On 전문가 커뮤니티 — Expert-only Community
// =============================================================

// ── Supabase init ──
let db = null;
const _sbReady = AXON_CONFIG.init().then(() => {
  if (typeof window.supabase !== 'undefined') {
    db = window.supabase.createClient(AXON_CONFIG.SUPABASE_URL, AXON_CONFIG.SUPABASE_ANON_KEY);
  }
});

// ── State ──
let currentUser = null;
let currentExpert = null;
let allPosts = [];
let state = {
  currentCat: 'all',
  expandedPostId: null
};

// ── Category metadata ──
const CATEGORY_META = {
  all:        { label: '전체',     badge: '',                icon: '' },
  notice:     { label: '공지사항', badge: 'badge-notice',    icon: '📢' },
  reference:  { label: '참고자료', badge: 'badge-reference',  icon: '📚' },
  discussion: { label: '자유토론', badge: 'badge-discussion', icon: '💬' },
  knowledge:  { label: '지식Hub',  badge: 'badge-knowledge',  icon: '💡' }
};

// ── Utilities ──
function timeAgo(dateStr) {
  const diff = Math.floor((Date.now() - new Date(dateStr).getTime()) / 1000);
  if (diff < 60) return '방금 전';
  if (diff < 3600) return Math.floor(diff / 60) + '분 전';
  if (diff < 86400) return Math.floor(diff / 3600) + '시간 전';
  if (diff < 604800) return Math.floor(diff / 86400) + '일 전';
  if (diff < 2592000) return Math.floor(diff / 604800) + '주 전';
  if (diff < 31536000) return Math.floor(diff / 2592000) + '개월 전';
  return Math.floor(diff / 31536000) + '년 전';
}

function sanitize(str) {
  if (!str) return '';
  if (typeof DOMPurify !== 'undefined') {
    return DOMPurify.sanitize(str, { ALLOWED_TAGS: [], ALLOWED_ATTR: [] });
  }
  return escapeHtml(str);
}

function showToast(msg, isError) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (isError ? ' error' : '');
  requestAnimationFrame(() => { t.classList.add('show'); });
  setTimeout(() => { t.classList.remove('show'); }, 3000);
}

// ── Nav scroll effect ──
window.addEventListener('scroll', () => {
  document.getElementById('nav').classList.toggle('scrolled', window.scrollY > 10);
});

// ── Mobile hamburger ──
document.getElementById('mobileToggle').addEventListener('click', function() {
  this.classList.toggle('open');
  document.getElementById('navLinks').classList.toggle('open');
});

// ── Auth & Expert Gating ──
async function initAuth() {
  await _sbReady;
  if (!db) {
    showGate('error');
    return;
  }

  const { data: { user } } = await db.auth.getUser();

  if (!user) {
    showGate('login');
    return;
  }

  currentUser = user;

  // Check if user is a registered expert
  const { data: expert, error } = await db
    .from('ax_experts').select('id, name').eq('user_id', user.id).maybeSingle();

  // Nav에 실명 표시 (expert 있으면 실명, 없으면 fallback)
  updateNavAuth(user, expert ? expert.name : null);

  if (error || !expert) {
    showGate('expert');
    return;
  }

  currentExpert = expert;

  // User is authorized expert — show community
  showCommunity();
}

function showGate(type) {
  const gate = document.getElementById('gateSection');
  gate.style.display = 'block';

  if (type === 'login') {
    gate.innerHTML = `
      <div class="gate-overlay">
        <div class="gate-icon">🔒</div>
        <div class="gate-title">로그인이 필요합니다</div>
        <div class="gate-desc">전문가 커뮤니티는 로그인한 전문가만 이용할 수 있습니다.<br>먼저 로그인해주세요.</div>
        <a href="pages/auth/login.html" class="gate-btn">로그인</a>
        <a href="pages/auth/signup.html" class="gate-btn-secondary">회원가입</a>
      </div>`;
  } else if (type === 'expert') {
    gate.innerHTML = `
      <div class="gate-overlay">
        <div class="gate-icon">🎓</div>
        <div class="gate-title">전문가 등록을 먼저 완료해주세요</div>
        <div class="gate-desc">전문가 커뮤니티는 등록된 전문가만 이용할 수 있습니다.<br>전문가 풀에서 등록을 진행해주세요.</div>
        <a href="pool.html" class="gate-btn">전문가 등록하기</a>
      </div>`;
  } else {
    gate.innerHTML = `
      <div class="gate-overlay">
        <div class="gate-icon">⚠️</div>
        <div class="gate-title">서비스 연결 오류</div>
        <div class="gate-desc">서버에 연결할 수 없습니다. 잠시 후 다시 시도해주세요.</div>
        <button class="gate-btn" onclick="location.reload()">다시 시도</button>
      </div>`;
  }
}

function updateNavAuth(user, expertName) {
  const displayName = escapeHtml(expertName || user.user_metadata?.full_name || user.user_metadata?.name || user.email?.split('@')[0] || '사용자');
  // Desktop nav-right (index.html과 동일 패턴)
  const navRight = document.getElementById('navRight');
  const loginBtn = document.getElementById('navLoginBtn');
  const signupBtn = document.getElementById('navSignupBtn');
  if (loginBtn) loginBtn.remove();
  if (signupBtn) signupBtn.remove();
  const userWrap = document.createElement('div');
  userWrap.className = 'nav-user-wrap';
  userWrap.innerHTML = '<a href="pages/auth/profile.html" class="nav-user-name">' + displayName + '님</a><button class="nav-logout-btn" onclick="doLogout()">로그아웃</button>';
  navRight.insertBefore(userWrap, navRight.querySelector('.mobile-toggle'));
  // 관리자 링크
  injectAdminLink(user);
  // Mobile auth (index.html과 동일 패턴)
  const mobileLogin = document.querySelector('.nav-auth-mobile.login-mobile');
  const mobileSignup = document.querySelector('.nav-auth-mobile.signup-mobile');
  if (mobileLogin) {
    mobileLogin.textContent = displayName + '님';
    mobileLogin.href = 'pages/auth/profile.html';
    mobileLogin.classList.remove('login-mobile');
  }
  if (mobileSignup) {
    mobileSignup.textContent = '로그아웃';
    mobileSignup.href = '#';
    mobileSignup.addEventListener('click', (e) => { e.preventDefault(); doLogout(); });
  }
}

async function doLogout() {
  if (db) await db.auth.signOut();
  location.reload();
}

// ── Show community (authorized) ──
function showCommunity() {
  document.getElementById('pageHeader').style.display = 'block';
  document.getElementById('communityLayout').style.display = 'grid';
  // Show mobile category bar on small screens
  if (window.innerWidth <= 768) {
    document.getElementById('mobileCatBar').style.display = 'flex';
  }
  // 관리자면 공지사항/지식Hub 글쓰기 카테고리 표시
  if (currentUser && currentUser.app_metadata?.role === 'admin') {
    document.querySelectorAll('.admin-only-cat').forEach(el => el.style.display = '');
  }
  // Default select discussion category radio in write modal
  selectWriteCat(document.querySelector('.cat-radio-item[data-cat="discussion"]'), 'discussion');
  fetchAllPosts();
}

// ── Fetch posts ──
async function fetchAllPosts() {
  if (!db) return;

  const { data, error } = await db
    .from('ax_posts')
    .select('id, title, content, category, user_id, author_name, created_at, ax_comments(id)')
    .order('created_at', { ascending: false });

  if (error) {
    console.error('fetchPosts error:', error);
    document.getElementById('postList').innerHTML =
      '<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-text">게시글을 불러오지 못했습니다.</div></div>';
    return;
  }

  // Add comment_count from nested ax_comments
  allPosts = (data || []).map(p => ({
    ...p,
    comment_count: (p.ax_comments || []).length
  }));
  updateCategoryCounts();
  renderPosts();
}

// ── Category counts ──
function updateCategoryCounts() {
  const counts = { all: allPosts.length, notice: 0, reference: 0, discussion: 0, knowledge: 0 };
  allPosts.forEach(p => {
    if (counts[p.category] !== undefined) counts[p.category]++;
  });
  Object.keys(counts).forEach(key => {
    const el = document.getElementById('cnt-' + key);
    if (el) el.textContent = counts[key];
  });
}

// ── Render posts ──
function renderPosts() {
  const list = document.getElementById('postList');
  const filtered = state.currentCat === 'all'
    ? allPosts
    : allPosts.filter(p => p.category === state.currentCat);

  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-text">아직 게시글이 없습니다. 첫 글을 작성해보세요!</div></div>';
    return;
  }

  list.innerHTML = filtered.map(post => {
    const cat = CATEGORY_META[post.category] || CATEGORY_META.discussion;
    const preview = (post.content || '').substring(0, 120).replace(/\n/g, ' ');
    const authorInitial = (post.author_name || '?').charAt(0).toUpperCase();
    const isExpanded = state.expandedPostId === post.id;

    return `
      <div class="post-card${isExpanded ? ' expanded' : ''}" id="post-${post.id}">
        <div class="post-card-header" onclick="togglePost('${post.id}')">
          <div class="post-meta">
            <span class="post-category-badge ${cat.badge}">${escapeHtml(cat.label)}</span>
          </div>
          <div class="post-title">${escapeHtml(post.title)}</div>
          <div class="post-preview">${escapeHtml(preview)}</div>
          <div class="post-footer">
            <div class="author-info">
              <div class="author-avatar">${authorInitial}</div>
              <span class="author-name">${escapeHtml(post.author_name || '익명')}</span>
            </div>
            <div class="post-stat">💬 ${post.comment_count || 0}</div>
            <span class="post-time">${timeAgo(post.created_at)}</span>
          </div>
        </div>
        <div class="post-expand">
          <div class="post-expand-inner" id="expand-${post.id}">
            ${isExpanded ? buildExpandContent(post) : ''}
          </div>
        </div>
      </div>`;
  }).join('');
}

// ── Toggle accordion ──
async function togglePost(postId) {
  const card = document.getElementById('post-' + postId);
  if (!card) return;

  // If already expanded, collapse
  if (state.expandedPostId === postId) {
    card.classList.remove('expanded');
    state.expandedPostId = null;
    return;
  }

  // Collapse previous
  if (state.expandedPostId) {
    const prev = document.getElementById('post-' + state.expandedPostId);
    if (prev) prev.classList.remove('expanded');
  }

  state.expandedPostId = postId;
  const expandInner = document.getElementById('expand-' + postId);
  const post = allPosts.find(p => p.id === postId);

  if (!post) return;

  // Show loading first
  expandInner.innerHTML = '<div class="loading-state" style="padding:20px;">댓글 불러오는 중...</div>';
  card.classList.add('expanded');

  // Fetch comments
  const comments = await fetchComments(postId);
  expandInner.innerHTML = buildExpandContent(post, comments);
}

function buildExpandContent(post, comments) {
  comments = comments || [];
  const sanitizedContent = sanitize(post.content || '');

  // Separate top-level comments and replies
  const topComments = comments.filter(c => !c.parent_id);
  const repliesByParent = {};
  comments.filter(c => c.parent_id).forEach(c => {
    if (!repliesByParent[c.parent_id]) repliesByParent[c.parent_id] = [];
    repliesByParent[c.parent_id].push(c);
  });

  let html = `
    <div class="post-full-content">${sanitizedContent}</div>
    <button class="post-collapse-btn" onclick="event.stopPropagation(); togglePost('${post.id}')">▲ 접기</button>
    <div class="comments-section">
      <div class="comments-title">댓글 ${comments.length}개</div>`;

  // Comment list (top-level + nested replies)
  if (topComments.length > 0) {
    html += topComments.map(c => {
      const ci = (c.author_name || '?').charAt(0).toUpperCase();
      const replies = repliesByParent[c.id] || [];
      let replyHtml = '';

      // Render replies
      if (replies.length > 0) {
        replyHtml += '<div class="reply-list">';
        replyHtml += replies.map(r => {
          const ri = (r.author_name || '?').charAt(0).toUpperCase();
          return `
            <div class="reply-item">
              <div class="comment-avatar">${ri}</div>
              <div class="comment-content-wrap">
                <div class="comment-author-row">
                  <span class="comment-author">${escapeHtml(r.author_name || '익명')}</span>
                  <span class="comment-time">${timeAgo(r.created_at)}</span>
                </div>
                <div class="comment-text">${sanitize(r.content)}</div>
              </div>
            </div>`;
        }).join('');
        replyHtml += '</div>';
      }

      return `
        <div class="comment-item">
          <div class="comment-avatar">${ci}</div>
          <div class="comment-content-wrap">
            <div class="comment-author-row">
              <span class="comment-author">${escapeHtml(c.author_name || '익명')}</span>
              <span class="comment-time">${timeAgo(c.created_at)}</span>
            </div>
            <div class="comment-text">${sanitize(c.content)}</div>
            <button class="btn-reply-toggle" onclick="event.stopPropagation(); toggleReplyInput('${post.id}', '${c.id}')">답글</button>
          </div>
        </div>
        ${replyHtml}
        <div class="reply-write" id="replyWrite-${c.id}" style="display:none;">
          <textarea class="comment-textarea" id="replyInput-${c.id}" placeholder="답글을 입력하세요..."></textarea>
          <button class="btn-comment-submit" onclick="submitReply('${post.id}', '${c.id}')">답글 등록</button>
        </div>`;
    }).join('');
  }

  // Comment input
  html += `
      <div class="comment-write">
        <textarea class="comment-textarea" id="commentInput-${post.id}" placeholder="댓글을 입력하세요..."></textarea>
        <button class="btn-comment-submit" onclick="submitComment('${post.id}')">댓글 등록</button>
      </div>
    </div>`;

  return html;
}

// ── Toggle reply input ──
function toggleReplyInput(postId, commentId) {
  const replyWrap = document.getElementById('replyWrite-' + commentId);
  if (!replyWrap) return;
  const isVisible = replyWrap.style.display !== 'none';
  replyWrap.style.display = isVisible ? 'none' : 'flex';
  if (!isVisible) {
    const textarea = document.getElementById('replyInput-' + commentId);
    if (textarea) textarea.focus();
  }
}

// ── Submit reply (대댓글) ──
async function submitReply(postId, parentId) {
  if (!db || !currentUser || !currentExpert) {
    showToast('로그인이 필요합니다.', true);
    return;
  }

  const textarea = document.getElementById('replyInput-' + parentId);
  if (!textarea) return;

  const content = textarea.value.trim();
  if (!content) {
    showToast('답글 내용을 입력해주세요.', true);
    return;
  }

  const sanitizedContent = sanitize(content);
  if (!sanitizedContent) {
    showToast('유효한 답글 내용을 입력해주세요.', true);
    return;
  }

  const { error } = await db.from('ax_comments').insert({
    post_id: postId,
    parent_id: parentId,
    content: sanitizedContent,
    user_id: currentUser.id,
    author_name: currentExpert.name || currentUser.user_metadata?.display_name || currentUser.email?.split('@')[0] || '전문가'
  });

  if (error) {
    console.error('submitReply error:', error);
    showToast('답글 등록에 실패했습니다.', true);
    return;
  }

  // Update comment count
  const post = allPosts.find(p => p.id === postId);
  if (post) post.comment_count = (post.comment_count || 0) + 1;

  // Refresh
  const comments = await fetchComments(postId);
  const expandInner = document.getElementById('expand-' + postId);
  if (expandInner && post) {
    expandInner.innerHTML = buildExpandContent(post, comments);
  }

  showToast('답글이 등록되었습니다.');
}

// ── Fetch comments ──
async function fetchComments(postId) {
  if (!db) return [];
  const { data, error } = await db
    .from('ax_comments')
    .select('id, post_id, parent_id, content, author_name, user_id, created_at')
    .eq('post_id', postId)
    .order('created_at', { ascending: true });

  if (error) { console.error('fetchComments error:', error); return []; }
  return data || [];
}

// ── Submit comment ──
async function submitComment(postId) {
  if (!db || !currentUser || !currentExpert) {
    showToast('로그인이 필요합니다.', true);
    return;
  }

  const textarea = document.getElementById('commentInput-' + postId);
  if (!textarea) return;

  const content = textarea.value.trim();
  if (!content) {
    showToast('댓글 내용을 입력해주세요.', true);
    return;
  }

  const sanitizedContent = sanitize(content);
  if (!sanitizedContent) {
    showToast('유효한 댓글 내용을 입력해주세요.', true);
    return;
  }

  const { data, error } = await db.from('ax_comments').insert({
    post_id: postId,
    content: sanitizedContent,
    user_id: currentUser.id,
    author_name: currentExpert.name || currentUser.user_metadata?.display_name || currentUser.email?.split('@')[0] || '전문가'
  }).select().single();

  if (error) {
    console.error('submitComment error:', error);
    showToast('댓글 등록에 실패했습니다.', true);
    return;
  }

  // Update comment count in local state
  const post = allPosts.find(p => p.id === postId);
  if (post) post.comment_count = (post.comment_count || 0) + 1;

  // Refresh the expanded section
  const comments = await fetchComments(postId);
  const expandInner = document.getElementById('expand-' + postId);
  if (expandInner && post) {
    expandInner.innerHTML = buildExpandContent(post, comments);
  }

  showToast('댓글이 등록되었습니다.');
}

// ── Category filtering ──
function filterCategory(el, cat) {
  document.querySelectorAll('#catList .cat-item').forEach(i => i.classList.remove('active'));
  el.classList.add('active');
  state.currentCat = cat;
  state.expandedPostId = null;
  renderPosts();
}

function mobileCatSelect(el, cat) {
  document.querySelectorAll('.mobile-cat-chip').forEach(c => {
    c.classList.remove('active');
    c.setAttribute('aria-selected', 'false');
  });
  el.classList.add('active');
  el.setAttribute('aria-selected', 'true');
  state.currentCat = cat;
  state.expandedPostId = null;
  renderPosts();
  // Sync sidebar
  document.querySelectorAll('#catList .cat-item').forEach(i => {
    i.classList.toggle('active', i.dataset.cat === cat);
  });
}

// ── Write modal ──
let selectedWriteCat = 'discussion';

function selectWriteCat(el, cat) {
  if (!el) return;
  document.querySelectorAll('.cat-radio-item').forEach(item => {
    item.className = 'cat-radio-item';
    item.querySelector('input[type="radio"]').checked = false;
  });
  el.querySelector('input[type="radio"]').checked = true;
  el.classList.add('selected-' + cat);
  selectedWriteCat = cat;
}

function openWriteModal() {
  if (!currentUser || !currentExpert) {
    showToast('로그인이 필요합니다.', true);
    return;
  }
  document.getElementById('writeModal').classList.add('open');
  document.body.style.overflow = 'hidden';
  document.getElementById('writeTitle').value = '';
  document.getElementById('writeContent').value = '';
}

function closeWriteModal() {
  document.getElementById('writeModal').classList.remove('open');
  document.body.style.overflow = '';
}

async function submitPost() {
  if (!db || !currentUser || !currentExpert) {
    showToast('로그인이 필요합니다.', true);
    return;
  }

  const title = document.getElementById('writeTitle').value.trim();
  const content = document.getElementById('writeContent').value.trim();

  if (!title) {
    showToast('제목을 입력해주세요.', true);
    return;
  }
  if (!content || content.length < 10) {
    showToast('내용을 10자 이상 입력해주세요.', true);
    return;
  }

  const sanitizedTitle = sanitize(title);
  const sanitizedContent = sanitize(content);

  if (!sanitizedTitle || !sanitizedContent) {
    showToast('유효한 내용을 입력해주세요.', true);
    return;
  }

  const btn = document.getElementById('writeSubmitBtn');
  btn.disabled = true;
  btn.textContent = '등록 중...';

  const { data, error } = await db.from('ax_posts').insert({
    title: sanitizedTitle,
    content: sanitizedContent,
    category: selectedWriteCat,
    user_id: currentUser.id,
    author_name: currentExpert.name || currentUser.user_metadata?.display_name || currentUser.email?.split('@')[0] || '전문가'
  }).select().single();

  btn.disabled = false;
  btn.textContent = '등록';

  if (error) {
    console.error('submitPost error:', error);
    showToast('게시글 등록에 실패했습니다.', true);
    return;
  }

  // Prepend to local state
  if (data) {
    data.comment_count = 0;
    allPosts.unshift(data);
    updateCategoryCounts();
    renderPosts();
  }

  closeWriteModal();
  showToast('게시글이 등록되었습니다.');
}

// ── Close write modal on backdrop click ──
document.getElementById('writeModal').addEventListener('click', function(e) {
  if (e.target === this) closeWriteModal();
});

// ── Close write modal on Escape ──
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    const wm = document.getElementById('writeModal');
    if (wm.classList.contains('open')) closeWriteModal();
  }
});

// ── Init on load ──
document.addEventListener('DOMContentLoaded', initAuth);
</script>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>관리자 대시보드 — AX-On Platform</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 110'><rect rx='20' width='100' height='110' fill='%23e8920d'/><text x='50' y='38' text-anchor='middle' dominant-baseline='central' font-family='Arial Black,Impact,sans-serif' font-weight='900' font-size='65' fill='white'>A</text><text x='50' y='74' text-anchor='middle' dominant-baseline='central' font-family='Arial Black,Impact,sans-serif' font-weight='900' font-size='65' fill='white'>X</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --ink: #1a1a2e;
  --ink-muted: #5a5f7d;
  --surface: #f3f4f6;
  --surface-card: #ffffff;
  --amber: #e8920d;
  --amber-light: #f5b942;
  --teal: #0d9488;
  --coral: #e85d4a;
  --violet: #7c5ce0;
  --sky: #3b82f6;
  --radius: 16px;
  --radius-sm: 10px;
  --shadow-soft: 0 2px 12px rgba(26, 26, 46, 0.06);
  --shadow-hover: 0 8px 24px rgba(26, 26, 46, 0.1);
  --dark-bg: #002451;
  --dark-text-muted: #7285b7;
  --dark-border: rgba(114, 133, 183, 0.15);
  --border: rgba(26, 26, 46, 0.08);
}

html { scroll-behavior: smooth; }
body {
  font-family: 'Noto Sans KR', sans-serif;
  background: var(--surface);
  color: var(--ink);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* ── NAV ── */
.nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: rgba(243, 244, 246, 0.9);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(26, 26, 46, 0.06);
}
.nav-inner {
  max-width: 1280px; margin: 0 auto;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 40px; height: 64px;
}
.nav-logo {
  display: flex; align-items: center; gap: 10px;
  text-decoration: none; color: var(--ink);
}
.logo-mark {
  width: 36px; height: 36px; border-radius: 10px;
  background: linear-gradient(135deg, var(--amber), var(--amber-light));
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 12px rgba(232, 146, 13, 0.3);
}
.logo-text { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 20px; }
.logo-text span { color: var(--amber); }
.nav-badge {
  font-size: 11px; font-weight: 700; background: var(--coral); color: white;
  padding: 3px 10px; border-radius: 20px; letter-spacing: 0.5px;
}
.nav-right { display: flex; align-items: center; gap: 12px; }
.nav-user-name { font-size: 14px; font-weight: 600; color: var(--ink); }
.nav-logout-btn {
  font-size: 13px; font-weight: 600; color: var(--ink-muted);
  background: none; border: 1px solid var(--border); padding: 6px 14px;
  border-radius: 8px; cursor: pointer; font-family: 'Noto Sans KR', sans-serif;
  transition: all 0.2s;
}
.nav-logout-btn:hover { color: var(--ink); border-color: rgba(26,26,46,0.2); }

/* ── LOADING / AUTH GATE ── */
.loading-screen, .auth-gate {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 100vh; text-align: center; padding: 40px;
}
.loading-spinner {
  width: 48px; height: 48px; border: 4px solid var(--border);
  border-top-color: var(--amber); border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { margin-top: 16px; color: var(--ink-muted); font-size: 14px; }
.auth-gate-icon { font-size: 56px; margin-bottom: 16px; }
.auth-gate-title { font-size: 24px; font-weight: 900; margin-bottom: 8px; }
.auth-gate-desc { font-size: 15px; color: var(--ink-muted); margin-bottom: 24px; }
.auth-gate-btn {
  display: inline-block; padding: 12px 28px; background: var(--ink); color: white;
  border-radius: 12px; text-decoration: none; font-weight: 700; font-size: 15px;
}

/* ── DASHBOARD ── */
.dashboard { display: none; max-width: 1280px; margin: 0 auto; padding: 80px 40px 60px; }
.dash-title {
  font-family: 'Outfit', sans-serif; font-size: 28px; font-weight: 900;
  margin-bottom: 24px;
}
.dash-title span { color: var(--amber); }

/* ── STAT CARDS ── */
.stat-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 32px; }
.stat-card {
  background: var(--surface-card); border-radius: var(--radius);
  padding: 20px; text-align: center;
  border: 1px solid var(--border); transition: all 0.2s;
}
.stat-card:hover { box-shadow: var(--shadow-hover); transform: translateY(-2px); }
.stat-number { font-size: 32px; font-weight: 900; color: var(--ink); line-height: 1; margin-bottom: 4px; }
.stat-label { font-size: 13px; color: var(--ink-muted); font-weight: 600; }
.stat-card:nth-child(1) .stat-number { color: var(--sky); }
.stat-card:nth-child(2) .stat-number { color: var(--amber); }
.stat-card:nth-child(3) .stat-number { color: var(--violet); }
.stat-card:nth-child(4) .stat-number { color: var(--teal); }

/* ── TABS ── */
.tabs { display: flex; gap: 4px; margin-bottom: 20px; flex-wrap: wrap; }
.tab-btn {
  padding: 10px 20px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--surface-card); color: var(--ink-muted);
  font-size: 14px; font-weight: 600; cursor: pointer;
  font-family: 'Noto Sans KR', sans-serif; transition: all 0.2s;
}
.tab-btn:hover { color: var(--ink); border-color: rgba(26,26,46,0.15); }
.tab-btn.active { background: var(--ink); color: white; border-color: var(--ink); }
.tab-count {
  display: inline-block; font-size: 11px; background: rgba(26,26,46,0.08);
  padding: 1px 7px; border-radius: 20px; margin-left: 6px;
}
.tab-btn.active .tab-count { background: rgba(255,255,255,0.2); }

/* ── FILTER BAR ── */
.filter-bar {
  display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; align-items: center;
}
.filter-select {
  padding: 8px 14px; border: 1px solid var(--border); border-radius: 8px;
  font-size: 14px; font-family: 'Noto Sans KR', sans-serif;
  background: white; cursor: pointer;
}
.filter-search {
  flex: 1; min-width: 200px; padding: 8px 14px;
  border: 1px solid var(--border); border-radius: 8px;
  font-size: 14px; font-family: 'Noto Sans KR', sans-serif;
}
.filter-select:focus, .filter-search:focus { outline: none; border-color: var(--amber); }

/* ── ITEM LIST ── */
.item-list { display: flex; flex-direction: column; gap: 8px; }
.item-card {
  background: var(--surface-card); border: 1px solid var(--border);
  border-radius: var(--radius-sm); overflow: hidden; transition: all 0.2s;
}
.item-card:hover { border-color: rgba(26,26,46,0.15); box-shadow: var(--shadow-soft); }
.item-header {
  display: flex; align-items: center; gap: 12px; padding: 14px 20px;
  cursor: pointer; flex-wrap: wrap;
}
.item-header:hover { background: rgba(26,26,46,0.02); }
.item-type {
  font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px;
  white-space: nowrap;
}
.item-name { font-size: 14px; font-weight: 700; color: var(--ink); }
.item-sub { font-size: 12px; color: var(--ink-muted); margin-left: 4px; }
.item-date { font-size: 12px; color: var(--ink-muted); margin-left: auto; white-space: nowrap; }
.item-status {
  font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px;
  white-space: nowrap;
}
.status-pending { background: rgba(232,146,13,0.12); color: #b37400; }
.status-in_progress, .status-reviewed, .status-paid { background: rgba(59,130,246,0.12); color: #1d4ed8; }
.status-resolved, .status-approved, .status-completed { background: rgba(13,148,136,0.12); color: #0d9488; }
.status-rejected, .status-cancelled, .status-dismissed { background: rgba(232,93,74,0.12); color: #c0392b; }

/* ── ITEM DETAIL (accordion) ── */
.item-detail {
  display: none; padding: 0 20px 20px; border-top: 1px solid var(--border);
}
.item-detail.open { display: block; }
.detail-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 12px 24px;
  margin-top: 16px;
}
.detail-field {}
.detail-label { font-size: 11px; font-weight: 700; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px; }
.detail-value { font-size: 14px; color: var(--ink); word-break: break-all; }
.detail-full { grid-column: 1 / -1; }
.detail-message {
  background: rgba(26,26,46,0.03); padding: 12px 16px; border-radius: 8px;
  font-size: 14px; line-height: 1.7; white-space: pre-wrap;
}
.detail-actions {
  display: flex; gap: 12px; margin-top: 20px; flex-wrap: wrap; align-items: flex-end;
}
.action-group { display: flex; flex-direction: column; gap: 4px; }
.action-label { font-size: 11px; font-weight: 700; color: var(--ink-muted); }
.action-select {
  padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px;
  font-size: 13px; font-family: 'Noto Sans KR', sans-serif; cursor: pointer;
}
.action-select:focus { outline: none; border-color: var(--amber); }
.action-textarea {
  width: 100%; min-height: 80px; padding: 10px 14px;
  border: 1px solid var(--border); border-radius: 8px;
  font-size: 13px; font-family: 'Noto Sans KR', sans-serif;
  resize: vertical; line-height: 1.6;
}
.action-textarea:focus { outline: none; border-color: var(--amber); }
.save-btn {
  padding: 8px 20px; background: var(--amber); color: white;
  border: none; border-radius: 8px; font-size: 13px; font-weight: 700;
  cursor: pointer; font-family: 'Noto Sans KR', sans-serif;
  transition: all 0.2s; align-self: flex-end;
}
.save-btn:hover { background: #d4820b; }
.save-btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* ── EMPTY ── */
.empty-state { text-align: center; padding: 60px 20px; color: var(--ink-muted); }
.empty-icon { font-size: 48px; margin-bottom: 12px; }
.empty-text { font-size: 15px; }

/* ── TOAST ── */
.toast {
  position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%) translateY(100px);
  padding: 14px 28px; border-radius: 12px; font-size: 14px; font-weight: 600; z-index: 999;
  box-shadow: 0 8px 32px rgba(0,0,0,0.18);
  transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
  pointer-events: none;
}
.toast.success { background: var(--teal); color: white; }
.toast.error { background: var(--coral); color: white; }
.toast.show { transform: translateX(-50%) translateY(0); }

/* ── FOOTER ── */
.footer { background: var(--dark-bg); color: var(--dark-text-muted); padding: 24px 40px 16px; margin-top: 60px; }
.footer-inner { max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.footer-logo { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 20px; color: white; }
.footer-logo span { color: var(--amber); }
.footer-copyright { max-width: 1280px; margin: 6px auto 0; padding: 6px 40px 0; border-top: 1px solid var(--dark-border); text-align: center; font-size: 12px; color: var(--dark-text-muted); opacity: 0.7; }

/* ── MOBILE ── */
@media (max-width: 768px) {
  .nav-inner { padding: 0 20px; }
  .dashboard { padding: 76px 16px 40px; }
  .stat-cards { grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .stat-card { padding: 14px; }
  .stat-number { font-size: 24px; }
  .tabs { gap: 4px; }
  .tab-btn { padding: 8px 14px; font-size: 13px; }
  .filter-bar { flex-direction: column; }
  .filter-search { min-width: 0; width: 100%; }
  .item-header { padding: 12px 14px; gap: 8px; }
  .item-detail { padding: 0 14px 14px; }
  .detail-grid { grid-template-columns: 1fr; gap: 10px; }
  .detail-actions { flex-direction: column; }
  .footer { padding: 24px 16px 16px; }
}
</style>
</head>
<body>

<!-- Loading -->
<div class="loading-screen" id="loadingScreen">
  <div class="loading-spinner"></div>
  <div class="loading-text">인증 확인 중...</div>
</div>

<!-- Auth Gate -->
<div class="auth-gate" id="authGate" style="display:none;">
  <div class="auth-gate-icon">🔒</div>
  <h1 class="auth-gate-title" id="gateTitle">접근 권한이 없습니다</h1>
  <p class="auth-gate-desc" id="gateDesc">이 페이지는 관리자만 접근할 수 있습니다.</p>
  <a href="../../index.html" class="auth-gate-btn">메인으로 돌아가기</a>
</div>

<!-- Nav -->
<nav class="nav" id="adminNav" style="display:none;">
  <div class="nav-inner">
    <a href="../../index.html" class="nav-logo">
      <div class="logo-mark"><svg width="22" height="22" viewBox="0 0 40 44" xmlns="http://www.w3.org/2000/svg"><text x="20" y="16" text-anchor="middle" dominant-baseline="central" font-family="Arial Black,Impact,sans-serif" font-weight="900" font-size="28" fill="white">A</text><text x="20" y="30" text-anchor="middle" dominant-baseline="central" font-family="Arial Black,Impact,sans-serif" font-weight="900" font-size="28" fill="white">X</text></svg></div>
      <div class="logo-text">AX-<span>On</span></div>
    </a>
    <span class="nav-badge">ADMIN</span>
    <div class="nav-right">
      <span class="nav-user-name" id="adminName"></span>
      <button class="nav-logout-btn" onclick="doLogout()">로그아웃</button>
    </div>
  </div>
</nav>

<!-- Dashboard -->
<div class="dashboard" id="dashboard">
  <h1 class="dash-title">관리자 <span>대시보드</span></h1>

  <!-- Stats -->
  <div class="stat-cards">
    <div class="stat-card"><div class="stat-number" id="statTotal">0</div><div class="stat-label">총 건수</div></div>
    <div class="stat-card"><div class="stat-number" id="statPending">0</div><div class="stat-label">대기</div></div>
    <div class="stat-card"><div class="stat-number" id="statProgress">0</div><div class="stat-label">처리중</div></div>
    <div class="stat-card"><div class="stat-number" id="statDone">0</div><div class="stat-label">완료</div></div>
  </div>

  <!-- Tabs -->
  <div class="tabs" id="tabs">
    <button class="tab-btn active" data-tab="contact" onclick="switchTab('contact')">문의관리<span class="tab-count" id="cnt-contact">0</span></button>
    <button class="tab-btn" data-tab="expert" onclick="switchTab('expert')">전문가신청<span class="tab-count" id="cnt-expert">0</span></button>
    <button class="tab-btn" data-tab="enrollment" onclick="switchTab('enrollment')">수강신청<span class="tab-count" id="cnt-enrollment">0</span></button>
    <button class="tab-btn" data-tab="report" onclick="switchTab('report')">신고관리<span class="tab-count" id="cnt-report">0</span></button>
    <button class="tab-btn" data-tab="notice" onclick="switchTab('notice')">공지사항<span class="tab-count" id="cnt-notice">0</span></button>
    <button class="tab-btn" data-tab="project" onclick="switchTab('project')">프로젝트<span class="tab-count" id="cnt-project">0</span></button>
  </div>

  <!-- Filter -->
  <div class="filter-bar">
    <select class="filter-select" id="filterStatus" onchange="renderItems()">
      <option value="all">전체 상태</option>
      <option value="pending">대기</option>
      <option value="in_progress">처리중</option>
      <option value="resolved">완료</option>
    </select>
    <input type="text" class="filter-search" id="filterSearch" placeholder="이름, 이메일, 내용 검색..." oninput="renderItems()">
  </div>

  <!-- Item list -->
  <div class="item-list" id="itemList">
    <div class="empty-state"><div class="empty-icon">📋</div><div class="empty-text">데이터를 불러오는 중...</div></div>
  </div>
</div>

<footer class="footer" id="adminFooter" style="display:none;">
  <div class="footer-inner">
    <div><div class="footer-logo">AX-<span>On</span> Platform</div></div>
  </div>
  <div class="footer-copyright">&copy; 2026 AX-On Platform. Admin Dashboard.</div>
</footer>

<div class="toast" id="toast"></div>

<script src="../../js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
// ============================================================
// AX-On Admin Dashboard
// ============================================================

let db = null;
let currentUser = null;
let currentTab = 'contact';
let tabData = { contact: [], expert: [], enrollment: [], report: [], notice: [], project: [] };

// Tab config
const TAB_CONFIG = {
  contact: {
    table: 'contact_inquiries',
    statuses: ['pending', 'in_progress', 'resolved'],
    statusLabels: { pending: '대기', in_progress: '처리중', resolved: '완료' },
    fields: [
      { key: 'inquiry_type', label: '문의 유형' },
      { key: 'name', label: '이름' },
      { key: 'email', label: '이메일' },
      { key: 'phone', label: '연락처' },
      { key: 'company', label: '소속' },
      { key: 'message', label: '문의 내용', full: true, isMessage: true }
    ],
    nameKey: 'name', subKey: 'inquiry_type', typeColor: 'rgba(59,130,246,0.1)', typeTextColor: '#1d4ed8'
  },
  expert: {
    table: 'expert_applications',
    statuses: ['pending', 'approved', 'rejected'],
    statusLabels: { pending: '대기', approved: '승인', rejected: '거절' },
    fields: [
      { key: 'name', label: '이름' },
      { key: 'email', label: '이메일' },
      { key: 'phone', label: '연락처' },
      { key: 'category_id', label: '분야' },
      { key: 'career_summary', label: '경력 요약', full: true, isMessage: true },
      { key: 'portfolio_url', label: '포트폴리오' }
    ],
    nameKey: 'name', subKey: 'category_id', typeColor: 'rgba(124,92,224,0.1)', typeTextColor: '#7c5ce0'
  },
  enrollment: {
    table: 'enrollments',
    statuses: ['pending', 'paid', 'cancelled'],
    statusLabels: { pending: '대기', paid: '결제완료', cancelled: '취소' },
    fields: [
      { key: 'applicant_name', label: '신청자' },
      { key: 'email', label: '이메일' },
      { key: 'phone', label: '연락처' },
      { key: 'program_name', label: '프로그램' },
      { key: 'affiliation', label: '소속' },
      { key: 'motivation', label: '신청 동기', full: true, isMessage: true }
    ],
    nameKey: 'applicant_name', subKey: 'program_name', typeColor: 'rgba(13,148,136,0.1)', typeTextColor: '#0d9488',
    statusField: 'payment_status'
  },
  report: {
    table: 'reports',
    statuses: ['pending', 'reviewed', 'resolved', 'dismissed'],
    statusLabels: { pending: '대기', reviewed: '검토중', resolved: '처리완료', dismissed: '기각' },
    fields: [
      { key: 'target_type', label: '대상 유형' },
      { key: 'target_id', label: '대상 ID' },
      { key: 'reason', label: '신고 사유' },
      { key: 'description', label: '상세 설명', full: true, isMessage: true }
    ],
    nameKey: 'reason', subKey: 'target_type', typeColor: 'rgba(232,93,74,0.1)', typeTextColor: '#c0392b'
  },
  notice: {
    table: 'ax_posts',
    filter: { category: 'notice' },
    statuses: [],
    statusLabels: {},
    fields: [
      { key: 'title', label: '제목' },
      { key: 'author_name', label: '작성자' },
      { key: 'content', label: '내용', full: true, isMessage: true }
    ],
    nameKey: 'title', subKey: 'author_name', typeColor: 'rgba(220,38,38,0.1)', typeTextColor: '#dc2626',
    hasCreate: true
  },
  project: {
    table: 'ax_projects',
    statuses: ['active', 'completed', 'archived'],
    statusLabels: { active: '진행중', completed: '완료', archived: '보관' },
    fields: [
      { key: 'name', label: '프로젝트명' },
      { key: 'description', label: '설명', full: true, isMessage: true },
      { key: 'assigned_experts', label: '배정 전문가', isArray: true }
    ],
    nameKey: 'name', subKey: 'description', typeColor: 'rgba(124,92,224,0.1)', typeTextColor: '#7c5ce0',
    hasCreate: true
  }
};

// ── Init ──
const _sbReady = AXON_CONFIG.init().then(() => {
  if (typeof window.supabase !== 'undefined') {
    db = window.supabase.createClient(AXON_CONFIG.SUPABASE_URL, AXON_CONFIG.SUPABASE_ANON_KEY);
  }
}).catch(err => console.error('Config 초기화 실패:', err));

async function initAdmin() {
  await _sbReady;
  if (!db) { showGate('서비스에 연결할 수 없습니다.', '잠시 후 다시 시도해 주세요.'); return; }

  // 1. 로그인 확인
  const { data: { user }, error } = await db.auth.getUser();
  if (!user) {
    window.location.href = '../auth/login.html?redirect=' + encodeURIComponent(window.location.pathname);
    return;
  }

  // 2. 어드민 권한 확인 (app_metadata.role)
  const role = user.app_metadata?.role;
  if (role !== 'admin') {
    showGate('접근 권한이 없습니다', '이 페이지는 관리자만 접근할 수 있습니다.');
    return;
  }

  currentUser = user;
  const name = user.user_metadata?.display_name || user.user_metadata?.full_name || user.email?.split('@')[0] || 'Admin';
  document.getElementById('adminName').textContent = name + ' (관리자)';

  // Show dashboard
  document.getElementById('loadingScreen').style.display = 'none';
  document.getElementById('adminNav').style.display = 'block';
  document.getElementById('dashboard').style.display = 'block';
  document.getElementById('adminFooter').style.display = 'block';

  // Load all data
  await loadAllData();
  switchTab('contact');
}

function showGate(title, desc) {
  document.getElementById('loadingScreen').style.display = 'none';
  document.getElementById('gateTitle').textContent = title;
  document.getElementById('gateDesc').textContent = desc;
  document.getElementById('authGate').style.display = 'flex';
}

async function doLogout() {
  if (db) await db.auth.signOut();
  window.location.href = '../../index.html';
}

// ── Data Loading ──
async function loadAllData() {
  const promises = Object.entries(TAB_CONFIG).map(async ([tab, cfg]) => {
    let query = db.from(cfg.table).select('*').order('created_at', { ascending: false });
    if (cfg.filter) {
      Object.entries(cfg.filter).forEach(([k, v]) => { query = query.eq(k, v); });
    }
    const { data, error } = await query;
    if (error) { console.error('Load error (' + tab + '):', error); tabData[tab] = []; }
    else tabData[tab] = data || [];
  });
  await Promise.all(promises);
  updateTabCounts();
  updateStats();
}

async function reloadTab(tab) {
  const cfg = TAB_CONFIG[tab];
  let query = db.from(cfg.table).select('*').order('created_at', { ascending: false });
  if (cfg.filter) {
    Object.entries(cfg.filter).forEach(([k, v]) => { query = query.eq(k, v); });
  }
  const { data, error } = await query;
  if (!error) tabData[tab] = data || [];
  updateTabCounts();
  updateStats();
  renderItems();
}

function updateTabCounts() {
  Object.keys(tabData).forEach(tab => {
    const el = document.getElementById('cnt-' + tab);
    if (el) el.textContent = tabData[tab].length;
  });
}

function updateStats() {
  const data = tabData[currentTab];
  const cfg = TAB_CONFIG[currentTab];
  const statusField = cfg.statusField || 'status';
  const total = data.length;
  const pendingCount = data.filter(d => d[statusField] === 'pending').length;
  const doneStatuses = ['resolved', 'approved', 'completed', 'paid', 'dismissed'];
  const progressStatuses = ['in_progress', 'reviewed'];
  const progressCount = data.filter(d => progressStatuses.includes(d[statusField])).length;
  const doneCount = data.filter(d => doneStatuses.includes(d[statusField])).length;

  document.getElementById('statTotal').textContent = total;
  document.getElementById('statPending').textContent = pendingCount;
  document.getElementById('statProgress').textContent = progressCount;
  document.getElementById('statDone').textContent = doneCount;
}

// ── Tab switching ──
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));

  // Update filter options
  const cfg = TAB_CONFIG[tab];
  const filterSelect = document.getElementById('filterStatus');
  filterSelect.innerHTML = '<option value="all">전체 상태</option>';
  cfg.statuses.forEach(s => {
    filterSelect.innerHTML += '<option value="' + s + '">' + escapeHtml(cfg.statusLabels[s]) + '</option>';
  });

  document.getElementById('filterSearch').value = '';

  // Show/hide create button
  let createBtn = document.getElementById('createBtn');
  if (!createBtn) {
    createBtn = document.createElement('button');
    createBtn.id = 'createBtn';
    createBtn.className = 'tab-btn';
    createBtn.style.cssText = 'background:var(--amber);color:white;border-color:var(--amber);margin-left:auto;';
    document.getElementById('tabs').parentElement.querySelector('.filter-bar').prepend(createBtn);
  }
  if (cfg.hasCreate) {
    createBtn.style.display = 'inline-flex';
    createBtn.textContent = '+ 새로 작성';
    createBtn.onclick = () => showCreateForm(tab);
  } else {
    createBtn.style.display = 'none';
  }

  updateStats();
  renderItems();
}

// ── Render ──
function renderItems() {
  const cfg = TAB_CONFIG[currentTab];
  const statusField = cfg.statusField || 'status';
  const filterStatus = document.getElementById('filterStatus').value;
  const searchTerm = document.getElementById('filterSearch').value.toLowerCase().trim();

  let items = tabData[currentTab];

  if (filterStatus !== 'all') {
    items = items.filter(d => d[statusField] === filterStatus);
  }

  if (searchTerm) {
    items = items.filter(d => {
      return cfg.fields.some(f => {
        const val = d[f.key];
        return val && String(val).toLowerCase().includes(searchTerm);
      });
    });
  }

  const list = document.getElementById('itemList');

  if (items.length === 0) {
    list.innerHTML = '<div class="empty-state"><div class="empty-icon">📋</div><div class="empty-text">표시할 항목이 없습니다.</div></div>';
    return;
  }

  list.innerHTML = items.map(item => {
    const name = escapeHtml(item[cfg.nameKey] || '-');
    const sub = escapeHtml(item[cfg.subKey] || '');
    const status = item[statusField] || 'pending';
    const statusLabel = cfg.statusLabels[status] || status;
    const date = formatDate(item.created_at);

    return '<div class="item-card" data-id="' + item.id + '">' +
      '<div class="item-header" onclick="toggleDetail(\'' + item.id + '\')">' +
        '<span class="item-type" style="background:' + cfg.typeColor + ';color:' + cfg.typeTextColor + '">' + sub + '</span>' +
        '<span class="item-name">' + name + '</span>' +
        '<span class="item-date">' + date + '</span>' +
        '<span class="item-status status-' + status + '">' + escapeHtml(statusLabel) + '</span>' +
      '</div>' +
      '<div class="item-detail" id="detail-' + item.id + '">' +
        renderDetail(item, cfg, statusField) +
      '</div>' +
    '</div>';
  }).join('');
}

function renderDetail(item, cfg, statusField) {
  let html = '<div class="detail-grid">';

  cfg.fields.forEach(f => {
    let val = item[f.key];
    const cls = f.full ? ' detail-full' : '';
    if (f.isArray && Array.isArray(val)) val = val.join(', ');
    if (f.isMessage) {
      html += '<div class="detail-field' + cls + '"><div class="detail-label">' + escapeHtml(f.label) + '</div><div class="detail-message">' + escapeHtml(val || '-') + '</div></div>';
    } else {
      html += '<div class="detail-field' + cls + '"><div class="detail-label">' + escapeHtml(f.label) + '</div><div class="detail-value">' + escapeHtml(val || '-') + '</div></div>';
    }
  });

  // created_at, updated_at
  html += '<div class="detail-field"><div class="detail-label">접수일</div><div class="detail-value">' + formatDateTime(item.created_at) + '</div></div>';
  if (item.updated_at && item.updated_at !== item.created_at) {
    html += '<div class="detail-field"><div class="detail-label">수정일</div><div class="detail-value">' + formatDateTime(item.updated_at) + '</div></div>';
  }

  html += '</div>'; // close detail-grid

  // Actions
  if (cfg.statuses && cfg.statuses.length > 0) {
    const status = item[statusField] || 'pending';
    html += '<div class="detail-actions">' +
      '<div class="action-group">' +
        '<div class="action-label">상태 변경</div>' +
        '<select class="action-select" id="sel-' + item.id + '">' +
          cfg.statuses.map(s =>
            '<option value="' + s + '"' + (s === status ? ' selected' : '') + '>' + escapeHtml(cfg.statusLabels[s]) + '</option>'
          ).join('') +
        '</select>' +
      '</div>' +
      '<div class="action-group" style="flex:1;">' +
        '<div class="action-label">관리자 메모</div>' +
        '<textarea class="action-textarea" id="note-' + item.id + '" placeholder="관리자 메모를 입력하세요...">' + escapeHtml(item.admin_notes || '') + '</textarea>' +
      '</div>' +
      '<button class="save-btn" onclick="saveItem(\'' + item.id + '\')">저장</button>' +
    '</div>';
  } else {
    // No status management (e.g., notices) — just show delete option
    html += '<div class="detail-actions">' +
      '<button class="save-btn" style="background:var(--coral);" onclick="deleteItem(\'' + item.id + '\')">삭제</button>' +
    '</div>';
  }

  return html;
}

function toggleDetail(id) {
  const el = document.getElementById('detail-' + id);
  if (el) el.classList.toggle('open');
}

// ── Save ──
async function saveItem(id) {
  const cfg = TAB_CONFIG[currentTab];
  const statusField = cfg.statusField || 'status';
  const newStatus = document.getElementById('sel-' + id).value;
  const notes = document.getElementById('note-' + id).value.trim();

  const updateObj = { admin_notes: notes };
  updateObj[statusField] = newStatus;

  const btn = event.target;
  btn.disabled = true;
  btn.textContent = '저장 중...';

  try {
    const { error } = await db.from(cfg.table).update(updateObj).eq('id', id);
    if (error) throw error;
    showToast('저장되었습니다.', 'success');
    await reloadTab(currentTab);
  } catch(err) {
    console.error('Save error:', err);
    showToast('저장 중 오류가 발생했습니다.', 'error');
    btn.disabled = false;
    btn.textContent = '저장';
  }
}

// ── Delete item ──
async function deleteItem(id) {
  if (!confirm('정말 삭제하시겠습니까?')) return;
  const cfg = TAB_CONFIG[currentTab];
  const { error } = await db.from(cfg.table).delete().eq('id', id);
  if (error) { showToast('삭제 실패: ' + error.message, 'error'); return; }
  showToast('삭제되었습니다.', 'success');
  await reloadTab(currentTab);
}

// ── Create (공지사항 / 프로젝트) ──
function showCreateForm(tab) {
  const list = document.getElementById('itemList');

  if (tab === 'notice') {
    list.innerHTML = '<div class="item-card" style="border:2px solid var(--amber);"><div class="item-detail open" style="padding:20px;">' +
      '<h3 style="margin-bottom:16px;font-size:16px;font-weight:700;">공지사항 작성</h3>' +
      '<div class="detail-grid">' +
        '<div class="detail-field detail-full"><div class="detail-label">제목 *</div><input id="createTitle" class="action-textarea" style="min-height:auto;padding:8px 12px;" placeholder="공지 제목"></div>' +
        '<div class="detail-field detail-full"><div class="detail-label">내용 *</div><textarea id="createContent" class="action-textarea" style="min-height:120px;" placeholder="공지 내용 (최소 10자)"></textarea></div>' +
      '</div>' +
      '<div style="display:flex;gap:8px;margin-top:12px;">' +
        '<button class="save-btn" onclick="submitCreate(\'notice\')">등록</button>' +
        '<button class="save-btn" style="background:var(--ink-muted);" onclick="renderItems()">취소</button>' +
      '</div>' +
    '</div></div>' + list.innerHTML;
  } else if (tab === 'project') {
    list.innerHTML = '<div class="item-card" style="border:2px solid var(--amber);"><div class="item-detail open" style="padding:20px;">' +
      '<h3 style="margin-bottom:16px;font-size:16px;font-weight:700;">프로젝트 등록</h3>' +
      '<div class="detail-grid">' +
        '<div class="detail-field detail-full"><div class="detail-label">프로젝트명 *</div><input id="createName" class="action-textarea" style="min-height:auto;padding:8px 12px;" placeholder="프로젝트 이름"></div>' +
        '<div class="detail-field detail-full"><div class="detail-label">설명</div><textarea id="createDesc" class="action-textarea" style="min-height:80px;" placeholder="프로젝트 설명"></textarea></div>' +
        '<div class="detail-field detail-full"><div class="detail-label">배정 전문가 (쉼표 구분)</div><input id="createExperts" class="action-textarea" style="min-height:auto;padding:8px 12px;" placeholder="홍길동, 김철수"></div>' +
      '</div>' +
      '<div style="display:flex;gap:8px;margin-top:12px;">' +
        '<button class="save-btn" onclick="submitCreate(\'project\')">등록</button>' +
        '<button class="save-btn" style="background:var(--ink-muted);" onclick="renderItems()">취소</button>' +
      '</div>' +
    '</div></div>' + list.innerHTML;
  }
}

async function submitCreate(tab) {
  if (!db || !currentUser) return;

  if (tab === 'notice') {
    const title = (document.getElementById('createTitle').value || '').trim();
    const content = (document.getElementById('createContent').value || '').trim();
    if (!title) { showToast('제목을 입력해주세요.', 'error'); return; }
    if (!content || content.length < 10) { showToast('내용을 10자 이상 입력해주세요.', 'error'); return; }

    const adminName = currentUser.user_metadata?.display_name || currentUser.user_metadata?.full_name || currentUser.email?.split('@')[0] || '관리자';
    const { error } = await db.from('ax_posts').insert({
      title: escapeHtml(title),
      content: escapeHtml(content),
      category: 'notice',
      user_id: currentUser.id,
      author_name: adminName
    });
    if (error) { showToast('등록 실패: ' + error.message, 'error'); return; }
    showToast('공지사항이 등록되었습니다.', 'success');
    await reloadTab('notice');
  } else if (tab === 'project') {
    const name = (document.getElementById('createName').value || '').trim();
    const desc = (document.getElementById('createDesc').value || '').trim();
    const expertsRaw = (document.getElementById('createExperts').value || '').trim();
    if (!name) { showToast('프로젝트명을 입력해주세요.', 'error'); return; }

    const assigned_experts = expertsRaw ? expertsRaw.split(',').map(s => s.trim()).filter(Boolean) : [];
    const { error } = await db.from('ax_projects').insert({
      name: escapeHtml(name),
      description: desc ? escapeHtml(desc) : null,
      created_by: currentUser.id,
      assigned_experts: assigned_experts
    });
    if (error) { showToast('등록 실패: ' + error.message, 'error'); return; }
    showToast('프로젝트가 등록되었습니다.', 'success');
    await reloadTab('project');
  }
}

// ── Utilities ──
function formatDate(dateStr) {
  if (!dateStr) return '-';
  const d = new Date(dateStr);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function formatDateTime(dateStr) {
  if (!dateStr) return '-';
  const d = new Date(dateStr);
  return formatDate(dateStr) + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + (type || 'error');
  requestAnimationFrame(() => t.classList.add('show'));
  setTimeout(() => t.classList.remove('show'), 3000);
}

// ── Start ──
initAdmin();
</script>

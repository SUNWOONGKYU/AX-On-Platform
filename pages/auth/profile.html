<!--
@task S5F1
@description 마이페이지 — 전문가 프로필 확인/수정, AX 프로젝트 참여 내역, 커뮤니티 활동
-->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="AX-On Platform 마이페이지">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 110'><rect rx='20' width='100' height='110' fill='%23e8920d'/><text x='50' y='38' text-anchor='middle' dominant-baseline='central' font-family='Arial Black,Impact,sans-serif' font-weight='900' font-size='65' fill='white'>A</text><text x='50' y='74' text-anchor='middle' dominant-baseline='central' font-family='Arial Black,Impact,sans-serif' font-weight='900' font-size='65' fill='white'>X</text></svg>">
<title>마이페이지 — AX-On Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet">
<script src="../../js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --ink: #1a1a2e;
  --ink-muted: #5a5f7d;
  --surface: #faf9f7;
  --surface-warm: #f5f0eb;
  --surface-card: #ffffff;
  --amber: #e8920d;
  --amber-light: #f5b942;
  --amber-glow: rgba(232, 146, 13, 0.12);
  --success: #10b981;
  --danger: #ef4444;
  --info: #3b82f6;
  --border: rgba(26, 26, 46, 0.12);
  --radius: 20px;
  --radius-sm: 12px;
  --shadow-soft: 0 4px 24px rgba(26, 26, 46, 0.06);
  --shadow-hover: 0 12px 40px rgba(26, 26, 46, 0.12);
}

html { scroll-behavior: smooth; }
body {
  font-family: 'Noto Sans KR', sans-serif;
  background: var(--surface);
  color: var(--ink);
  line-height: 1.7;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ── Navigation (index.html 통일) ── */
.nav {
  position: sticky; top: 0; z-index: 100;
  background: rgba(250,249,247,0.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
}
.nav-inner {
  max-width: 1200px; margin: 0 auto;
  display: flex; align-items: center; justify-content: space-between;
  height: 64px;
}
.nav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
.logo-mark {
  width: 36px; height: 36px; border-radius: 10px;
  background: linear-gradient(135deg, var(--amber), var(--amber-light));
  display: flex; align-items: center; justify-content: center;
  font-family: 'Outfit', sans-serif; font-weight: 900; font-size: 14px; color: white;
}
.logo-text { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 20px; }
.logo-text span { color: var(--amber); }
.nav-right { display: flex; gap: 8px; align-items: center; }
.nav-link {
  padding: 8px 14px; border-radius: 10px;
  text-decoration: none; font-size: 14px; font-weight: 500; color: var(--ink-muted);
  transition: all 0.15s;
}
.nav-link:hover { background: var(--amber-glow); color: var(--amber); }
.nav-link.active { color: var(--amber); font-weight: 600; }
.nav-user-wrap { display: flex; align-items: center; gap: 8px; }
.nav-user-name {
  font-size: 14px; font-weight: 600; color: var(--ink);
  text-decoration: none; padding: 8px 12px; border-radius: 10px;
  transition: all 0.25s ease;
}
.nav-user-name:hover { background: rgba(26,26,46,0.04); }
.nav-logout-btn {
  font-size: 13px; font-weight: 600; color: var(--ink-muted);
  background: none; border: 1.5px solid rgba(26,26,46,0.12);
  padding: 6px 14px; border-radius: 10px; cursor: pointer;
  font-family: inherit; transition: all 0.25s ease;
}
.nav-logout-btn:hover { background: rgba(26,26,46,0.04); color: var(--ink); }

/* ── Layout ── */
.page-wrap {
  max-width: 1200px; margin: 0 auto; padding: 40px 24px;
  display: grid; grid-template-columns: 240px 1fr; gap: 28px;
  align-items: start;
  flex: 1;
}

/* ── Sidebar ── */
.sidebar {
  background: var(--surface-card);
  border-radius: var(--radius);
  box-shadow: var(--shadow-soft);
  border: 1px solid var(--border);
  overflow: hidden;
  position: sticky; top: 88px;
}
.profile-summary {
  padding: 28px 20px 20px;
  text-align: center;
  border-bottom: 1px solid var(--border);
}
.avatar-wrap { position: relative; display: inline-block; margin-bottom: 12px; }
.avatar {
  width: 80px; height: 80px; border-radius: 50%;
  object-fit: cover;
  background: linear-gradient(135deg, var(--amber), var(--amber-light));
  display: flex; align-items: center; justify-content: center;
  font-size: 32px; font-weight: 700; color: white;
  overflow: hidden;
}
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.avatar-edit-btn {
  position: absolute; bottom: 0; right: 0;
  width: 26px; height: 26px; border-radius: 50%;
  background: var(--amber); color: white; border: 2px solid white;
  cursor: pointer; font-size: 12px;
  display: flex; align-items: center; justify-content: center;
}
.profile-name { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
.profile-tagline { font-size: 13px; color: var(--ink-muted); margin-bottom: 8px; }
.profile-role {
  display: inline-block; padding: 3px 10px; border-radius: 20px;
  font-size: 12px; font-weight: 600;
  background: var(--amber-glow); color: var(--amber);
}

.sidebar-menu { padding: 8px; }
.menu-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; border-radius: var(--radius-sm);
  cursor: pointer; font-size: 14px; font-weight: 500;
  color: var(--ink-muted); transition: all 0.15s;
  text-decoration: none; border: none; background: none;
  width: 100%; text-align: left; font-family: inherit;
}
.menu-item:hover { background: var(--surface-warm); color: var(--ink); }
.menu-item.active { background: var(--amber-glow); color: var(--amber); font-weight: 600; }
.menu-icon { font-size: 16px; }

/* ── Main Content ── */
.main-content { min-width: 0; }
.section { display: none; }
.section.active { display: block; }

.section-title {
  font-size: 22px; font-weight: 700; margin-bottom: 24px;
  display: flex; align-items: center; gap: 10px;
}
.section-icon { font-size: 24px; }

/* ── Card ── */
.card {
  background: var(--surface-card);
  border-radius: var(--radius);
  box-shadow: var(--shadow-soft);
  border: 1px solid var(--border);
  padding: 28px;
  margin-bottom: 20px;
}
.card-subtitle {
  font-size: 15px; font-weight: 600; color: var(--ink);
  margin-bottom: 16px; padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}

/* ── Form ── */
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.form-group { display: flex; flex-direction: column; gap: 6px; }
.form-group.full { grid-column: 1 / -1; }
.form-label { font-size: 13px; font-weight: 600; color: var(--ink-muted); }
.form-input, .form-textarea, .form-select {
  padding: 10px 14px; border-radius: var(--radius-sm);
  border: 1.5px solid var(--border);
  background: var(--surface);
  font-size: 14px; font-family: inherit; color: var(--ink);
  transition: border-color 0.15s;
  width: 100%;
}
.form-input:focus, .form-textarea:focus, .form-select:focus {
  outline: none; border-color: var(--amber);
}
.form-input[readonly] { background: var(--surface-warm); color: var(--ink-muted); cursor: not-allowed; }
.form-textarea { resize: vertical; min-height: 80px; }

/* Pill select for specialties/tools */
.pill-group { display: flex; flex-wrap: wrap; gap: 8px; }
.pill-tag {
  display: inline-block; padding: 4px 12px; border-radius: 20px;
  font-size: 13px; font-weight: 500;
  background: var(--surface-warm); color: var(--ink-muted);
  border: 1px solid var(--border);
}

.btn-primary {
  padding: 12px 28px; border-radius: var(--radius-sm);
  background: var(--amber); color: white; border: none;
  font-size: 15px; font-weight: 600; font-family: inherit;
  cursor: pointer; transition: all 0.15s;
}
.btn-primary:hover { background: var(--amber-light); transform: translateY(-1px); }
.btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

.btn-secondary {
  padding: 8px 18px; border-radius: var(--radius-sm);
  background: none; color: var(--ink-muted); border: 1.5px solid var(--border);
  font-size: 13px; font-weight: 600; font-family: inherit;
  cursor: pointer; transition: all 0.15s;
}
.btn-secondary:hover { background: var(--surface-warm); color: var(--ink); }

/* ── Table ── */
.data-table { width: 100%; border-collapse: collapse; }
.data-table th {
  padding: 12px 16px; text-align: left;
  font-size: 12px; font-weight: 600; color: var(--ink-muted);
  border-bottom: 2px solid var(--border);
  white-space: nowrap;
}
.data-table td {
  padding: 14px 16px; font-size: 14px;
  border-bottom: 1px solid var(--border);
}
.data-table tr:last-child td { border-bottom: none; }
.data-table tr:hover td { background: var(--surface-warm); }

/* ── Badge ── */
.badge {
  display: inline-block; padding: 3px 10px; border-radius: 20px;
  font-size: 12px; font-weight: 600;
}
.badge-pending { background: #fef3c7; color: #92400e; }
.badge-confirmed { background: #d1fae5; color: #065f46; }
.badge-cancelled { background: #fee2e2; color: #991b1b; }
.badge-review { background: #dbeafe; color: #1e40af; }

/* ── Empty State ── */
.empty-state {
  text-align: center; padding: 48px 24px;
  color: var(--ink-muted);
}
.empty-icon { font-size: 48px; margin-bottom: 12px; }
.empty-msg { font-size: 15px; }

/* ── Alert ── */
.alert {
  padding: 12px 16px; border-radius: var(--radius-sm);
  font-size: 14px; margin-bottom: 16px;
  display: none;
}
.alert.show { display: block; }
.alert-success { background: #d1fae5; color: #065f46; border: 1px solid #6ee7b7; }
.alert-error { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }

/* ── Info Row ── */
.info-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 0; border-bottom: 1px solid rgba(26,26,46,0.06);
}
.info-row:last-child { border-bottom: none; }
.info-label { font-size: 13px; font-weight: 600; color: var(--ink-muted); min-width: 100px; }
.info-value { font-size: 14px; color: var(--ink); text-align: right; flex: 1; }

/* ── Footer ── */
footer {
  background: var(--ink); color: rgba(255,255,255,0.5);
  text-align: center; padding: 32px 24px;
  font-size: 13px; margin-top: 60px;
}
footer a { color: rgba(255,255,255,0.7); text-decoration: none; margin: 0 8px; }
footer a:hover { color: var(--amber); }

/* ── Responsive ── */
@media (max-width: 768px) {
  .page-wrap { grid-template-columns: 1fr; gap: 20px; }
  .sidebar { position: static; }
  .sidebar-menu { display: flex; gap: 4px; overflow-x: auto; padding: 8px; -webkit-overflow-scrolling: touch; }
  .menu-item { white-space: nowrap; min-height: 44px; display: flex; align-items: center; }
  .profile-summary { padding: 16px; }
  .form-grid { grid-template-columns: 1fr; }
  .data-table { font-size: 13px; }
  .data-table th, .data-table td { padding: 10px 12px; }
  .nav-user-wrap .nav-user-name { display: none; }
  .nav-user-wrap .nav-logout-btn { display: none; }
}
</style>
</head>
<body>

<!-- Navigation -->
<nav class="nav">
  <div class="nav-inner">
    <a href="../../index.html" class="nav-logo">
      <div class="logo-mark">AX</div>
      <span class="logo-text">AX-<span>On</span></span>
    </a>
    <div class="nav-right" id="navRight">
      <a href="../../pool.html" class="nav-link">전문가 풀</a>
      <a href="../../community.html" class="nav-link">커뮤니티</a>
      <!-- Auth state injected by JS -->
    </div>
  </div>
</nav>

<!-- Page Layout -->
<div class="page-wrap">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="profile-summary">
      <div class="avatar-wrap">
        <div class="avatar" id="sidebarAvatar">
          <span id="sidebarAvatarInitial">?</span>
          <img id="sidebarAvatarImg" src="" alt="" style="display:none;">
        </div>
        <button class="avatar-edit-btn" onclick="document.getElementById('avatarFileInput').click()" title="프로필 사진 변경">✏</button>
        <input type="file" id="avatarFileInput" accept="image/*" style="display:none;" onchange="handleAvatarUpload(event)">
      </div>
      <div class="profile-name" id="sidebarName">로딩 중...</div>
      <div class="profile-tagline" id="sidebarTagline"></div>
      <span class="profile-role" id="sidebarRole">AI 전문가</span>
    </div>
    <nav class="sidebar-menu">
      <button class="menu-item active" data-section="profile" onclick="switchSection('profile', this)">
        <span class="menu-icon">👤</span> 내 프로필
      </button>
      <button class="menu-item" data-section="projects" onclick="switchSection('projects', this)">
        <span class="menu-icon">🏗</span> AX 프로젝트 참여 내역
      </button>
      <button class="menu-item" data-section="community" onclick="switchSection('community', this)">
        <span class="menu-icon">💬</span> 커뮤니티 활동
      </button>
    </nav>
  </aside>

  <!-- Main Content -->
  <main class="main-content">

    <!-- Profile Section -->
    <div class="section active" id="section-profile">
      <h2 class="section-title"><span class="section-icon">👤</span> 내 프로필</h2>
      <div id="profileAlert" class="alert"></div>

      <!-- 기본 정보 (읽기 전용) -->
      <div class="card" id="profileReadCard">
        <h3 class="card-subtitle">기본 정보</h3>
        <div id="profileReadContent">
          <div class="empty-state"><div class="empty-msg">불러오는 중...</div></div>
        </div>
        <div style="margin-top: 16px; text-align: right;">
          <button class="btn-secondary" onclick="showEditMode()">프로필 수정</button>
        </div>
      </div>

      <!-- 수정 폼 (숨김) -->
      <div class="card" id="profileEditCard" style="display:none;">
        <h3 class="card-subtitle">프로필 수정</h3>
        <form id="profileForm" onsubmit="handleProfileSave(event)">
          <div class="form-grid">
            <div class="form-group">
              <label class="form-label">이름 *</label>
              <input class="form-input" id="fieldName" type="text" required minlength="2">
            </div>
            <div class="form-group">
              <label class="form-label">이메일</label>
              <input class="form-input" id="fieldEmail" type="email" readonly>
            </div>
            <div class="form-group">
              <label class="form-label">연락처 *</label>
              <input class="form-input" id="fieldPhone" type="tel" placeholder="010-0000-0000" required>
            </div>
            <div class="form-group">
              <label class="form-label">성별</label>
              <select class="form-select" id="fieldGender">
                <option value="">선택 안 함</option>
                <option value="male">남성</option>
                <option value="female">여성</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">생년월일 <span style="font-size:11px;color:var(--ink-muted);font-weight:400;">(비공개)</span></label>
              <input class="form-input" id="fieldBirth" type="date">
            </div>
            <div class="form-group full">
              <label class="form-label">한줄 소개</label>
              <input class="form-input" id="fieldTagline" type="text" placeholder="나를 한줄로 표현해주세요" maxlength="100">
            </div>
            <div class="form-group full">
              <label class="form-label">학력</label>
              <textarea class="form-textarea" id="fieldEducation" placeholder="최종학력, 전공 등"></textarea>
            </div>
            <div class="form-group full">
              <label class="form-label">경력</label>
              <textarea class="form-textarea" id="fieldCareer" placeholder="주요 경력 사항"></textarea>
            </div>
            <div class="form-group full">
              <label class="form-label">AI 경험</label>
              <textarea class="form-textarea" id="fieldAiExperience" placeholder="AI 관련 경험을 자유롭게 작성해주세요"></textarea>
            </div>
            <div class="form-group full">
              <label class="form-label">AI 프로젝트</label>
              <textarea class="form-textarea" id="fieldAiProjects" placeholder="참여했거나 진행 중인 AI 프로젝트"></textarea>
            </div>
            <div class="form-group full">
              <label class="form-label">AI 도구</label>
              <input class="form-input" id="fieldAiTools" type="text" placeholder="ChatGPT, Claude, Copilot 등 (쉼표 구분)">
            </div>
            <div class="form-group">
              <label class="form-label">챗봇 구축 가능 여부</label>
              <select class="form-select" id="fieldChatbot">
                <option value="">선택 안 함</option>
                <option value="possible">가능</option>
                <option value="impossible">불가능</option>
                <option value="learning">학습 중</option>
              </select>
            </div>
            <div class="form-group full">
              <label class="form-label">하고 싶은 일</label>
              <textarea class="form-textarea" id="fieldWantToDo" placeholder="AI를 활용하여 하고 싶은 일"></textarea>
            </div>
            <div class="form-group full">
              <label class="form-label">비전</label>
              <textarea class="form-textarea" id="fieldVision" placeholder="AI 전문가로서의 비전"></textarea>
            </div>
            <div class="form-group full">
              <label class="form-label">전문 분야 <span style="font-size:11px;color:var(--ink-muted);font-weight:400;">(쉼표 구분)</span></label>
              <input class="form-input" id="fieldSpecialties" type="text" placeholder="경영전략, 고객서비스, 제조 등">
            </div>
            <div class="form-group full">
              <label class="form-label">저서</label>
              <textarea class="form-textarea" id="fieldBooks" placeholder="저서명, 출판사 등"></textarea>
            </div>
            <div class="form-group full">
              <label class="form-label">판매 상품</label>
              <textarea class="form-textarea" id="fieldProducts" placeholder="판매 중인 상품이나 강의 등"></textarea>
            </div>
            <div class="form-group full">
              <label class="form-label">제공 서비스</label>
              <textarea class="form-textarea" id="fieldServices" placeholder="자문, 강의, 코칭 등 제공 서비스"></textarea>
            </div>
            <div class="form-group full">
              <label class="form-label">SNS 링크</label>
              <input class="form-input" id="fieldSnsLinkedin" type="url" placeholder="LinkedIn URL" style="margin-bottom:8px;">
              <input class="form-input" id="fieldSnsYoutube" type="url" placeholder="YouTube URL" style="margin-bottom:8px;">
              <input class="form-input" id="fieldSnsInstagram" type="url" placeholder="Instagram URL" style="margin-bottom:8px;">
              <input class="form-input" id="fieldSnsBlog" type="url" placeholder="블로그 URL" style="margin-bottom:8px;">
              <input class="form-input" id="fieldSnsTwitter" type="url" placeholder="X (Twitter) URL" style="margin-bottom:8px;">
              <input class="form-input" id="fieldSnsOther" type="url" placeholder="기타 URL">
            </div>
            <div class="form-group full">
              <label class="form-label">프로필 사진</label>
              <input class="form-input" id="fieldPhotoFile" type="file" accept="image/*" style="padding:8px;">
              <div id="photoPreview" style="margin-top:8px;display:none;"><img id="photoPreviewImg" style="width:80px;height:80px;border-radius:50%;object-fit:cover;border:2px solid var(--border);"></div>
            </div>
          </div>
          <div style="margin-top: 20px; display: flex; gap: 12px; justify-content: flex-end;">
            <button type="button" class="btn-secondary" onclick="hideEditMode()">취소</button>
            <button type="submit" class="btn-primary" id="saveBtn">저장하기</button>
          </div>
        </form>
      </div>

      <!-- 전문분야 카드 (읽기 전용) -->
      <div class="card" id="specialtiesCard">
        <h3 class="card-subtitle">전문분야</h3>
        <div class="pill-group" id="specialtiesList">
          <span class="pill-tag" style="color:var(--ink-muted);">등록된 전문분야가 없습니다.</span>
        </div>
      </div>
    </div>

    <!-- Projects Section -->
    <div class="section" id="section-projects">
      <h2 class="section-title"><span class="section-icon">🏗</span> AX 프로젝트 참여 내역</h2>
      <div class="card">
        <div id="projectsContent">
          <div class="empty-state"><div class="empty-icon">⏳</div><div class="empty-msg">불러오는 중...</div></div>
        </div>
      </div>
    </div>

    <!-- Community Section -->
    <div class="section" id="section-community">
      <h2 class="section-title"><span class="section-icon">💬</span> 커뮤니티 활동</h2>
      <div class="card">
        <div id="communityContent">
          <div class="empty-state"><div class="empty-icon">⏳</div><div class="empty-msg">불러오는 중...</div></div>
        </div>
      </div>
    </div>

  </main>
</div>

<script>
// ── State ──
let db = null;
let currentUser = null;
let expertData = null;

// ── Supabase 초기화 ──
const _sbReady = AXON_CONFIG.init().then(() => {
  if (typeof window.supabase !== 'undefined') {
    const { createClient } = supabase;
    db = createClient(AXON_CONFIG.SUPABASE_URL, AXON_CONFIG.SUPABASE_ANON_KEY);
  }
}).catch(err => console.error('Config 초기화 실패:', err));

// ── Init ──
(async function init() {
  try {
    await _sbReady;
    if (!db) throw new Error('Supabase 클라이언트 초기화 실패');

    const { data: { session } } = await db.auth.getSession();
    if (!session) {
      window.location.href = 'login.html?redirect=' + encodeURIComponent(window.location.pathname);
      return;
    }
    currentUser = session.user;
    await loadExpertProfile();
    updateNavAuth();
  } catch (err) {
    console.error('초기화 오류:', err);
    window.location.href = 'login.html';
  }
})();

// ── Nav Auth (index.html 패턴 통일) ──
function updateNavAuth() {
  if (!currentUser) return;
  const displayName = escapeHtml(
    (expertData && expertData.name) ||
    currentUser.user_metadata?.full_name ||
    currentUser.user_metadata?.name ||
    currentUser.email?.split('@')[0] || '사용자'
  );
  const navRight = document.getElementById('navRight');
  const userWrap = document.createElement('div');
  userWrap.className = 'nav-user-wrap';
  userWrap.innerHTML = '<a href="profile.html" class="nav-user-name">' + displayName + '님</a>' +
    '<button class="nav-logout-btn" id="navLogoutBtn">로그아웃</button>';
  navRight.appendChild(userWrap);

  document.getElementById('navLogoutBtn').addEventListener('click', async () => {
    await db.auth.signOut();
    window.location.href = '../../index.html';
  });

  // 관리자 링크
  injectAdminLink(currentUser);
}

// ── Load Expert Profile (ax_experts 테이블) ──
async function loadExpertProfile() {
  const { data: expert, error } = await db
    .from('ax_experts')
    .select('*')
    .eq('user_id', currentUser.id)
    .maybeSingle();

  if (error) {
    console.error('전문가 프로필 로드 오류:', error);
  }

  expertData = expert;

  // 전문가 미등록 시
  if (!expertData) {
    document.getElementById('sidebarName').textContent =
      currentUser.user_metadata?.full_name || currentUser.email?.split('@')[0] || '사용자';
    document.getElementById('sidebarRole').textContent = '미등록';
    document.getElementById('sidebarRole').style.background = 'rgba(90,95,125,0.1)';
    document.getElementById('sidebarRole').style.color = 'var(--ink-muted)';
    document.getElementById('profileReadContent').innerHTML =
      '<div class="empty-state"><div class="empty-icon">📋</div>' +
      '<div class="empty-msg">전문가로 등록되지 않았습니다.<br><a href="../../pool.html" style="color:var(--amber);font-weight:600;">전문가 등록하기</a></div></div>';
    document.querySelector('#profileReadCard .btn-secondary').style.display = 'none';
    document.getElementById('specialtiesCard').style.display = 'none';
    return;
  }

  // Sidebar 업데이트
  document.getElementById('sidebarName').textContent = expertData.name || '전문가';
  document.getElementById('sidebarTagline').textContent = expertData.tagline || '';

  if (expertData.profile_image_url) {
    const img = document.getElementById('sidebarAvatarImg');
    img.src = expertData.profile_image_url;
    img.alt = expertData.name;
    img.style.display = 'block';
    document.getElementById('sidebarAvatarInitial').style.display = 'none';
  } else {
    document.getElementById('sidebarAvatarInitial').textContent =
      (expertData.name || '?').charAt(0).toUpperCase();
  }

  // 읽기 전용 프로필 카드
  renderProfileRead();

  // 전문분야 카드
  renderSpecialties();
}

// ── Render Profile (Read Mode) ──
function renderProfileRead() {
  if (!expertData) return;
  const e = expertData;
  const genderLabels = { male: '남성', female: '여성' };
  const chatbotLabels = { possible: '가능', impossible: '불가능', learning: '학습 중' };

  const multiline = ['학력','경력','AI 경험','AI 프로젝트','하고 싶은 일','비전','저서','판매 상품','제공 서비스'];

  function rowHtml(label, value, isMulti) {
    const dv = value
      ? (isMulti ? '<span style="white-space:pre-wrap;">' + escapeHtml(String(value)) + '</span>' : escapeHtml(String(value)))
      : '<span style="color:var(--ink-muted);">-</span>';
    return '<div class="info-row"><span class="info-label">' + escapeHtml(label) + '</span><span class="info-value">' + dv + '</span></div>';
  }

  let html = '';
  html += rowHtml('이름', e.name);
  html += rowHtml('이메일', e.email);
  html += rowHtml('연락처', e.phone);
  html += rowHtml('성별', genderLabels[e.gender]);
  html += rowHtml('생년월일', e.birth_date);
  html += rowHtml('한줄 소개', e.tagline);
  html += rowHtml('학력', e.education, true);
  html += rowHtml('경력', e.career, true);
  html += rowHtml('AI 경험', e.ai_experience, true);
  html += rowHtml('AI 프로젝트', e.ai_projects, true);
  html += rowHtml('AI 도구', Array.isArray(e.ai_tools) && e.ai_tools.length ? e.ai_tools.join(', ') : null);
  html += rowHtml('전문 분야', Array.isArray(e.specialties) && e.specialties.length ? e.specialties.join(', ') : null);
  html += rowHtml('챗봇 구축', chatbotLabels[e.can_build_chatbot]);
  html += rowHtml('하고 싶은 일', e.want_to_do, true);
  html += rowHtml('비전', e.vision, true);
  html += rowHtml('저서', e.books, true);
  html += rowHtml('판매 상품', e.products, true);
  html += rowHtml('제공 서비스', e.services, true);

  // SNS 링크
  const sns = e.sns_links || {};
  const snsItems = [
    ['LinkedIn', sns.linkedin], ['YouTube', sns.youtube], ['Instagram', sns.instagram],
    ['블로그', sns.blog], ['X(Twitter)', sns.twitter], ['기타', sns.other]
  ].filter(([, url]) => url);
  if (snsItems.length) {
    const snsHtml = snsItems.map(([n, url]) => '<a href="' + escapeHtml(url) + '" target="_blank" rel="noopener" style="color:var(--amber);margin-right:12px;">' + escapeHtml(n) + '</a>').join('');
    html += '<div class="info-row"><span class="info-label">SNS</span><span class="info-value">' + snsHtml + '</span></div>';
  } else {
    html += rowHtml('SNS', null);
  }

  document.getElementById('profileReadContent').innerHTML = html;
}

// ── Render Specialties ──
function renderSpecialties() {
  const container = document.getElementById('specialtiesList');
  if (!expertData || !Array.isArray(expertData.specialties) || !expertData.specialties.length) {
    container.innerHTML = '<span class="pill-tag" style="color:var(--ink-muted);">등록된 전문분야가 없습니다.</span>';
    return;
  }
  container.innerHTML = expertData.specialties
    .map(s => '<span class="pill-tag" style="background:var(--amber-glow);color:var(--amber);border-color:transparent;">' + escapeHtml(s) + '</span>')
    .join('');
}

// ── Edit Mode Toggle ──
function showEditMode() {
  if (!expertData) return;
  document.getElementById('profileReadCard').style.display = 'none';
  document.getElementById('profileEditCard').style.display = 'block';

  // 폼에 기존값 채우기
  document.getElementById('fieldName').value = expertData.name || '';
  document.getElementById('fieldEmail').value = expertData.email || '';
  document.getElementById('fieldPhone').value = expertData.phone || '';
  document.getElementById('fieldGender').value = expertData.gender || '';
  document.getElementById('fieldBirth').value = expertData.birth_date || '';
  document.getElementById('fieldTagline').value = expertData.tagline || '';
  document.getElementById('fieldEducation').value = expertData.education || '';
  document.getElementById('fieldCareer').value = expertData.career || '';
  document.getElementById('fieldAiExperience').value = expertData.ai_experience || '';
  document.getElementById('fieldAiProjects').value = expertData.ai_projects || '';
  document.getElementById('fieldAiTools').value = Array.isArray(expertData.ai_tools) ? expertData.ai_tools.join(', ') : '';
  document.getElementById('fieldChatbot').value = expertData.can_build_chatbot || '';
  document.getElementById('fieldWantToDo').value = expertData.want_to_do || '';
  document.getElementById('fieldVision').value = expertData.vision || '';

  document.getElementById('fieldSpecialties').value = Array.isArray(expertData.specialties) ? expertData.specialties.join(', ') : '';
  document.getElementById('fieldBooks').value = expertData.books || '';
  document.getElementById('fieldProducts').value = expertData.products || '';
  document.getElementById('fieldServices').value = expertData.services || '';

  // SNS
  const sns = expertData.sns_links || {};
  document.getElementById('fieldSnsLinkedin').value = sns.linkedin || '';
  document.getElementById('fieldSnsYoutube').value = sns.youtube || '';
  document.getElementById('fieldSnsInstagram').value = sns.instagram || '';
  document.getElementById('fieldSnsBlog').value = sns.blog || '';
  document.getElementById('fieldSnsTwitter').value = sns.twitter || '';
  document.getElementById('fieldSnsOther').value = sns.other || '';

  // 사진 미리보기
  if (expertData.profile_image_url) {
    document.getElementById('photoPreview').style.display = 'block';
    document.getElementById('photoPreviewImg').src = expertData.profile_image_url;
  }
}

// 사진 미리보기 이벤트
document.getElementById('fieldPhotoFile').addEventListener('change', function() {
  const file = this.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    document.getElementById('photoPreview').style.display = 'block';
    document.getElementById('photoPreviewImg').src = e.target.result;
  };
  reader.readAsDataURL(file);
});

function hideEditMode() {
  document.getElementById('profileEditCard').style.display = 'none';
  document.getElementById('profileReadCard').style.display = 'block';
}

// ── Save Profile (ax_experts UPDATE) ──
async function handleProfileSave(event) {
  event.preventDefault();
  if (!db || !currentUser || !expertData) return;

  const saveBtn = document.getElementById('saveBtn');
  saveBtn.disabled = true;
  saveBtn.textContent = '저장 중...';

  const name = DOMPurify.sanitize(document.getElementById('fieldName').value.trim());
  const phone = DOMPurify.sanitize(document.getElementById('fieldPhone').value.trim());
  const gender = document.getElementById('fieldGender').value || null;
  const birth_date = document.getElementById('fieldBirth').value || null;
  const tagline = DOMPurify.sanitize(document.getElementById('fieldTagline').value.trim()) || null;
  const education = DOMPurify.sanitize(document.getElementById('fieldEducation').value.trim()) || null;
  const career = DOMPurify.sanitize(document.getElementById('fieldCareer').value.trim()) || null;
  const ai_experience = DOMPurify.sanitize(document.getElementById('fieldAiExperience').value.trim()) || null;
  const ai_projects = DOMPurify.sanitize(document.getElementById('fieldAiProjects').value.trim()) || null;
  const ai_tools_raw = document.getElementById('fieldAiTools').value.trim();
  const ai_tools = ai_tools_raw ? ai_tools_raw.split(',').map(s => DOMPurify.sanitize(s.trim())).filter(Boolean) : [];
  const can_build_chatbot = document.getElementById('fieldChatbot').value || null;
  const want_to_do = DOMPurify.sanitize(document.getElementById('fieldWantToDo').value.trim()) || null;
  const vision = DOMPurify.sanitize(document.getElementById('fieldVision').value.trim()) || null;

  const specialties_raw = document.getElementById('fieldSpecialties').value.trim();
  const specialties = specialties_raw ? specialties_raw.split(',').map(s => DOMPurify.sanitize(s.trim())).filter(Boolean) : [];
  const books = DOMPurify.sanitize(document.getElementById('fieldBooks').value.trim()) || null;
  const products = DOMPurify.sanitize(document.getElementById('fieldProducts').value.trim()) || null;
  const services = DOMPurify.sanitize(document.getElementById('fieldServices').value.trim()) || null;

  const sns_links = {};
  const linkedin = document.getElementById('fieldSnsLinkedin').value.trim();
  const youtube = document.getElementById('fieldSnsYoutube').value.trim();
  const instagram = document.getElementById('fieldSnsInstagram').value.trim();
  const blog = document.getElementById('fieldSnsBlog').value.trim();
  const twitter = document.getElementById('fieldSnsTwitter').value.trim();
  const other = document.getElementById('fieldSnsOther').value.trim();
  if (linkedin && isSafeUrl(linkedin)) sns_links.linkedin = linkedin;
  if (youtube && isSafeUrl(youtube)) sns_links.youtube = youtube;
  if (instagram && isSafeUrl(instagram)) sns_links.instagram = instagram;
  if (blog && isSafeUrl(blog)) sns_links.blog = blog;
  if (twitter && isSafeUrl(twitter)) sns_links.twitter = twitter;
  if (other && isSafeUrl(other)) sns_links.other = other;

  // 사진 업로드
  let profile_image_url = expertData.profile_image_url || null;
  const photoFile = document.getElementById('fieldPhotoFile').files[0];
  if (photoFile && db) {
    try {
      const ext = photoFile.name.split('.').pop();
      const path = 'profiles/' + currentUser.id + '.' + ext;
      const { error: upErr } = await db.storage.from('expert-photos').upload(path, photoFile, { upsert: true });
      if (!upErr) {
        const { data: urlData } = db.storage.from('expert-photos').getPublicUrl(path);
        if (urlData?.publicUrl) profile_image_url = urlData.publicUrl;
      }
    } catch(e) { console.error('사진 업로드 오류:', e); }
  }

  if (!name || name.length < 2) {
    showAlert('profileAlert', '이름은 2자 이상 입력해주세요.', 'error');
    saveBtn.disabled = false;
    saveBtn.textContent = '저장하기';
    return;
  }

  const updates = {
    name, phone, gender, birth_date, tagline, education, career,
    ai_experience, ai_projects,
    ai_tools: ai_tools.length ? ai_tools : [],
    specialties: specialties.length ? specialties : [],
    can_build_chatbot,
    want_to_do, vision,
    books, products, services,
    profile_image_url,
    sns_links: Object.keys(sns_links).length ? sns_links : {}
  };

  const { error } = await db.from('ax_experts')
    .update(updates)
    .eq('user_id', currentUser.id);

  saveBtn.disabled = false;
  saveBtn.textContent = '저장하기';

  if (error) {
    showAlert('profileAlert', '저장 중 오류가 발생했습니다: ' + error.message, 'error');
  } else {
    showAlert('profileAlert', '프로필이 저장되었습니다.', 'success');
    await loadExpertProfile();
    hideEditMode();
  }
}

// ── Avatar Upload (ax_experts.profile_image_url) ──
async function handleAvatarUpload(event) {
  const file = event.target.files[0];
  if (!file || !db || !currentUser) return;

  const maxSize = 5 * 1024 * 1024;
  const allowedTypes = ['image/jpeg', 'image/png', 'image/gif', 'image/webp'];

  if (!allowedTypes.includes(file.type)) {
    alert('JPG, PNG, GIF, WEBP 형식만 업로드 가능합니다.');
    return;
  }
  if (file.size > maxSize) {
    alert('파일 크기는 5MB 이하여야 합니다.');
    return;
  }

  const ext = file.name.split('.').pop().toLowerCase();
  const path = 'avatars/' + currentUser.id + '/avatar.' + ext;

  const { error: uploadError } = await db.storage
    .from('community-images')
    .upload(path, file, { upsert: true });

  if (uploadError) {
    alert('사진 업로드 실패: ' + uploadError.message);
    return;
  }

  const { data: urlData } = db.storage.from('community-images').getPublicUrl(path);
  if (!urlData?.publicUrl) return;

  const { error: updateError } = await db.from('ax_experts')
    .update({ profile_image_url: urlData.publicUrl })
    .eq('user_id', currentUser.id);

  if (updateError) {
    alert('사진 URL 저장 실패: ' + updateError.message);
  } else {
    showAlert('profileAlert', '프로필 사진이 변경되었습니다.', 'success');
    await loadExpertProfile();
  }
}

// ── Load Enrollments ──
async function loadEnrollments() {
  if (!db || !currentUser) return;
  const container = document.getElementById('enrollmentsContent');

  const { data, error } = await db
    .from('enrollments')
    .select('*')
    .eq('user_id', currentUser.id)
    .order('created_at', { ascending: false });

  if (error) {
    container.innerHTML = '<div class="empty-state"><div class="empty-icon">⚠</div><div class="empty-msg">데이터를 불러오지 못했습니다.</div></div>';
    return;
  }

  if (!data || !data.length) {
    container.innerHTML = '<div class="empty-state"><div class="empty-icon">📚</div><div class="empty-msg">수강 신청 내역이 없습니다.</div></div>';
    return;
  }

  const statusBadge = (s) => {
    const map = { pending: ['badge-pending', '대기 중'], paid: ['badge-confirmed', '결제 완료'], cancelled: ['badge-cancelled', '취소'] };
    const [cls, label] = map[s] || ['badge-pending', s];
    return '<span class="badge ' + cls + '">' + escapeHtml(label) + '</span>';
  };

  container.innerHTML = '<table class="data-table">' +
    '<thead><tr><th>프로그램명</th><th>신청일</th><th>상태</th></tr></thead>' +
    '<tbody>' + data.map(r =>
      '<tr><td>' + escapeHtml(r.program_name || r.program_id || '-') + '</td>' +
      '<td>' + (r.created_at ? new Date(r.created_at).toLocaleDateString('ko-KR') : '-') + '</td>' +
      '<td>' + statusBadge(r.status || r.payment_status) + '</td></tr>'
    ).join('') + '</tbody></table>';
}

// ── Load Projects ──
async function loadProjects() {
  if (!db || !currentUser) return;
  const container = document.getElementById('projectsContent');

  const { data, error } = await db
    .from('ax_project_requests')
    .select('*')
    .eq('user_id', currentUser.id)
    .order('created_at', { ascending: false });

  if (error) {
    container.innerHTML = '<div class="empty-state"><div class="empty-icon">⚠</div><div class="empty-msg">데이터를 불러오지 못했습니다.</div></div>';
    return;
  }

  if (!data || !data.length) {
    container.innerHTML = '<div class="empty-state"><div class="empty-icon">🏗</div><div class="empty-msg">AX 프로젝트 접수 내역이 없습니다.</div></div>';
    return;
  }

  const statusBadge = (s) => {
    const map = { pending: ['badge-pending', '검토 중'], in_review: ['badge-review', '심사 중'], confirmed: ['badge-confirmed', '확정'], rejected: ['badge-cancelled', '반려'] };
    const [cls, label] = map[s] || ['badge-pending', s || '-'];
    return '<span class="badge ' + cls + '">' + escapeHtml(label) + '</span>';
  };

  container.innerHTML = '<table class="data-table">' +
    '<thead><tr><th>프로젝트명</th><th>접수일</th><th>처리 상태</th></tr></thead>' +
    '<tbody>' + data.map(r =>
      '<tr><td>' + escapeHtml(r.project_name || r.title || '-') + '</td>' +
      '<td>' + (r.created_at ? new Date(r.created_at).toLocaleDateString('ko-KR') : '-') + '</td>' +
      '<td>' + statusBadge(r.status) + '</td></tr>'
    ).join('') + '</tbody></table>';
}

// ── Load Community Posts (ax_posts 테이블) ──
async function loadCommunityPosts() {
  if (!db || !currentUser) return;
  const container = document.getElementById('communityContent');

  const { data, error } = await db
    .from('ax_posts')
    .select('id, title, category, created_at')
    .eq('user_id', currentUser.id)
    .order('created_at', { ascending: false })
    .limit(50);

  if (error) {
    container.innerHTML = '<div class="empty-state"><div class="empty-icon">⚠</div><div class="empty-msg">데이터를 불러오지 못했습니다.</div></div>';
    return;
  }

  if (!data || !data.length) {
    container.innerHTML = '<div class="empty-state"><div class="empty-icon">💬</div><div class="empty-msg">작성한 게시글이 없습니다.</div></div>';
    return;
  }

  const CATEGORY_LABELS = {
    notice: '공지사항', discussion: '자유토론',
    reference: '참고자료', knowledge: '지식Hub'
  };

  container.innerHTML = '<table class="data-table">' +
    '<thead><tr><th>제목</th><th>카테고리</th><th>작성일</th></tr></thead>' +
    '<tbody>' + data.map(r =>
      '<tr><td><a href="../../community.html" style="color:var(--ink);text-decoration:none;font-weight:500;">' + escapeHtml(r.title || '-') + '</a></td>' +
      '<td style="color:var(--ink-muted);font-size:13px;">' + escapeHtml(CATEGORY_LABELS[r.category] || r.category || '-') + '</td>' +
      '<td style="color:var(--ink-muted);font-size:13px;">' + (r.created_at ? new Date(r.created_at).toLocaleDateString('ko-KR') : '-') + '</td></tr>'
    ).join('') + '</tbody></table>';
}

// ── Section Switch ──
function switchSection(name, btn) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
  document.getElementById('section-' + name).classList.add('active');
  btn.classList.add('active');

  if (name === 'enrollments') loadEnrollments();
  if (name === 'projects') loadProjects();
  if (name === 'community') loadCommunityPosts();
}

// ── Utils ──
function showAlert(id, msg, type) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = msg;
  el.className = 'alert show alert-' + type;
  setTimeout(() => { el.classList.remove('show'); }, 4000);
}

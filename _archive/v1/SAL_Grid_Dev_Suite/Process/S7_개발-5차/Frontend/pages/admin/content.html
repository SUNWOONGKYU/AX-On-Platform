<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>콘텐츠 관리 - AX-On Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/admin-common.css">
    <style>
        :root {
            --ink: #1a1a2e;
            --ink-muted: #6b7094;
            --surface: #f8f9fc;
            --surface-warm: #faf8f5;
            --surface-card: #ffffff;
            --amber: #f59e0b;
            --teal: #14b8a6;
            --coral: #f97316;
            --violet: #8b5cf6;
            --sky: #0ea5e9;
            --red: #ef4444;
            --green: #22c55e;
            --radius: 16px;
            --radius-sm: 10px;
            --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,.07), 0 2px 4px -2px rgba(0,0,0,.05);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,.08), 0 4px 6px -4px rgba(0,0,0,.05);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Sans KR', 'Outfit', sans-serif;
            background: var(--surface);
            color: var(--ink);
            line-height: 1.6;
        }

        /* ── Nav ── */
        .nav {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            background: rgba(255,255,255,.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0,0,0,.06);
            box-shadow: var(--shadow);
        }
        .nav-inner {
            max-width: 1400px; margin: 0 auto;
            padding: 0 2rem; height: 64px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .nav-logo {
            font-family: 'Outfit', sans-serif;
            font-weight: 700; font-size: 1.25rem;
            color: var(--ink); text-decoration: none; display: flex; align-items: center; gap: .5rem;
        }
        .nav-logo .badge-admin {
            background: var(--violet); color: #fff;
            font-size: .65rem; font-weight: 700;
            padding: .2rem .5rem; border-radius: 5px; letter-spacing: .5px;
        }
        .nav-links { display: flex; gap: 1.5rem; align-items: center; }
        .nav-links a {
            text-decoration: none; color: var(--ink-muted);
            font-size: .85rem; font-weight: 500; transition: color .2s;
        }
        .nav-links a:hover, .nav-links a.active { color: var(--violet); }
        .nav-links a.active { font-weight: 600; }
        .nav-right { display: flex; gap: .75rem; align-items: center; }
        .btn-logout {
            padding: .45rem 1rem; border-radius: var(--radius-sm);
            border: 1px solid rgba(0,0,0,.1); background: transparent;
            color: var(--ink-muted); font-size: .8rem; font-weight: 500;
            cursor: pointer; transition: all .2s;
        }
        .btn-logout:hover { border-color: var(--red); color: var(--red); }

        /* ── Page Header ── */
        .page-header {
            margin-top: 64px;
            padding: 2.5rem 2rem 2rem;
            background: linear-gradient(135deg, #1a1a2e 0%, #2d1b69 100%);
            color: #fff;
        }
        .page-header-inner { max-width: 1400px; margin: 0 auto; }
        .page-header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.65rem; font-weight: 700;
        }
        .page-header p {
            color: rgba(255,255,255,.65); margin-top: .4rem; font-size: .9rem;
        }

        /* ── Content Wrapper ── */
        .content {
            max-width: 1400px; margin: 0 auto; padding: 2rem;
        }

        /* ── Stats Row ── */
        .stats-row {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem;
            margin-bottom: 2rem;
        }
        .stat-card {
            background: var(--surface-card); border-radius: var(--radius);
            padding: 1.25rem 1.5rem; box-shadow: var(--shadow);
            display: flex; align-items: center; gap: 1rem;
        }
        .stat-icon {
            width: 44px; height: 44px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; flex-shrink: 0;
        }
        .stat-icon.posts  { background: rgba(139,92,246,.12); color: var(--violet); }
        .stat-icon.cmts   { background: rgba(14,165,233,.12); color: var(--sky); }
        .stat-icon.del    { background: rgba(239,68,68,.12);  color: var(--red); }
        .stat-icon.rpt    { background: rgba(245,158,11,.12); color: var(--amber); }
        .stat-info .label { font-size: .75rem; color: var(--ink-muted); font-weight: 500; }
        .stat-info .value {
            font-family: 'Outfit', sans-serif;
            font-size: 1.6rem; font-weight: 700; line-height: 1.2;
        }

        /* ── Tab Bar ── */
        .tab-bar {
            display: flex; gap: 0; margin-bottom: 1.5rem;
            background: var(--surface-card); border-radius: var(--radius);
            box-shadow: var(--shadow); overflow: hidden;
        }
        .tab-btn {
            flex: 1; padding: .85rem 1.5rem;
            border: none; background: transparent;
            font-family: 'Noto Sans KR', sans-serif;
            font-size: .9rem; font-weight: 500; cursor: pointer;
            color: var(--ink-muted); transition: all .2s;
            border-bottom: 3px solid transparent;
        }
        .tab-btn:hover { color: var(--violet); background: rgba(139,92,246,.04); }
        .tab-btn.active {
            color: var(--violet); font-weight: 700;
            border-bottom-color: var(--violet);
            background: rgba(139,92,246,.06);
        }

        /* ── Filters ── */
        .filters {
            background: var(--surface-card); border-radius: var(--radius);
            padding: 1.25rem 1.5rem; box-shadow: var(--shadow);
            display: flex; gap: 1rem; flex-wrap: wrap; align-items: flex-end;
            margin-bottom: 1.5rem;
        }
        .filter-group {
            display: flex; flex-direction: column; gap: .4rem; min-width: 160px;
        }
        .filter-group.flex-grow { flex: 1; min-width: 220px; }
        .filter-group label {
            font-size: .72rem; font-weight: 600; color: var(--ink-muted);
            text-transform: uppercase; letter-spacing: .5px;
        }
        .filter-group input,
        .filter-group select {
            padding: .55rem .9rem; border: 1px solid rgba(0,0,0,.1);
            border-radius: var(--radius-sm); font-size: .88rem;
            font-family: 'Noto Sans KR', sans-serif;
            background: var(--surface); outline: none; transition: border-color .2s;
        }
        .filter-group input:focus,
        .filter-group select:focus { border-color: var(--violet); }
        .filter-actions {
            display: flex; gap: .5rem; align-items: flex-end;
        }
        .btn-search {
            padding: .55rem 1.25rem; border-radius: var(--radius-sm);
            border: none; background: var(--violet); color: #fff;
            font-size: .88rem; font-weight: 600; cursor: pointer; transition: opacity .2s;
        }
        .btn-search:hover { opacity: .88; }
        .btn-reset {
            padding: .55rem 1rem; border-radius: var(--radius-sm);
            border: 1px solid rgba(0,0,0,.1); background: transparent;
            font-size: .88rem; cursor: pointer; color: var(--ink-muted); transition: all .2s;
        }
        .btn-reset:hover { background: var(--surface); }

        /* ── Table ── */
        .table-wrap {
            background: var(--surface-card); border-radius: var(--radius);
            box-shadow: var(--shadow); overflow: hidden;
        }
        .table-meta {
            padding: 1rem 1.5rem;
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid rgba(0,0,0,.05);
        }
        .table-meta .count { font-size: .85rem; color: var(--ink-muted); }
        .table-meta .count strong { color: var(--ink); font-weight: 700; }
        table {
            width: 100%; border-collapse: collapse;
        }
        th {
            padding: .8rem 1rem; text-align: left;
            font-size: .72rem; font-weight: 700; color: var(--ink-muted);
            text-transform: uppercase; letter-spacing: .5px;
            background: var(--surface); border-bottom: 1px solid rgba(0,0,0,.06);
            white-space: nowrap;
        }
        td {
            padding: .8rem 1rem; font-size: .88rem;
            border-bottom: 1px solid rgba(0,0,0,.04);
            vertical-align: middle;
        }
        tr:last-child td { border-bottom: none; }
        tbody tr:hover td { background: rgba(139,92,246,.02); cursor: pointer; }
        .col-num { width: 55px; color: var(--ink-muted); font-size: .82rem; }
        .col-title { max-width: 280px; }
        .col-title .title-text {
            font-weight: 600; white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis;
            display: block; max-width: 260px;
        }
        .col-title .title-text:hover { color: var(--violet); }
        .col-content { max-width: 240px; }
        .col-content .content-text {
            color: var(--ink-muted); white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis;
            display: block; max-width: 220px; font-size: .83rem;
        }
        .col-author { font-weight: 500; white-space: nowrap; }
        .col-date { color: var(--ink-muted); font-size: .82rem; white-space: nowrap; }
        .col-num-val { font-family: 'Outfit', sans-serif; font-size: .85rem; color: var(--ink-muted); }
        .col-actions { white-space: nowrap; display: flex; gap: .35rem; flex-wrap: nowrap; }

        /* ── Badge ── */
        .badge {
            display: inline-flex; align-items: center; gap: .25rem;
            padding: .22rem .65rem; border-radius: 20px;
            font-size: .72rem; font-weight: 600; white-space: nowrap;
        }
        .badge.normal  { background: rgba(34,197,94,.1);  color: #15803d; }
        .badge.deleted { background: rgba(239,68,68,.1);  color: #b91c1c; }
        .badge.reported{ background: rgba(245,158,11,.1); color: #b45309; }
        .badge.pinned  { background: rgba(139,92,246,.1); color: #6d28d9; }
        .badge.hot     { background: rgba(249,115,22,.1); color: #c2410c; }

        /* ── Action Buttons ── */
        .act-btn {
            padding: .28rem .65rem; border-radius: 6px;
            border: 1px solid rgba(0,0,0,.1); background: transparent;
            font-size: .75rem; font-weight: 500; cursor: pointer;
            color: var(--ink-muted); transition: all .2s; white-space: nowrap;
        }
        .act-btn:hover { background: var(--surface); color: var(--ink); }
        .act-btn.danger:hover  { border-color: var(--red);  color: var(--red); }
        .act-btn.primary:hover { border-color: var(--violet); color: var(--violet); }
        .act-btn.success:hover { border-color: var(--green); color: var(--green); }
        .act-btn.amber:hover   { border-color: var(--amber); color: var(--amber); }

        /* ── Pagination ── */
        .pagination {
            display: flex; align-items: center; justify-content: center;
            gap: .4rem; padding: 1.25rem;
            border-top: 1px solid rgba(0,0,0,.05);
        }
        .page-btn {
            width: 34px; height: 34px; border-radius: 8px;
            border: 1px solid rgba(0,0,0,.1); background: transparent;
            font-size: .85rem; cursor: pointer; transition: all .2s;
            display: flex; align-items: center; justify-content: center;
            color: var(--ink-muted);
        }
        .page-btn:hover { border-color: var(--violet); color: var(--violet); }
        .page-btn.active {
            background: var(--violet); border-color: var(--violet);
            color: #fff; font-weight: 700;
        }
        .page-btn:disabled { opacity: .35; cursor: default; }

        /* ── Empty State ── */
        .empty-state {
            text-align: center; padding: 4rem 2rem; color: var(--ink-muted);
        }
        .empty-state .icon { font-size: 2.5rem; margin-bottom: .75rem; }
        .empty-state p { font-size: .9rem; }

        /* ── Modal ── */
        .modal-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,.55); z-index: 300;
            align-items: center; justify-content: center;
            padding: 1rem;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: var(--surface-card); border-radius: var(--radius);
            max-width: 680px; width: 100%; max-height: 88vh;
            overflow-y: auto; box-shadow: var(--shadow-lg);
            display: flex; flex-direction: column;
        }
        .modal-header {
            padding: 1.5rem 1.75rem 1rem;
            border-bottom: 1px solid rgba(0,0,0,.07);
            display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem;
        }
        .modal-header h2 { font-size: 1.1rem; font-weight: 700; line-height: 1.4; }
        .modal-close-btn {
            width: 32px; height: 32px; border-radius: 8px; border: none;
            background: rgba(0,0,0,.05); cursor: pointer; font-size: 1rem;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; transition: background .2s;
        }
        .modal-close-btn:hover { background: rgba(0,0,0,.1); }
        .modal-body { padding: 1.5rem 1.75rem; flex: 1; }
        .modal-field { margin-bottom: 1rem; }
        .modal-field label {
            display: block; font-size: .72rem; font-weight: 700;
            color: var(--ink-muted); text-transform: uppercase;
            letter-spacing: .5px; margin-bottom: .3rem;
        }
        .modal-field .val { font-size: .9rem; line-height: 1.7; }
        .modal-field .val.content-body {
            white-space: pre-wrap; word-break: break-word;
            background: var(--surface); border-radius: var(--radius-sm);
            padding: .75rem 1rem; max-height: 280px; overflow-y: auto;
        }
        .modal-field .meta-row {
            display: flex; flex-wrap: wrap; gap: .5rem;
        }
        .modal-field .meta-chip {
            background: var(--surface); border-radius: 6px;
            padding: .25rem .65rem; font-size: .82rem; color: var(--ink-muted);
        }
        .modal-footer {
            padding: 1rem 1.75rem 1.5rem;
            border-top: 1px solid rgba(0,0,0,.07);
            display: flex; gap: .5rem; justify-content: flex-end;
        }

        /* ── Toast ── */
        .toast {
            position: fixed; bottom: 2rem; right: 2rem;
            padding: .8rem 1.5rem; border-radius: var(--radius-sm);
            background: var(--ink); color: #fff; font-size: .85rem;
            box-shadow: var(--shadow-lg); z-index: 500;
            transform: translateY(120px); opacity: 0; transition: all .35s;
        }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.success { background: #166534; }
        .toast.error   { background: #991b1b; }

        /* ── Confirm Dialog ── */
        .confirm-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,.45); z-index: 400;
            align-items: center; justify-content: center;
        }
        .confirm-overlay.active { display: flex; }
        .confirm-box {
            background: var(--surface-card); border-radius: var(--radius);
            padding: 2rem; max-width: 400px; width: 90%; box-shadow: var(--shadow-lg);
        }
        .confirm-box h3 { font-size: 1rem; font-weight: 700; margin-bottom: .5rem; }
        .confirm-box p { font-size: .88rem; color: var(--ink-muted); margin-bottom: 1.5rem; line-height: 1.6; }
        .confirm-actions { display: flex; gap: .5rem; justify-content: flex-end; }
        .btn-cancel {
            padding: .55rem 1.25rem; border-radius: var(--radius-sm);
            border: 1px solid rgba(0,0,0,.1); background: transparent;
            font-size: .88rem; cursor: pointer; color: var(--ink-muted);
        }
        .btn-confirm-ok {
            padding: .55rem 1.25rem; border-radius: var(--radius-sm);
            border: none; font-size: .88rem; font-weight: 600; cursor: pointer;
        }
        .btn-confirm-ok.danger  { background: var(--red);    color: #fff; }
        .btn-confirm-ok.success { background: var(--green);  color: #fff; }
        .btn-confirm-ok.primary { background: var(--violet); color: #fff; }

        /* ── Responsive ── */
        @media (max-width: 1100px) {
            .stats-row { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 768px) {
            .nav-links { display: none; }
            .stats-row { grid-template-columns: 1fr 1fr; }
            .filters { flex-direction: column; }
            .filter-group { min-width: 100%; }
            .content { padding: 1rem; }
            .col-num-val, .col-date { display: none; }
        }
        @media (max-width: 480px) {
            .stats-row { grid-template-columns: 1fr; }
            .tab-btn { font-size: .8rem; padding: .7rem .8rem; }
        }
    </style>
</head>
<body>

<!-- ══════════════════════════════════════
     PAGE HEADER
══════════════════════════════════════ -->
<div class="page-header">
    <div class="page-header-inner">
        <h1>콘텐츠 관리</h1>
        <p>커뮤니티 게시글 및 댓글을 직접 관리합니다</p>
    </div>
</div>

<!-- ══════════════════════════════════════
     MAIN CONTENT
══════════════════════════════════════ -->
<div class="content">

    <!-- Stats Row -->
    <div class="stats-row">
        <div class="stat-card">
            <div class="stat-icon posts">&#128196;</div>
            <div class="stat-info">
                <div class="label">전체 게시글</div>
                <div class="value" id="statTotalPosts">-</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon cmts">&#128172;</div>
            <div class="stat-info">
                <div class="label">전체 댓글</div>
                <div class="value" id="statTotalComments">-</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon del">&#128465;</div>
            <div class="stat-info">
                <div class="label">삭제된 콘텐츠</div>
                <div class="value" id="statDeleted">-</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon rpt">&#9888;</div>
            <div class="stat-info">
                <div class="label">신고된 콘텐츠</div>
                <div class="value" id="statReported">-</div>
            </div>
        </div>
    </div>

    <!-- Tab Bar -->
    <div class="tab-bar">
        <button class="tab-btn active" onclick="switchTab('posts')" id="tabPosts">
            &#128196; 게시글 목록
        </button>
        <button class="tab-btn" onclick="switchTab('comments')" id="tabComments">
            &#128172; 댓글 목록
        </button>
    </div>

    <!-- ── POSTS PANEL ── -->
    <div id="panelPosts">

        <!-- Filters -->
        <div class="filters">
            <div class="filter-group flex-grow">
                <label>키워드 검색</label>
                <input type="text" id="postKeyword" placeholder="제목, 내용, 작성자 검색..." onkeydown="if(event.key==='Enter') applyPostFilters()">
            </div>
            <div class="filter-group">
                <label>카테고리</label>
                <select id="postCategory">
                    <option value="">전체 카테고리</option>
                    <option value="general">일반</option>
                    <option value="question">질문</option>
                    <option value="info">정보</option>
                    <option value="review">리뷰</option>
                    <option value="discussion">토론</option>
                    <option value="notice">공지</option>
                </select>
            </div>
            <div class="filter-group">
                <label>상태</label>
                <select id="postStatus">
                    <option value="">전체</option>
                    <option value="normal">정상</option>
                    <option value="deleted">삭제됨</option>
                    <option value="reported">신고됨</option>
                </select>
            </div>
            <div class="filter-group">
                <label>시작일</label>
                <input type="date" id="postDateFrom">
            </div>
            <div class="filter-group">
                <label>종료일</label>
                <input type="date" id="postDateTo">
            </div>
            <div class="filter-actions">
                <button class="btn-search" onclick="applyPostFilters()">검색</button>
                <button class="btn-reset"  onclick="resetPostFilters()">초기화</button>
            </div>
        </div>

        <!-- Table -->
        <div class="table-wrap">
            <div class="table-meta">
                <div class="count">검색 결과: <strong id="postCountLabel">0</strong>건</div>
            </div>
            <div style="overflow-x:auto;">
                <table>
                    <thead>
                        <tr>
                            <th class="col-num">#</th>
                            <th>제목</th>
                            <th>작성자</th>
                            <th>카테고리</th>
                            <th>작성일</th>
                            <th>조회</th>
                            <th>좋아요</th>
                            <th>상태</th>
                            <th>액션</th>
                        </tr>
                    </thead>
                    <tbody id="postTableBody">
                        <tr><td colspan="9"><div class="empty-state"><div class="icon">&#128196;</div><p>게시글을 불러오는 중...</p></div></td></tr>
                    </tbody>
                </table>
            </div>
            <div class="pagination" id="postPagination"></div>
        </div>
    </div>

    <!-- ── COMMENTS PANEL ── -->
    <div id="panelComments" style="display:none;">

        <!-- Filters -->
        <div class="filters">
            <div class="filter-group flex-grow">
                <label>키워드 검색</label>
                <input type="text" id="cmtKeyword" placeholder="댓글 내용, 작성자 검색..." onkeydown="if(event.key==='Enter') applyCmtFilters()">
            </div>
            <div class="filter-group">
                <label>상태</label>
                <select id="cmtStatus">
                    <option value="">전체</option>
                    <option value="normal">정상</option>
                    <option value="deleted">삭제됨</option>
                </select>
            </div>
            <div class="filter-group">
                <label>시작일</label>
                <input type="date" id="cmtDateFrom">
            </div>
            <div class="filter-group">
                <label>종료일</label>
                <input type="date" id="cmtDateTo">
            </div>
            <div class="filter-actions">
                <button class="btn-search" onclick="applyCmtFilters()">검색</button>
                <button class="btn-reset"  onclick="resetCmtFilters()">초기화</button>
            </div>
        </div>

        <!-- Table -->
        <div class="table-wrap">
            <div class="table-meta">
                <div class="count">검색 결과: <strong id="cmtCountLabel">0</strong>건</div>
            </div>
            <div style="overflow-x:auto;">
                <table>
                    <thead>
                        <tr>
                            <th class="col-num">#</th>
                            <th>내용 (요약)</th>
                            <th>작성자</th>
                            <th>원글 제목</th>
                            <th>작성일</th>
                            <th>상태</th>
                            <th>액션</th>
                        </tr>
                    </thead>
                    <tbody id="cmtTableBody">
                        <tr><td colspan="7"><div class="empty-state"><div class="icon">&#128172;</div><p>댓글을 불러오는 중...</p></div></td></tr>
                    </tbody>
                </table>
            </div>
            <div class="pagination" id="cmtPagination"></div>
        </div>
    </div>
</div>

<!-- ══════════════════════════════════════
     DETAIL MODAL (게시글/댓글 미리보기)
══════════════════════════════════════ -->
<div class="modal-overlay" id="detailModal">
    <div class="modal">
        <div class="modal-header">
            <h2 id="modalTitle">상세 보기</h2>
            <button class="modal-close-btn" onclick="closeModal()">&#10005;</button>
        </div>
        <div class="modal-body" id="modalBody"></div>
        <div class="modal-footer">
            <button class="btn-cancel" onclick="closeModal()">닫기</button>
        </div>
    </div>
</div>

<!-- ══════════════════════════════════════
     CONFIRM DIALOG
══════════════════════════════════════ -->
<div class="confirm-overlay" id="confirmOverlay">
    <div class="confirm-box">
        <h3 id="confirmTitle">확인</h3>
        <p id="confirmMsg"></p>
        <div class="confirm-actions">
            <button class="btn-cancel" onclick="closeConfirm()">취소</button>
            <button class="btn-confirm-ok danger" id="confirmOkBtn" onclick="executeConfirm()">확인</button>
        </div>
    </div>
</div>

<!-- ══════════════════════════════════════
     TOAST
══════════════════════════════════════ -->
<div class="toast" id="toast"></div>

<!-- ══════════════════════════════════════
     SCRIPTS
══════════════════════════════════════ -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../js/admin-common.js"></script>
<script>
/* ══════════════════════════════════════════════════════════════
   GLOBALS
══════════════════════════════════════════════════════════════ */
const PAGE_SIZE = 20;

// Posts state
let postData   = [];
let postPage   = 1;
let postTotal  = 0;
let postFilters = { keyword: '', category: '', status: '', dateFrom: '', dateTo: '' };

// Comments state
let cmtData    = [];
let cmtPage    = 1;
let cmtTotal   = 0;
let cmtFilters  = { keyword: '', status: '', dateFrom: '', dateTo: '' };

// Confirm callback
let confirmCallback = null;

/* ══════════════════════════════════════════════════════════════
   INIT
══════════════════════════════════════════════════════════════ */
document.addEventListener('DOMContentLoaded', async () => {
    // Admin auth check via admin-common.js
    const ok = await checkAdminAuth();
    if (!ok) return;

    // Show admin name
    const session = await supabase.auth.getSession();
    if (session?.data?.session?.user) {
        const email = session.data.session.user.email;
        document.getElementById('adminNameDisplay').textContent = email;
    }

    // Load initial data
    await loadStats();
    await loadPosts();
});

/* ══════════════════════════════════════════════════════════════
   AUTH
══════════════════════════════════════════════════════════════ */
async function handleLogout() {
    await supabase.auth.signOut();
    window.location.href = '/pages/auth/login.html';
}

/* ══════════════════════════════════════════════════════════════
   STATS
══════════════════════════════════════════════════════════════ */
async function loadStats() {
    try {
        const [postsRes, cmtsRes] = await Promise.all([
            supabase.from('community_posts').select('id, is_deleted', { count: 'exact' }),
            supabase.from('community_comments').select('id, is_deleted', { count: 'exact' })
        ]);

        const posts    = postsRes.data  || [];
        const comments = cmtsRes.data   || [];

        const totalPosts    = postsRes.count    || posts.length;
        const totalComments = cmtsRes.count     || comments.length;
        const deletedPosts    = posts.filter(p => p.is_deleted).length;
        const deletedComments = comments.filter(c => c.is_deleted).length;

        document.getElementById('statTotalPosts').textContent    = totalPosts.toLocaleString();
        document.getElementById('statTotalComments').textContent = totalComments.toLocaleString();
        document.getElementById('statDeleted').textContent       = (deletedPosts + deletedComments).toLocaleString();

        // Reported — try report_count field
        const reportedPosts    = posts.filter(p => p.report_count > 0).length;
        const reportedComments = comments.filter(c => c.report_count > 0).length;
        document.getElementById('statReported').textContent = (reportedPosts + reportedComments).toLocaleString();
    } catch(e) {
        console.warn('Stats load error:', e.message);
        ['statTotalPosts','statTotalComments','statDeleted','statReported'].forEach(id => {
            document.getElementById(id).textContent = '-';
        });
    }
}

/* ══════════════════════════════════════════════════════════════
   TAB
══════════════════════════════════════════════════════════════ */
async function switchTab(tab) {
    document.getElementById('panelPosts').style.display    = tab === 'posts'    ? '' : 'none';
    document.getElementById('panelComments').style.display = tab === 'comments' ? '' : 'none';
    document.getElementById('tabPosts').classList.toggle('active',    tab === 'posts');
    document.getElementById('tabComments').classList.toggle('active', tab === 'comments');

    if (tab === 'comments' && cmtData.length === 0) {
        await loadComments();
    }
}

/* ══════════════════════════════════════════════════════════════
   POSTS — LOAD
══════════════════════════════════════════════════════════════ */
async function loadPosts() {
    renderPostsLoading();

    try {
        let query = supabase
            .from('community_posts')
            .select(`
                id,
                title,
                content,
                category,
                created_at,
                view_count,
                like_count,
                is_deleted,
                deleted_at,
                is_pinned,
                is_hot,
                report_count,
                author:users(id, name, email)
            `, { count: 'exact' })
            .order('created_at', { ascending: false });

        // Filters
        if (postFilters.keyword) {
            query = query.or(
                `title.ilike.%${postFilters.keyword}%,content.ilike.%${postFilters.keyword}%`
            );
        }
        if (postFilters.category) {
            query = query.eq('category', postFilters.category);
        }
        if (postFilters.status === 'deleted') {
            query = query.eq('is_deleted', true);
        } else if (postFilters.status === 'normal') {
            query = query.eq('is_deleted', false);
        } else if (postFilters.status === 'reported') {
            query = query.gt('report_count', 0);
        }
        if (postFilters.dateFrom) {
            query = query.gte('created_at', postFilters.dateFrom + 'T00:00:00');
        }
        if (postFilters.dateTo) {
            query = query.lte('created_at', postFilters.dateTo + 'T23:59:59');
        }

        // Keyword author search (separate query + union not supported natively — filter in JS)
        const from = (postPage - 1) * PAGE_SIZE;
        query = query.range(from, from + PAGE_SIZE - 1);

        const { data, count, error } = await query;
        if (error) throw error;

        postData  = data || [];
        postTotal = count || 0;

        // Keyword author filter in JS
        if (postFilters.keyword) {
            const kw = postFilters.keyword.toLowerCase();
            postData = postData.filter(p =>
                (p.title || '').toLowerCase().includes(kw) ||
                (p.content || '').toLowerCase().includes(kw) ||
                (p.author?.name || '').toLowerCase().includes(kw) ||
                (p.author?.email || '').toLowerCase().includes(kw)
            );
        }

        document.getElementById('postCountLabel').textContent = postTotal.toLocaleString();
        renderPostsTable();
        renderPostsPagination();
    } catch(e) {
        console.error('Posts load error:', e);
        renderPostsError(e.message);
    }
}

function renderPostsLoading() {
    document.getElementById('postTableBody').innerHTML =
        `<tr><td colspan="9"><div class="empty-state"><div class="icon">&#128196;</div><p>데이터를 불러오는 중...</p></div></td></tr>`;
}

function renderPostsError(msg) {
    document.getElementById('postTableBody').innerHTML =
        `<tr><td colspan="9"><div class="empty-state"><div class="icon">&#9888;</div><p>오류: ${escHtml(msg)}</p></div></td></tr>`;
}

function renderPostsTable() {
    const tbody = document.getElementById('postTableBody');
    if (!postData.length) {
        tbody.innerHTML = `<tr><td colspan="9"><div class="empty-state"><div class="icon">&#128196;</div><p>검색 결과가 없습니다</p></div></td></tr>`;
        return;
    }
    tbody.innerHTML = postData.map((p, i) => {
        const rowNum   = (postPage - 1) * PAGE_SIZE + i + 1;
        const author   = p.author?.name || p.author?.email || '알 수 없음';
        const date     = formatDate(p.created_at);
        const statusBadge = postStatusBadge(p);
        const flagBadges  = [
            p.is_pinned ? '<span class="badge pinned">고정</span>' : '',
            p.is_hot    ? '<span class="badge hot">HOT</span>'     : '',
        ].filter(Boolean).join(' ');
        const actions  = buildPostActions(p);

        return `<tr onclick="openPostDetail('${p.id}')" title="클릭하여 상세보기">
            <td class="col-num">${rowNum}</td>
            <td class="col-title">
                <span class="title-text">${escHtml(p.title || '(제목 없음)')}</span>
                ${flagBadges ? `<div style="margin-top:.2rem;">${flagBadges}</div>` : ''}
            </td>
            <td class="col-author">${escHtml(author)}</td>
            <td>${escHtml(p.category || '-')}</td>
            <td class="col-date">${date}</td>
            <td class="col-num-val">${(p.view_count || 0).toLocaleString()}</td>
            <td class="col-num-val">${(p.like_count || 0).toLocaleString()}</td>
            <td>${statusBadge}</td>
            <td onclick="event.stopPropagation()">
                <div class="col-actions">${actions}</div>
            </td>
        </tr>`;
    }).join('');
}

function postStatusBadge(p) {
    if (p.is_deleted) return '<span class="badge deleted">삭제됨</span>';
    if (p.report_count > 0) return `<span class="badge reported">신고 ${p.report_count}</span>`;
    return '<span class="badge normal">정상</span>';
}

function buildPostActions(p) {
    const btns = [];
    if (p.is_deleted) {
        btns.push(`<button class="act-btn success" onclick="restorePost('${p.id}')">복구</button>`);
    } else {
        btns.push(`<button class="act-btn danger" onclick="deletePost('${p.id}')">삭제</button>`);
        btns.push(`<button class="act-btn primary" onclick="togglePin('${p.id}', ${!p.is_pinned})">${p.is_pinned ? '고정 해제' : '고정'}</button>`);
        btns.push(`<button class="act-btn amber" onclick="toggleHot('${p.id}', ${!p.is_hot})">${p.is_hot ? 'HOT 해제' : 'HOT'}</button>`);
    }
    return btns.join('');
}

function renderPostsPagination() {
    const total  = Math.ceil(postTotal / PAGE_SIZE);
    const el     = document.getElementById('postPagination');
    if (total <= 1) { el.innerHTML = ''; return; }
    el.innerHTML = buildPaginationHtml(postPage, total, 'goPostPage');
}

async function goPostPage(page) {
    postPage = page;
    await loadPosts();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ══════════════════════════════════════════════════════════════
   POSTS — FILTERS
══════════════════════════════════════════════════════════════ */
async function applyPostFilters() {
    postFilters.keyword  = document.getElementById('postKeyword').value.trim();
    postFilters.category = document.getElementById('postCategory').value;
    postFilters.status   = document.getElementById('postStatus').value;
    postFilters.dateFrom = document.getElementById('postDateFrom').value;
    postFilters.dateTo   = document.getElementById('postDateTo').value;
    postPage = 1;
    await loadPosts();
}

async function resetPostFilters() {
    ['postKeyword','postCategory','postStatus','postDateFrom','postDateTo'].forEach(id => {
        const el = document.getElementById(id);
        el.value = '';
    });
    postFilters = { keyword: '', category: '', status: '', dateFrom: '', dateTo: '' };
    postPage = 1;
    await loadPosts();
}

/* ══════════════════════════════════════════════════════════════
   POSTS — ACTIONS
══════════════════════════════════════════════════════════════ */
function deletePost(id) {
    showConfirm(
        '게시글 삭제',
        '이 게시글을 삭제하시겠습니까? (소프트 삭제 — 복구 가능)',
        'danger',
        async () => {
            try {
                const { error } = await supabase
                    .from('community_posts')
                    .update({ is_deleted: true, deleted_at: new Date().toISOString() })
                    .eq('id', id);
                if (error) throw error;
                showToast('게시글이 삭제되었습니다', 'success');
                await Promise.all([loadPosts(), loadStats()]);
            } catch(e) { showToast('삭제 실패: ' + e.message, 'error'); }
        }
    );
}

function restorePost(id) {
    showConfirm(
        '게시글 복구',
        '삭제된 게시글을 복구하시겠습니까?',
        'success',
        async () => {
            try {
                const { error } = await supabase
                    .from('community_posts')
                    .update({ is_deleted: false, deleted_at: null })
                    .eq('id', id);
                if (error) throw error;
                showToast('게시글이 복구되었습니다', 'success');
                await Promise.all([loadPosts(), loadStats()]);
            } catch(e) { showToast('복구 실패: ' + e.message, 'error'); }
        }
    );
}

async function togglePin(id, pinned) {
    try {
        const { error } = await supabase
            .from('community_posts')
            .update({ is_pinned: pinned })
            .eq('id', id);
        if (error) throw error;
        showToast(pinned ? '게시글이 고정되었습니다' : '고정이 해제되었습니다', 'success');
        await loadPosts();
    } catch(e) { showToast('오류: ' + e.message, 'error'); }
}

async function toggleHot(id, hot) {
    try {
        const { error } = await supabase
            .from('community_posts')
            .update({ is_hot: hot })
            .eq('id', id);
        if (error) throw error;
        showToast(hot ? 'HOT 설정되었습니다' : 'HOT이 해제되었습니다', 'success');
        await loadPosts();
    } catch(e) { showToast('오류: ' + e.message, 'error'); }
}

/* ══════════════════════════════════════════════════════════════
   POSTS — DETAIL MODAL
══════════════════════════════════════════════════════════════ */
async function openPostDetail(id) {
    try {
        const { data, error } = await supabase
            .from('community_posts')
            .select(`
                *,
                author:users(id, name, email)
            `)
            .eq('id', id)
            .single();
        if (error) throw error;

        document.getElementById('modalTitle').textContent = data.title || '(제목 없음)';
        document.getElementById('modalBody').innerHTML = `
            <div class="modal-field">
                <label>작성자</label>
                <div class="val">${escHtml(data.author?.name || data.author?.email || '알 수 없음')}</div>
            </div>
            <div class="modal-field">
                <label>카테고리 / 작성일</label>
                <div class="val meta-row">
                    <span class="meta-chip">${escHtml(data.category || '-')}</span>
                    <span class="meta-chip">${formatDate(data.created_at)}</span>
                    <span class="meta-chip">조회 ${(data.view_count||0).toLocaleString()}</span>
                    <span class="meta-chip">좋아요 ${(data.like_count||0).toLocaleString()}</span>
                    ${data.is_pinned ? '<span class="meta-chip" style="color:var(--violet)">고정됨</span>' : ''}
                    ${data.is_hot    ? '<span class="meta-chip" style="color:var(--coral)">HOT</span>'    : ''}
                    ${data.is_deleted? '<span class="meta-chip" style="color:var(--red)">삭제됨</span>'   : ''}
                </div>
            </div>
            <div class="modal-field">
                <label>본문</label>
                <div class="val content-body">${escHtml(data.content || '(내용 없음)')}</div>
            </div>
            ${data.report_count > 0 ? `
            <div class="modal-field">
                <label>신고 횟수</label>
                <div class="val" style="color:var(--amber);font-weight:600;">${data.report_count}회 신고됨</div>
            </div>` : ''}
        `;
        openModal();
    } catch(e) {
        showToast('상세 정보 로드 실패: ' + e.message, 'error');
    }
}

/* ══════════════════════════════════════════════════════════════
   COMMENTS — LOAD
══════════════════════════════════════════════════════════════ */
async function loadComments() {
    renderCmtsLoading();

    try {
        let query = supabase
            .from('community_comments')
            .select(`
                id,
                content,
                created_at,
                is_deleted,
                deleted_at,
                report_count,
                author:users(id, name, email),
                post:community_posts(id, title)
            `, { count: 'exact' })
            .order('created_at', { ascending: false });

        // Filters
        if (cmtFilters.keyword) {
            query = query.ilike('content', `%${cmtFilters.keyword}%`);
        }
        if (cmtFilters.status === 'deleted') {
            query = query.eq('is_deleted', true);
        } else if (cmtFilters.status === 'normal') {
            query = query.eq('is_deleted', false);
        }
        if (cmtFilters.dateFrom) {
            query = query.gte('created_at', cmtFilters.dateFrom + 'T00:00:00');
        }
        if (cmtFilters.dateTo) {
            query = query.lte('created_at', cmtFilters.dateTo + 'T23:59:59');
        }

        const from = (cmtPage - 1) * PAGE_SIZE;
        query = query.range(from, from + PAGE_SIZE - 1);

        const { data, count, error } = await query;
        if (error) throw error;

        cmtData  = data || [];
        cmtTotal = count || 0;

        // Keyword author filter in JS
        if (cmtFilters.keyword) {
            const kw = cmtFilters.keyword.toLowerCase();
            cmtData = cmtData.filter(c =>
                (c.content || '').toLowerCase().includes(kw) ||
                (c.author?.name || '').toLowerCase().includes(kw) ||
                (c.author?.email || '').toLowerCase().includes(kw)
            );
        }

        document.getElementById('cmtCountLabel').textContent = cmtTotal.toLocaleString();
        renderCmtsTable();
        renderCmtsPagination();
    } catch(e) {
        console.error('Comments load error:', e);
        renderCmtsError(e.message);
    }
}

function renderCmtsLoading() {
    document.getElementById('cmtTableBody').innerHTML =
        `<tr><td colspan="7"><div class="empty-state"><div class="icon">&#128172;</div><p>데이터를 불러오는 중...</p></div></td></tr>`;
}

function renderCmtsError(msg) {
    document.getElementById('cmtTableBody').innerHTML =
        `<tr><td colspan="7"><div class="empty-state"><div class="icon">&#9888;</div><p>오류: ${escHtml(msg)}</p></div></td></tr>`;
}

function renderCmtsTable() {
    const tbody = document.getElementById('cmtTableBody');
    if (!cmtData.length) {
        tbody.innerHTML = `<tr><td colspan="7"><div class="empty-state"><div class="icon">&#128172;</div><p>검색 결과가 없습니다</p></div></td></tr>`;
        return;
    }
    tbody.innerHTML = cmtData.map((c, i) => {
        const rowNum  = (cmtPage - 1) * PAGE_SIZE + i + 1;
        const summary = (c.content || '').slice(0, 50) + ((c.content || '').length > 50 ? '…' : '');
        const author  = c.author?.name || c.author?.email || '알 수 없음';
        const postTitle = c.post?.title || '(게시글 없음)';
        const date    = formatDate(c.created_at);
        const status  = c.is_deleted
            ? '<span class="badge deleted">삭제됨</span>'
            : '<span class="badge normal">정상</span>';
        const actions = c.is_deleted
            ? `<button class="act-btn success" onclick="restoreComment('${c.id}')">복구</button>`
            : `<button class="act-btn danger"  onclick="deleteComment('${c.id}')">삭제</button>`;

        return `<tr onclick="openCmtDetail('${c.id}')" title="클릭하여 원문 보기">
            <td class="col-num">${rowNum}</td>
            <td class="col-content"><span class="content-text">${escHtml(summary)}</span></td>
            <td class="col-author">${escHtml(author)}</td>
            <td class="col-content"><span class="content-text">${escHtml(postTitle)}</span></td>
            <td class="col-date">${date}</td>
            <td>${status}</td>
            <td onclick="event.stopPropagation()">
                <div class="col-actions">${actions}</div>
            </td>
        </tr>`;
    }).join('');
}

function renderCmtsPagination() {
    const total = Math.ceil(cmtTotal / PAGE_SIZE);
    const el    = document.getElementById('cmtPagination');
    if (total <= 1) { el.innerHTML = ''; return; }
    el.innerHTML = buildPaginationHtml(cmtPage, total, 'goCmtPage');
}

async function goCmtPage(page) {
    cmtPage = page;
    await loadComments();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ══════════════════════════════════════════════════════════════
   COMMENTS — FILTERS
══════════════════════════════════════════════════════════════ */
async function applyCmtFilters() {
    cmtFilters.keyword  = document.getElementById('cmtKeyword').value.trim();
    cmtFilters.status   = document.getElementById('cmtStatus').value;
    cmtFilters.dateFrom = document.getElementById('cmtDateFrom').value;
    cmtFilters.dateTo   = document.getElementById('cmtDateTo').value;
    cmtPage = 1;
    await loadComments();
}

async function resetCmtFilters() {
    ['cmtKeyword','cmtStatus','cmtDateFrom','cmtDateTo'].forEach(id => {
        document.getElementById(id).value = '';
    });
    cmtFilters = { keyword: '', status: '', dateFrom: '', dateTo: '' };
    cmtPage = 1;
    await loadComments();
}

/* ══════════════════════════════════════════════════════════════
   COMMENTS — ACTIONS
══════════════════════════════════════════════════════════════ */
function deleteComment(id) {
    showConfirm(
        '댓글 삭제',
        '이 댓글을 삭제하시겠습니까? (소프트 삭제 — 복구 가능)',
        'danger',
        async () => {
            try {
                const { error } = await supabase
                    .from('community_comments')
                    .update({ is_deleted: true, deleted_at: new Date().toISOString() })
                    .eq('id', id);
                if (error) throw error;
                showToast('댓글이 삭제되었습니다', 'success');
                await Promise.all([loadComments(), loadStats()]);
            } catch(e) { showToast('삭제 실패: ' + e.message, 'error'); }
        }
    );
}

function restoreComment(id) {
    showConfirm(
        '댓글 복구',
        '삭제된 댓글을 복구하시겠습니까?',
        'success',
        async () => {
            try {
                const { error } = await supabase
                    .from('community_comments')
                    .update({ is_deleted: false, deleted_at: null })
                    .eq('id', id);
                if (error) throw error;
                showToast('댓글이 복구되었습니다', 'success');
                await Promise.all([loadComments(), loadStats()]);
            } catch(e) { showToast('복구 실패: ' + e.message, 'error'); }
        }
    );
}

/* ══════════════════════════════════════════════════════════════
   COMMENTS — DETAIL MODAL
══════════════════════════════════════════════════════════════ */
async function openCmtDetail(id) {
    try {
        const { data, error } = await supabase
            .from('community_comments')
            .select(`
                *,
                author:users(id, name, email),
                post:community_posts(id, title, content)
            `)
            .eq('id', id)
            .single();
        if (error) throw error;

        document.getElementById('modalTitle').textContent = '댓글 상세 보기';
        document.getElementById('modalBody').innerHTML = `
            <div class="modal-field">
                <label>작성자</label>
                <div class="val">${escHtml(data.author?.name || data.author?.email || '알 수 없음')}</div>
            </div>
            <div class="modal-field">
                <label>작성일 / 상태</label>
                <div class="val meta-row">
                    <span class="meta-chip">${formatDate(data.created_at)}</span>
                    ${data.is_deleted ? '<span class="meta-chip" style="color:var(--red)">삭제됨 (' + formatDate(data.deleted_at) + ')</span>' : '<span class="meta-chip" style="color:var(--green)">정상</span>'}
                </div>
            </div>
            <div class="modal-field">
                <label>댓글 원문</label>
                <div class="val content-body">${escHtml(data.content || '(내용 없음)')}</div>
            </div>
            <div class="modal-field">
                <label>원글 제목</label>
                <div class="val">${escHtml(data.post?.title || '(게시글 없음)')}</div>
            </div>
            ${data.post?.content ? `
            <div class="modal-field">
                <label>원글 내용 (요약)</label>
                <div class="val content-body" style="max-height:120px;">${escHtml((data.post.content || '').slice(0, 300) + ((data.post.content||'').length > 300 ? '…' : ''))}</div>
            </div>` : ''}
            ${(data.report_count||0) > 0 ? `
            <div class="modal-field">
                <label>신고 횟수</label>
                <div class="val" style="color:var(--amber);font-weight:600;">${data.report_count}회 신고됨</div>
            </div>` : ''}
        `;
        openModal();
    } catch(e) {
        showToast('상세 정보 로드 실패: ' + e.message, 'error');
    }
}

/* ══════════════════════════════════════════════════════════════
   MODAL HELPERS
══════════════════════════════════════════════════════════════ */
function openModal()  { document.getElementById('detailModal').classList.add('active'); }
function closeModal() { document.getElementById('detailModal').classList.remove('active'); }

// Close modal on overlay click
document.getElementById('detailModal').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
});

/* ══════════════════════════════════════════════════════════════
   CONFIRM DIALOG
══════════════════════════════════════════════════════════════ */
function showConfirm(title, msg, type, cb) {
    document.getElementById('confirmTitle').textContent = title;
    document.getElementById('confirmMsg').textContent   = msg;
    const okBtn = document.getElementById('confirmOkBtn');
    okBtn.className = `btn-confirm-ok ${type}`;
    okBtn.textContent = type === 'danger' ? '삭제' : type === 'success' ? '복구' : '확인';
    confirmCallback = cb;
    document.getElementById('confirmOverlay').classList.add('active');
}

function closeConfirm() {
    document.getElementById('confirmOverlay').classList.remove('active');
    confirmCallback = null;
}

async function executeConfirm() {
    closeConfirm();
    if (confirmCallback) await confirmCallback();
}

/* ══════════════════════════════════════════════════════════════
   TOAST
══════════════════════════════════════════════════════════════ */
function showToast(msg, type = '') {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className   = `toast${type ? ' ' + type : ''} show`;
    setTimeout(() => el.classList.remove('show'), 3000);
}

/* ══════════════════════════════════════════════════════════════
   PAGINATION HTML BUILDER
══════════════════════════════════════════════════════════════ */
function buildPaginationHtml(current, total, fnName) {
    let html = '';
    const WINDOW = 2;

    // Prev
    html += `<button class="page-btn" onclick="${fnName}(${current-1})" ${current===1?'disabled':''}>&#8249;</button>`;

    // Pages
    for (let p = 1; p <= total; p++) {
        if (p === 1 || p === total || (p >= current - WINDOW && p <= current + WINDOW)) {
            html += `<button class="page-btn${p===current?' active':''}" onclick="${fnName}(${p})">${p}</button>`;
        } else if (p === current - WINDOW - 1 || p === current + WINDOW + 1) {
            html += `<button class="page-btn" disabled style="border:none;background:transparent;cursor:default;">…</button>`;
        }
    }

    // Next
    html += `<button class="page-btn" onclick="${fnName}(${current+1})" ${current===total?'disabled':''}>&#8250;</button>`;

    return html;
}

/* ══════════════════════════════════════════════════════════════
   UTILS
══════════════════════════════════════════════════════════════ */
function escHtml(str) {
    if (str == null) return '';
    return String(str)
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;')
        .replace(/'/g,'&#39;');
}

function formatDate(iso) {
    if (!iso) return '-';
    const d = new Date(iso);
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
}

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전문가 신청 검토 - AX-On Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #1a1a2e;
            --ink-muted: #6b7094;
            --surface: #f8f9fc;
            --surface-warm: #faf8f5;
            --surface-card: #ffffff;
            --amber: #f59e0b;
            --teal: #14b8a6;
            --coral: #f97316;
            --violet: #8b5cf6;
            --sky: #0ea5e9;
            --red: #ef4444;
            --green: #22c55e;
            --radius: 16px;
            --radius-sm: 10px;
            --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,.07), 0 2px 4px -2px rgba(0,0,0,.05);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,.08), 0 4px 6px -4px rgba(0,0,0,.05);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Sans KR', 'Outfit', sans-serif;
            background: var(--surface);
            color: var(--ink);
            line-height: 1.6;
        }

        /* Nav */
        .nav {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            background: rgba(255,255,255,.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0,0,0,.06);
            transition: box-shadow .3s;
        }
        .nav.scrolled { box-shadow: var(--shadow-md); }
        .nav-inner {
            max-width: 1280px; margin: 0 auto;
            padding: 0 2rem; height: 64px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .nav-logo {
            font-family: 'Outfit', sans-serif;
            font-weight: 700; font-size: 1.35rem;
            color: var(--ink); text-decoration: none;
        }
        .nav-logo span { color: var(--violet); }
        .nav-links { display: flex; gap: 2rem; align-items: center; }
        .nav-links a {
            text-decoration: none; color: var(--ink-muted);
            font-size: .9rem; font-weight: 500; transition: color .2s;
        }
        .nav-links a:hover { color: var(--ink); }
        .nav-auth { display: flex; gap: .75rem; align-items: center; }
        .btn-ghost {
            padding: .5rem 1rem; border-radius: var(--radius-sm);
            border: 1px solid rgba(0,0,0,.1); background: transparent;
            color: var(--ink); font-size: .85rem; font-weight: 500;
            cursor: pointer; text-decoration: none; transition: all .2s;
        }
        .btn-ghost:hover { background: rgba(0,0,0,.04); }
        .btn-primary {
            padding: .5rem 1.25rem; border-radius: var(--radius-sm);
            border: none; background: var(--ink);
            color: #fff; font-size: .85rem; font-weight: 500;
            cursor: pointer; text-decoration: none; transition: all .2s;
        }
        .btn-primary:hover { opacity: .9; transform: translateY(-1px); }

        /* Page Header */
        .page-header {
            margin-top: 64px;
            padding: 3rem 2rem 2rem;
            background: linear-gradient(135deg, #1a1a2e 0%, #2d1b69 100%);
            color: #fff;
        }
        .page-header-inner { max-width: 1280px; margin: 0 auto; }
        .page-header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.75rem; font-weight: 700;
        }
        .page-header p {
            color: rgba(255,255,255,.7); margin-top: .5rem; font-size: .95rem;
        }

        /* Content */
        .content {
            max-width: 1280px; margin: 2rem auto; padding: 0 2rem 3rem;
        }

        /* Tabs */
        .tabs {
            display: flex; gap: .5rem; margin-bottom: 1.5rem;
        }
        .tab-btn {
            padding: .6rem 1.25rem; border-radius: 20px;
            border: 1px solid rgba(0,0,0,.1); background: var(--surface-card);
            font-size: .85rem; font-weight: 500; cursor: pointer;
            color: var(--ink-muted); transition: all .2s;
        }
        .tab-btn:hover { border-color: var(--violet); color: var(--violet); }
        .tab-btn.active {
            background: var(--violet); color: #fff; border-color: var(--violet);
        }
        .tab-btn .count {
            display: inline-flex; align-items: center; justify-content: center;
            min-width: 20px; height: 20px; border-radius: 10px;
            background: rgba(255,255,255,.3); font-size: .7rem;
            margin-left: .4rem; padding: 0 .4rem;
        }
        .tab-btn.active .count { background: rgba(255,255,255,.3); }
        .tab-btn:not(.active) .count { background: rgba(0,0,0,.08); }

        /* Application Cards */
        .app-list { display: flex; flex-direction: column; gap: 1rem; }

        .app-card {
            background: var(--surface-card); border-radius: var(--radius);
            box-shadow: var(--shadow); padding: 1.5rem;
            display: flex; gap: 1.5rem; align-items: flex-start;
            transition: box-shadow .2s;
        }
        .app-card:hover { box-shadow: var(--shadow-md); }

        .app-avatar {
            width: 56px; height: 56px; border-radius: 50%;
            background: linear-gradient(135deg, var(--violet), var(--sky));
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 1.2rem; font-weight: 700;
            flex-shrink: 0;
        }

        .app-info { flex: 1; min-width: 0; }
        .app-name { font-size: 1.05rem; font-weight: 700; margin-bottom: .25rem; }
        .app-meta {
            display: flex; flex-wrap: wrap; gap: .5rem 1.25rem;
            font-size: .8rem; color: var(--ink-muted); margin-bottom: .5rem;
        }
        .app-intro {
            font-size: .85rem; color: var(--ink-muted);
            display: -webkit-box; -webkit-line-clamp: 2;
            -webkit-box-orient: vertical; overflow: hidden;
        }

        .app-actions {
            display: flex; flex-direction: column; gap: .5rem;
            flex-shrink: 0;
        }
        .btn-approve {
            padding: .5rem 1.25rem; border-radius: var(--radius-sm);
            border: none; background: var(--green); color: #fff;
            font-size: .8rem; font-weight: 600; cursor: pointer;
            transition: all .2s;
        }
        .btn-approve:hover { opacity: .9; }
        .btn-reject {
            padding: .5rem 1.25rem; border-radius: var(--radius-sm);
            border: 1px solid var(--red); background: transparent;
            color: var(--red); font-size: .8rem; font-weight: 600;
            cursor: pointer; transition: all .2s;
        }
        .btn-reject:hover { background: rgba(239,68,68,.05); }
        .btn-detail {
            padding: .5rem 1.25rem; border-radius: var(--radius-sm);
            border: 1px solid rgba(0,0,0,.1); background: transparent;
            color: var(--ink-muted); font-size: .8rem; font-weight: 500;
            cursor: pointer; transition: all .2s;
        }
        .btn-detail:hover { background: var(--surface); }

        /* Status badges */
        .status-badge {
            display: inline-flex; padding: .2rem .6rem; border-radius: 12px;
            font-size: .7rem; font-weight: 600;
        }
        .status-badge.pending { background: rgba(245,158,11,.1); color: #b45309; }
        .status-badge.approved { background: rgba(34,197,94,.1); color: #15803d; }
        .status-badge.rejected { background: rgba(239,68,68,.1); color: #b91c1c; }

        /* Empty */
        .empty-state {
            text-align: center; padding: 4rem 2rem; color: var(--ink-muted);
        }
        .empty-state .icon { font-size: 3rem; margin-bottom: 1rem; }

        /* Auth Block */
        .auth-block {
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            min-height: 60vh; text-align: center; padding: 2rem;
        }
        .auth-block h1 { font-size: 1.5rem; margin-bottom: .5rem; }
        .auth-block p { color: var(--ink-muted); margin-bottom: 1.5rem; }
        .auth-block a { color: var(--violet); text-decoration: none; font-weight: 500; }

        /* Modal */
        .modal-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,.5); z-index: 200;
            align-items: center; justify-content: center;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: var(--surface-card); border-radius: var(--radius);
            max-width: 640px; width: 90%; max-height: 85vh;
            overflow-y: auto; padding: 2rem; box-shadow: var(--shadow-lg);
        }
        .modal h2 { font-size: 1.2rem; margin-bottom: 1.5rem; }
        .modal-field { margin-bottom: 1rem; }
        .modal-field label {
            display: block; font-size: .75rem; font-weight: 600;
            color: var(--ink-muted); text-transform: uppercase;
            letter-spacing: .5px; margin-bottom: .25rem;
        }
        .modal-field .value { font-size: .9rem; }
        .modal-actions {
            display: flex; gap: .75rem; margin-top: 1.5rem;
        }
        .modal-actions button { flex: 1; padding: .65rem; border-radius: var(--radius-sm); font-size: .9rem; cursor: pointer; font-weight: 500; }

        /* Reject Modal */
        .reject-modal textarea {
            width: 100%; min-height: 100px; padding: .75rem;
            border: 1px solid rgba(0,0,0,.1); border-radius: var(--radius-sm);
            font-size: .9rem; font-family: inherit; resize: vertical;
            outline: none;
        }
        .reject-modal textarea:focus { border-color: var(--violet); }

        /* Toast */
        .toast {
            position: fixed; bottom: 2rem; right: 2rem;
            padding: .75rem 1.5rem; border-radius: var(--radius-sm);
            background: var(--ink); color: #fff; font-size: .85rem;
            box-shadow: var(--shadow-lg); z-index: 300;
            transform: translateY(100px); opacity: 0;
            transition: all .3s;
        }
        .toast.show { transform: translateY(0); opacity: 1; }

        /* Responsive */
        @media (max-width: 900px) {
            .nav-links { display: none; }
        }
        @media (max-width: 600px) {
            .app-card { flex-direction: column; }
            .app-actions { flex-direction: row; width: 100%; }
            .app-actions button { flex: 1; }
            .tabs { flex-wrap: wrap; }
        }
    </style>
</head>
<body>

<!-- Nav -->
<nav class="nav" id="nav">
    <div class="nav-inner">
        <a href="/" class="nav-logo">AX-<span>On</span></a>
        <div class="nav-links">
            <a href="/startup.html">시니어 AI 창업</a>
            <a href="/ax-project.html">AX 프로젝트</a>
            <a href="/expert.html">전문가</a>
            <a href="/community.html">커뮤니티</a>
        </div>
        <div class="nav-auth" id="navAuth">
            <a href="/login.html" class="btn-ghost">로그인</a>
            <a href="/signup.html" class="btn-primary">회원가입</a>
        </div>
    </div>
</nav>

<!-- Auth Loading -->
<div id="authLoading" style="display:flex;align-items:center;justify-content:center;min-height:100vh;">
    <p style="color:var(--ink-muted);">권한 확인 중...</p>
</div>

<!-- Auth Denied -->
<div id="authDenied" class="auth-block" style="display:none;margin-top:64px;">
    <h1>관리자 전용 페이지입니다</h1>
    <p>이 페이지에 접근하려면 관리자 권한이 필요합니다.</p>
    <a href="/">메인으로 돌아가기</a>
</div>

<!-- Main Content -->
<div id="mainContent" style="display:none;">
    <div class="page-header">
        <div class="page-header-inner">
            <h1>전문가 신청 검토</h1>
            <p>접수된 전문가 등록 신청을 검토하고 승인/거부합니다</p>
        </div>
    </div>

    <div class="content">
        <div class="tabs">
            <button class="tab-btn active" data-tab="pending">
                대기중 <span class="count" id="countPending">0</span>
            </button>
            <button class="tab-btn" data-tab="approved">
                승인됨 <span class="count" id="countApproved">0</span>
            </button>
            <button class="tab-btn" data-tab="rejected">
                거부됨 <span class="count" id="countRejected">0</span>
            </button>
        </div>

        <div class="app-list" id="appList">
            <div class="empty-state">
                <div class="icon">⏳</div>
                <p>로딩 중...</p>
            </div>
        </div>
    </div>
</div>

<!-- Detail Modal -->
<div class="modal-overlay" id="detailModal">
    <div class="modal">
        <h2>전문가 신청 상세</h2>
        <div id="detailContent"></div>
        <div class="modal-actions" id="detailActions"></div>
    </div>
</div>

<!-- Reject Reason Modal -->
<div class="modal-overlay" id="rejectModal">
    <div class="modal reject-modal">
        <h2>거부 사유 입력</h2>
        <p style="font-size:.85rem;color:var(--ink-muted);margin-bottom:1rem;">신청자에게 전달될 거부 사유를 입력해주세요.</p>
        <textarea id="rejectReason" placeholder="거부 사유를 입력하세요..."></textarea>
        <div class="modal-actions">
            <button class="btn-ghost" onclick="closeRejectModal()">취소</button>
            <button class="btn-reject" id="confirmRejectBtn" style="border:none;background:var(--red);color:#fff;">거부 확정</button>
        </div>
    </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/config.js"></script>
<script>
(function() {
    'use strict';

    let supabaseClient = null;
    let allApplications = [];
    let currentTab = 'pending';
    let currentRejectId = null;

    // Nav scroll
    window.addEventListener('scroll', () => {
        document.getElementById('nav').classList.toggle('scrolled', window.scrollY > 10);
    });

    async function init() {
        try {
            await AXON_CONFIG.init();
            supabaseClient = window.supabase.createClient(AXON_CONFIG.SUPABASE_URL, AXON_CONFIG.SUPABASE_ANON_KEY);
            window.supabaseClient = supabaseClient;

            const authed = await checkAdmin();
            if (!authed) return;

            await loadApplications();
            setupTabs();
            updateNavAuth();
        } catch (e) {
            console.error('[expert-review] init error:', e);
            showAuthDenied();
        }
    }

    async function checkAdmin() {
        const { data: { user } } = await supabaseClient.auth.getUser();
        if (!user) { showAuthDenied(); return false; }

        const { data: profile } = await supabaseClient
            .from('profiles').select('role').eq('id', user.id).single();

        if (!profile || profile.role !== 'admin') { showAuthDenied(); return false; }

        document.getElementById('authLoading').style.display = 'none';
        document.getElementById('mainContent').style.display = 'block';
        return true;
    }

    function showAuthDenied() {
        document.getElementById('authLoading').style.display = 'none';
        document.getElementById('authDenied').style.display = 'flex';
    }

    async function updateNavAuth() {
        const { data: { user } } = await supabaseClient.auth.getUser();
        const navAuth = document.getElementById('navAuth');
        if (user) {
            navAuth.innerHTML = `
                <span style="font-size:.85rem;color:var(--ink-muted);">관리자</span>
                <button class="btn-ghost" onclick="handleLogout()">로그아웃</button>
            `;
        }
    }

    window.handleLogout = async function() {
        await supabaseClient.auth.signOut();
        location.href = '/';
    };

    // Load applications
    async function loadApplications() {
        const { data, error } = await supabaseClient
            .from('expert_applications')
            .select('*')
            .order('created_at', { ascending: false });

        if (error) {
            console.error('신청 조회 실패:', error);
            showToast('신청 목록을 불러오지 못했습니다.');
            return;
        }

        allApplications = data || [];
        updateCounts();
        renderList();
    }

    function updateCounts() {
        const pending = allApplications.filter(a => (a.status || 'pending') === 'pending').length;
        const approved = allApplications.filter(a => a.status === 'approved').length;
        const rejected = allApplications.filter(a => a.status === 'rejected').length;

        document.getElementById('countPending').textContent = pending;
        document.getElementById('countApproved').textContent = approved;
        document.getElementById('countRejected').textContent = rejected;
    }

    function renderList() {
        const list = document.getElementById('appList');
        const filtered = allApplications.filter(a => {
            const status = a.status || 'pending';
            return status === currentTab;
        });

        if (filtered.length === 0) {
            const msgs = {
                pending: '대기 중인 신청이 없습니다',
                approved: '승인된 신청이 없습니다',
                rejected: '거부된 신청이 없습니다'
            };
            list.innerHTML = `<div class="empty-state"><div class="icon">📭</div><p>${msgs[currentTab]}</p></div>`;
            return;
        }

        list.innerHTML = filtered.map(a => {
            const initial = (a.name || '?')[0];
            const date = new Date(a.created_at).toLocaleDateString('ko-KR');
            const status = a.status || 'pending';

            let actionBtns = '';
            if (status === 'pending') {
                actionBtns = `
                    <button class="btn-approve" onclick="approveApp('${a.id}')">승인</button>
                    <button class="btn-reject" onclick="openRejectModal('${a.id}')">거부</button>
                `;
            }

            return `
                <div class="app-card">
                    <div class="app-avatar">${esc(initial)}</div>
                    <div class="app-info">
                        <div class="app-name">${esc(a.name || '-')}</div>
                        <div class="app-meta">
                            <span>📧 ${esc(a.email || '-')}</span>
                            <span>🎓 ${esc(a.specialty || '-')}</span>
                            <span>💼 ${esc(a.experience || '-')}</span>
                            <span>📅 ${date}</span>
                            ${a.reviewed_at ? `<span>🔍 검토: ${new Date(a.reviewed_at).toLocaleDateString('ko-KR')}</span>` : ''}
                        </div>
                        <div class="app-intro">${esc(a.introduction || '소개 없음')}</div>
                        ${a.reject_reason ? `<div style="margin-top:.5rem;font-size:.8rem;color:var(--red);">거부 사유: ${esc(a.reject_reason)}</div>` : ''}
                    </div>
                    <div class="app-actions">
                        ${actionBtns}
                        <button class="btn-detail" onclick="showDetail('${a.id}')">상세</button>
                    </div>
                </div>
            `;
        }).join('');
    }

    // Tabs
    function setupTabs() {
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentTab = this.dataset.tab;
                renderList();
            });
        });
    }

    // Approve
    window.approveApp = async function(id) {
        const app = allApplications.find(a => a.id === id);
        if (!app) return;

        try {
            // 1. Insert into experts table
            const { error: insertErr } = await supabaseClient.from('experts').insert({
                name: app.name,
                email: app.email,
                specialty: app.specialty,
                experience: app.experience,
                introduction: app.introduction,
                profile_image: app.profile_image || null,
                application_id: app.id
            });

            if (insertErr) {
                console.error('전문가 등록 실패:', insertErr);
                showToast('전문가 등록에 실패했습니다: ' + insertErr.message);
                return;
            }

            // 2. Update application status
            const { error: updateErr } = await supabaseClient
                .from('expert_applications')
                .update({
                    status: 'approved',
                    reviewed_at: new Date().toISOString(),
                    reviewer_note: '승인 완료'
                })
                .eq('id', id);

            if (updateErr) {
                console.error('상태 업데이트 실패:', updateErr);
                showToast('상태 업데이트에 실패했습니다.');
                return;
            }

            showToast(`${esc(app.name)}님이 전문가로 등록되었습니다.`);
            await loadApplications();
        } catch (e) {
            console.error('승인 처리 오류:', e);
            showToast('승인 처리 중 오류가 발생했습니다.');
        }
    };

    // Reject
    window.openRejectModal = function(id) {
        currentRejectId = id;
        document.getElementById('rejectReason').value = '';
        document.getElementById('rejectModal').classList.add('active');
    };

    window.closeRejectModal = function() {
        currentRejectId = null;
        document.getElementById('rejectModal').classList.remove('active');
    };

    document.getElementById('confirmRejectBtn').addEventListener('click', async function() {
        if (!currentRejectId) return;

        const reason = document.getElementById('rejectReason').value.trim();
        if (!reason) {
            showToast('거부 사유를 입력해주세요.');
            return;
        }

        const { error } = await supabaseClient
            .from('expert_applications')
            .update({
                status: 'rejected',
                reject_reason: reason,
                reviewed_at: new Date().toISOString()
            })
            .eq('id', currentRejectId);

        if (error) {
            showToast('거부 처리에 실패했습니다.');
            return;
        }

        showToast('신청이 거부되었습니다.');
        closeRejectModal();
        await loadApplications();
    });

    // Detail Modal
    window.showDetail = function(id) {
        const a = allApplications.find(x => x.id === id);
        if (!a) return;

        const date = new Date(a.created_at).toLocaleString('ko-KR');
        const status = a.status || 'pending';
        const statusLabel = { pending: '대기중', approved: '승인됨', rejected: '거부됨' };
        const statusClass = status;

        document.getElementById('detailContent').innerHTML = `
            <div class="modal-field"><label>이름</label><div class="value">${esc(a.name || '-')}</div></div>
            <div class="modal-field"><label>이메일</label><div class="value">${esc(a.email || '-')}</div></div>
            <div class="modal-field"><label>연락처</label><div class="value">${esc(a.phone || '-')}</div></div>
            <div class="modal-field"><label>전문 분야</label><div class="value">${esc(a.specialty || '-')}</div></div>
            <div class="modal-field"><label>경력</label><div class="value">${esc(a.experience || '-')}</div></div>
            <div class="modal-field"><label>자기 소개</label><div class="value" style="white-space:pre-wrap;">${esc(a.introduction || '-')}</div></div>
            <div class="modal-field"><label>포트폴리오</label><div class="value">${a.portfolio_url ? `<a href="${esc(a.portfolio_url)}" target="_blank" style="color:var(--violet);">${esc(a.portfolio_url)}</a>` : '-'}</div></div>
            <div class="modal-field"><label>신청일</label><div class="value">${date}</div></div>
            <div class="modal-field"><label>상태</label><div class="value"><span class="status-badge ${statusClass}">${statusLabel[status]}</span></div></div>
            ${a.reviewed_at ? `<div class="modal-field"><label>검토일</label><div class="value">${new Date(a.reviewed_at).toLocaleString('ko-KR')}</div></div>` : ''}
            ${a.reject_reason ? `<div class="modal-field"><label>거부 사유</label><div class="value" style="color:var(--red);">${esc(a.reject_reason)}</div></div>` : ''}
        `;

        let actionsHtml = '<button class="btn-ghost" onclick="closeDetailModal()" style="flex:1;">닫기</button>';
        if (status === 'pending') {
            actionsHtml = `
                <button class="btn-ghost" onclick="closeDetailModal()">닫기</button>
                <button style="flex:1;border:none;background:var(--green);color:#fff;border-radius:var(--radius-sm);cursor:pointer;" onclick="closeDetailModal();approveApp('${a.id}')">승인</button>
                <button style="flex:1;border:none;background:var(--red);color:#fff;border-radius:var(--radius-sm);cursor:pointer;" onclick="closeDetailModal();openRejectModal('${a.id}')">거부</button>
            `;
        }
        document.getElementById('detailActions').innerHTML = actionsHtml;

        document.getElementById('detailModal').classList.add('active');
    };

    window.closeDetailModal = function() {
        document.getElementById('detailModal').classList.remove('active');
    };

    // Close modals on overlay click
    document.getElementById('detailModal').addEventListener('click', function(e) {
        if (e.target === this) closeDetailModal();
    });
    document.getElementById('rejectModal').addEventListener('click', function(e) {
        if (e.target === this) closeRejectModal();
    });

    // Utils
    function esc(s) {
        if (!s) return '';
        const d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 3000);
    }

    // Start
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();
</script>
</body>
</html>

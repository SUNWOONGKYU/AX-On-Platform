<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 대시보드 - AX-On Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #1a1a2e;
            --ink-muted: #6b7094;
            --surface: #f8f9fc;
            --surface-warm: #faf8f5;
            --surface-card: #ffffff;
            --amber: #f59e0b;
            --teal: #14b8a6;
            --coral: #f97316;
            --violet: #8b5cf6;
            --sky: #0ea5e9;
            --red: #ef4444;
            --green: #22c55e;
            --radius: 16px;
            --radius-sm: 10px;
            --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,.07), 0 2px 4px -2px rgba(0,0,0,.05);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,.08), 0 4px 6px -4px rgba(0,0,0,.05);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Sans KR', 'Outfit', sans-serif;
            background: var(--surface);
            color: var(--ink);
            line-height: 1.6;
        }

        /* Nav */
        .nav {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            background: rgba(255,255,255,.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0,0,0,.06);
            transition: box-shadow .3s;
        }
        .nav.scrolled { box-shadow: var(--shadow-md); }
        .nav-inner {
            max-width: 1280px; margin: 0 auto;
            padding: 0 2rem; height: 64px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .nav-logo {
            font-family: 'Outfit', sans-serif;
            font-weight: 700; font-size: 1.35rem;
            color: var(--ink); text-decoration: none;
        }
        .nav-logo span { color: var(--violet); }
        .nav-links { display: flex; gap: 2rem; align-items: center; }
        .nav-links a {
            text-decoration: none; color: var(--ink-muted);
            font-size: .9rem; font-weight: 500;
            transition: color .2s;
        }
        .nav-links a:hover { color: var(--ink); }
        .nav-auth { display: flex; gap: .75rem; align-items: center; }
        .btn-ghost {
            padding: .5rem 1rem; border-radius: var(--radius-sm);
            border: 1px solid rgba(0,0,0,.1); background: transparent;
            color: var(--ink); font-size: .85rem; font-weight: 500;
            cursor: pointer; text-decoration: none; transition: all .2s;
        }
        .btn-ghost:hover { background: rgba(0,0,0,.04); }
        .btn-primary {
            padding: .5rem 1.25rem; border-radius: var(--radius-sm);
            border: none; background: var(--ink);
            color: #fff; font-size: .85rem; font-weight: 500;
            cursor: pointer; text-decoration: none; transition: all .2s;
        }
        .btn-primary:hover { opacity: .9; transform: translateY(-1px); }

        /* Page Header */
        .page-header {
            margin-top: 64px;
            padding: 3rem 2rem 2rem;
            background: linear-gradient(135deg, #1a1a2e 0%, #2d1b69 100%);
            color: #fff;
        }
        .page-header-inner {
            max-width: 1280px; margin: 0 auto;
        }
        .page-header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.75rem; font-weight: 700;
        }
        .page-header p {
            color: rgba(255,255,255,.7); margin-top: .5rem; font-size: .95rem;
        }

        /* Stats Cards */
        .stats-grid {
            max-width: 1280px; margin: -2rem auto 2rem; padding: 0 2rem;
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem;
            position: relative; z-index: 10;
        }
        .stat-card {
            background: var(--surface-card); border-radius: var(--radius);
            padding: 1.5rem; box-shadow: var(--shadow-md);
            display: flex; flex-direction: column; gap: .5rem;
        }
        .stat-card .stat-label {
            font-size: .8rem; color: var(--ink-muted); font-weight: 500;
            text-transform: uppercase; letter-spacing: .5px;
        }
        .stat-card .stat-value {
            font-family: 'Outfit', sans-serif;
            font-size: 2rem; font-weight: 700; color: var(--ink);
        }
        .stat-card .stat-icon {
            width: 40px; height: 40px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; margin-bottom: .25rem;
        }
        .stat-icon.total { background: rgba(139,92,246,.1); color: var(--violet); }
        .stat-icon.progress { background: rgba(14,165,233,.1); color: var(--sky); }
        .stat-icon.done { background: rgba(34,197,94,.1); color: var(--green); }
        .stat-icon.time { background: rgba(245,158,11,.1); color: var(--amber); }

        /* Content */
        .content {
            max-width: 1280px; margin: 0 auto; padding: 0 2rem 3rem;
        }

        /* Toolbar */
        .toolbar {
            display: flex; align-items: center; gap: 1rem;
            margin-bottom: 1.5rem; flex-wrap: wrap;
        }
        .search-box {
            flex: 1; min-width: 200px; position: relative;
        }
        .search-box input {
            width: 100%; padding: .65rem 1rem .65rem 2.5rem;
            border: 1px solid rgba(0,0,0,.1); border-radius: var(--radius-sm);
            font-size: .9rem; background: var(--surface-card);
            outline: none; transition: border-color .2s;
        }
        .search-box input:focus { border-color: var(--violet); }
        .search-box::before {
            content: '🔍'; position: absolute;
            left: .75rem; top: 50%; transform: translateY(-50%);
            font-size: .85rem;
        }
        .filter-tabs {
            display: flex; gap: .5rem;
        }
        .filter-tab {
            padding: .5rem 1rem; border-radius: 20px;
            border: 1px solid rgba(0,0,0,.1); background: var(--surface-card);
            font-size: .8rem; font-weight: 500; cursor: pointer;
            color: var(--ink-muted); transition: all .2s;
        }
        .filter-tab:hover { border-color: var(--violet); color: var(--violet); }
        .filter-tab.active {
            background: var(--violet); color: #fff; border-color: var(--violet);
        }

        /* Table */
        .table-wrap {
            background: var(--surface-card); border-radius: var(--radius);
            box-shadow: var(--shadow); overflow: hidden;
        }
        .table-wrap table {
            width: 100%; border-collapse: collapse;
        }
        .table-wrap th {
            padding: .85rem 1rem; text-align: left;
            font-size: .75rem; font-weight: 600; color: var(--ink-muted);
            text-transform: uppercase; letter-spacing: .5px;
            background: var(--surface); border-bottom: 1px solid rgba(0,0,0,.06);
        }
        .table-wrap td {
            padding: .85rem 1rem; font-size: .9rem;
            border-bottom: 1px solid rgba(0,0,0,.04);
            vertical-align: middle;
        }
        .table-wrap tr:last-child td { border-bottom: none; }
        .table-wrap tr:hover td { background: rgba(139,92,246,.02); }

        /* Status Badge */
        .badge {
            display: inline-flex; align-items: center; gap: .3rem;
            padding: .25rem .75rem; border-radius: 20px;
            font-size: .75rem; font-weight: 600;
        }
        .badge.waiting { background: rgba(245,158,11,.1); color: #b45309; }
        .badge.progress { background: rgba(14,165,233,.1); color: #0369a1; }
        .badge.done { background: rgba(34,197,94,.1); color: #15803d; }

        .company-name { font-weight: 600; color: var(--ink); }
        .contact-info { font-size: .8rem; color: var(--ink-muted); }

        .action-btn {
            padding: .35rem .75rem; border-radius: 6px;
            border: 1px solid rgba(0,0,0,.1); background: transparent;
            font-size: .75rem; cursor: pointer; color: var(--ink-muted);
            transition: all .2s;
        }
        .action-btn:hover { background: var(--surface); color: var(--ink); }

        select.status-select {
            padding: .35rem .5rem; border-radius: 6px;
            border: 1px solid rgba(0,0,0,.1); font-size: .8rem;
            background: var(--surface-card); cursor: pointer;
            outline: none;
        }

        /* Empty State */
        .empty-state {
            text-align: center; padding: 4rem 2rem; color: var(--ink-muted);
        }
        .empty-state .icon { font-size: 3rem; margin-bottom: 1rem; }

        /* Auth Block */
        .auth-block {
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            min-height: 60vh; text-align: center; padding: 2rem;
        }
        .auth-block h1 { font-size: 1.5rem; margin-bottom: .5rem; }
        .auth-block p { color: var(--ink-muted); margin-bottom: 1.5rem; }
        .auth-block a {
            color: var(--violet); text-decoration: none; font-weight: 500;
        }

        /* Detail Modal */
        .modal-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,.5); z-index: 200;
            align-items: center; justify-content: center;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: var(--surface-card); border-radius: var(--radius);
            max-width: 600px; width: 90%; max-height: 80vh;
            overflow-y: auto; padding: 2rem; box-shadow: var(--shadow-lg);
        }
        .modal h2 { font-size: 1.2rem; margin-bottom: 1.5rem; }
        .modal-field {
            margin-bottom: 1rem;
        }
        .modal-field label {
            display: block; font-size: .75rem; font-weight: 600;
            color: var(--ink-muted); text-transform: uppercase;
            letter-spacing: .5px; margin-bottom: .25rem;
        }
        .modal-field .value { font-size: .9rem; }
        .modal-close {
            margin-top: 1.5rem; width: 100%;
            padding: .65rem; border-radius: var(--radius-sm);
            border: 1px solid rgba(0,0,0,.1); background: transparent;
            font-size: .9rem; cursor: pointer; font-weight: 500;
        }

        /* Toast */
        .toast {
            position: fixed; bottom: 2rem; right: 2rem;
            padding: .75rem 1.5rem; border-radius: var(--radius-sm);
            background: var(--ink); color: #fff; font-size: .85rem;
            box-shadow: var(--shadow-lg); z-index: 300;
            transform: translateY(100px); opacity: 0;
            transition: all .3s;
        }
        .toast.show { transform: translateY(0); opacity: 1; }

        /* Responsive */
        @media (max-width: 900px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .nav-links { display: none; }
        }
        @media (max-width: 600px) {
            .stats-grid { grid-template-columns: 1fr; }
            .toolbar { flex-direction: column; }
            .filter-tabs { flex-wrap: wrap; }
            .table-wrap { overflow-x: auto; }
            .table-wrap table { min-width: 700px; }
        }
    </style>
</head>
<body>

<!-- Nav -->
<nav class="nav" id="nav">
    <div class="nav-inner">
        <a href="/" class="nav-logo">AX-<span>On</span></a>
        <div class="nav-links">
            <a href="/startup.html">시니어 AI 창업</a>
            <a href="/ax-project.html">AX 프로젝트</a>
            <a href="/expert.html">전문가</a>
            <a href="/community.html">커뮤니티</a>
        </div>
        <div class="nav-auth" id="navAuth">
            <a href="/login.html" class="btn-ghost">로그인</a>
            <a href="/signup.html" class="btn-primary">회원가입</a>
        </div>
    </div>
</nav>

<!-- Auth Check Container -->
<div id="authLoading" style="display:flex;align-items:center;justify-content:center;min-height:100vh;">
    <p style="color:var(--ink-muted);">권한 확인 중...</p>
</div>

<!-- Auth Denied -->
<div id="authDenied" class="auth-block" style="display:none;margin-top:64px;">
    <h1>관리자 전용 페이지입니다</h1>
    <p>이 페이지에 접근하려면 관리자 권한이 필요합니다.</p>
    <a href="/">메인으로 돌아가기</a>
</div>

<!-- Main Content (hidden until auth) -->
<div id="mainContent" style="display:none;">
    <div class="page-header">
        <div class="page-header-inner">
            <h1>AX 프로젝트 관리자 대시보드</h1>
            <p>접수된 프로젝트 현황을 관리합니다</p>
        </div>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-icon total">📋</div>
            <div class="stat-label">총 프로젝트</div>
            <div class="stat-value" id="statTotal">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon progress">⚡</div>
            <div class="stat-label">진행중</div>
            <div class="stat-value" id="statProgress">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon done">✅</div>
            <div class="stat-label">완료</div>
            <div class="stat-value" id="statDone">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon time">⏱</div>
            <div class="stat-label">평균 처리 기간</div>
            <div class="stat-value" id="statAvgDays">-</div>
        </div>
    </div>

    <div class="content">
        <div class="toolbar">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="기업명, 담당자, 산업으로 검색...">
            </div>
            <div class="filter-tabs">
                <button class="filter-tab active" data-filter="all">전체</button>
                <button class="filter-tab" data-filter="대기중">대기중</button>
                <button class="filter-tab" data-filter="진행중">진행중</button>
                <button class="filter-tab" data-filter="완료">완료</button>
            </div>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>기업명</th>
                        <th>산업</th>
                        <th>규모</th>
                        <th>접수일</th>
                        <th>상태</th>
                        <th>상태 변경</th>
                        <th>상세</th>
                    </tr>
                </thead>
                <tbody id="projectTableBody">
                    <tr>
                        <td colspan="7">
                            <div class="empty-state">
                                <div class="icon">📋</div>
                                <p>로딩 중...</p>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Detail Modal -->
<div class="modal-overlay" id="detailModal">
    <div class="modal">
        <h2>프로젝트 상세 정보</h2>
        <div id="modalContent"></div>
        <button class="modal-close" onclick="closeModal()">닫기</button>
    </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/config.js"></script>
<script>
(function() {
    'use strict';

    let supabaseClient = null;
    let allProjects = [];
    let currentFilter = 'all';

    // Nav scroll
    window.addEventListener('scroll', () => {
        document.getElementById('nav').classList.toggle('scrolled', window.scrollY > 10);
    });

    // Init
    async function init() {
        try {
            await AXON_CONFIG.init();
            supabaseClient = window.supabase.createClient(AXON_CONFIG.SUPABASE_URL, AXON_CONFIG.SUPABASE_ANON_KEY);
            window.supabaseClient = supabaseClient;

            const authed = await checkAdmin();
            if (!authed) return;

            await loadProjects();
            setupSearch();
            setupFilters();
            updateNavAuth();
        } catch (e) {
            console.error('[admin-dashboard] init error:', e);
            showAuthDenied();
        }
    }

    async function checkAdmin() {
        const { data: { user } } = await supabaseClient.auth.getUser();
        if (!user) { showAuthDenied(); return false; }

        const { data: profile } = await supabaseClient
            .from('profiles').select('role').eq('id', user.id).single();

        if (!profile || profile.role !== 'admin') { showAuthDenied(); return false; }

        document.getElementById('authLoading').style.display = 'none';
        document.getElementById('mainContent').style.display = 'block';
        return true;
    }

    function showAuthDenied() {
        document.getElementById('authLoading').style.display = 'none';
        document.getElementById('authDenied').style.display = 'flex';
    }

    async function updateNavAuth() {
        const { data: { user } } = await supabaseClient.auth.getUser();
        const navAuth = document.getElementById('navAuth');
        if (user) {
            navAuth.innerHTML = `
                <span style="font-size:.85rem;color:var(--ink-muted);">관리자</span>
                <button class="btn-ghost" onclick="handleLogout()">로그아웃</button>
            `;
        }
    }

    window.handleLogout = async function() {
        await supabaseClient.auth.signOut();
        location.href = '/';
    };

    // Load projects
    async function loadProjects() {
        const { data, error } = await supabaseClient
            .from('ax_project_requests')
            .select('*')
            .order('created_at', { ascending: false });

        if (error) {
            console.error('프로젝트 조회 실패:', error);
            showToast('프로젝트 목록을 불러오지 못했습니다.');
            return;
        }

        allProjects = data || [];
        updateStats();
        renderTable(allProjects);
    }

    function updateStats() {
        const total = allProjects.length;
        const waiting = allProjects.filter(p => (p.status || '대기중') === '대기중').length;
        const progress = allProjects.filter(p => p.status === '진행중').length;
        const done = allProjects.filter(p => p.status === '완료').length;

        document.getElementById('statTotal').textContent = total;
        document.getElementById('statProgress').textContent = progress;
        document.getElementById('statDone').textContent = done;

        // Average processing days for completed projects
        const completedWithDates = allProjects.filter(p => p.status === '완료' && p.completed_at && p.created_at);
        if (completedWithDates.length > 0) {
            const totalDays = completedWithDates.reduce((sum, p) => {
                const days = Math.ceil((new Date(p.completed_at) - new Date(p.created_at)) / (1000*60*60*24));
                return sum + days;
            }, 0);
            document.getElementById('statAvgDays').textContent = Math.round(totalDays / completedWithDates.length) + '일';
        } else {
            document.getElementById('statAvgDays').textContent = '-';
        }
    }

    function renderTable(projects) {
        const tbody = document.getElementById('projectTableBody');

        if (projects.length === 0) {
            tbody.innerHTML = `
                <tr><td colspan="7">
                    <div class="empty-state">
                        <div class="icon">📭</div>
                        <p>접수된 프로젝트가 없습니다</p>
                    </div>
                </td></tr>`;
            return;
        }

        tbody.innerHTML = projects.map(p => {
            const status = p.status || '대기중';
            const badgeClass = status === '진행중' ? 'progress' : status === '완료' ? 'done' : 'waiting';
            const date = new Date(p.created_at).toLocaleDateString('ko-KR');

            return `
                <tr>
                    <td>
                        <div class="company-name">${esc(p.company_name || '-')}</div>
                        <div class="contact-info">${esc(p.contact_name || '')} · ${esc(p.email || '')}</div>
                    </td>
                    <td>${esc(p.industry || '-')}</td>
                    <td>${esc(p.company_size || '-')}</td>
                    <td>${date}</td>
                    <td><span class="badge ${badgeClass}">${status}</span></td>
                    <td>
                        <select class="status-select" onchange="updateStatus('${p.id}', this.value)">
                            <option value="대기중" ${status==='대기중'?'selected':''}>대기중</option>
                            <option value="진행중" ${status==='진행중'?'selected':''}>진행중</option>
                            <option value="완료" ${status==='완료'?'selected':''}>완료</option>
                        </select>
                    </td>
                    <td><button class="action-btn" onclick="showDetail('${p.id}')">상세</button></td>
                </tr>`;
        }).join('');
    }

    // Status update
    window.updateStatus = async function(id, newStatus) {
        const updateData = { status: newStatus };
        if (newStatus === '완료') updateData.completed_at = new Date().toISOString();

        const { error } = await supabaseClient
            .from('ax_project_requests')
            .update(updateData)
            .eq('id', id);

        if (error) {
            showToast('상태 변경에 실패했습니다.');
            return;
        }

        showToast(`상태가 "${newStatus}"(으)로 변경되었습니다.`);
        await loadProjects();
        applyCurrentFilter();
    };

    // Detail modal
    window.showDetail = function(id) {
        const p = allProjects.find(x => x.id === id);
        if (!p) return;

        const areas = Array.isArray(p.selected_areas) ? p.selected_areas.join(', ') : (p.selected_areas || '-');
        const date = new Date(p.created_at).toLocaleString('ko-KR');

        document.getElementById('modalContent').innerHTML = `
            <div class="modal-field"><label>기업명</label><div class="value">${esc(p.company_name || '-')}</div></div>
            <div class="modal-field"><label>담당자</label><div class="value">${esc(p.contact_name || '-')}</div></div>
            <div class="modal-field"><label>연락처</label><div class="value">${esc(p.phone || '-')}</div></div>
            <div class="modal-field"><label>이메일</label><div class="value">${esc(p.email || '-')}</div></div>
            <div class="modal-field"><label>산업</label><div class="value">${esc(p.industry || '-')}</div></div>
            <div class="modal-field"><label>기업 규모</label><div class="value">${esc(p.company_size || '-')}</div></div>
            <div class="modal-field"><label>선택 분야</label><div class="value">${esc(areas)}</div></div>
            <div class="modal-field"><label>추가 요청사항</label><div class="value">${esc(p.message || '없음')}</div></div>
            <div class="modal-field"><label>접수일시</label><div class="value">${date}</div></div>
            <div class="modal-field"><label>현재 상태</label><div class="value">${esc(p.status || '대기중')}</div></div>
        `;

        document.getElementById('detailModal').classList.add('active');
    };

    window.closeModal = function() {
        document.getElementById('detailModal').classList.remove('active');
    };

    // Close modal on overlay click
    document.getElementById('detailModal').addEventListener('click', function(e) {
        if (e.target === this) closeModal();
    });

    // Search
    function setupSearch() {
        document.getElementById('searchInput').addEventListener('input', function() {
            applyCurrentFilter();
        });
    }

    // Filters
    function setupFilters() {
        document.querySelectorAll('.filter-tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                currentFilter = this.dataset.filter;
                applyCurrentFilter();
            });
        });
    }

    function applyCurrentFilter() {
        const query = document.getElementById('searchInput').value.toLowerCase().trim();
        let filtered = allProjects;

        if (currentFilter !== 'all') {
            filtered = filtered.filter(p => (p.status || '대기중') === currentFilter);
        }

        if (query) {
            filtered = filtered.filter(p =>
                (p.company_name || '').toLowerCase().includes(query) ||
                (p.contact_name || '').toLowerCase().includes(query) ||
                (p.industry || '').toLowerCase().includes(query) ||
                (p.email || '').toLowerCase().includes(query)
            );
        }

        renderTable(filtered);
    }

    // Utils
    function esc(s) {
        if (!s) return '';
        const d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 3000);
    }

    // Start
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();
</script>
</body>
</html>

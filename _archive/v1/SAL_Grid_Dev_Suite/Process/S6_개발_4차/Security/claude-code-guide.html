@description claude-code-guide.html 접근 제한 — 관리자 전용 인증 체크
@stage S6 — 개발 4차
@area S (Security)
-->
<script>
// @task S6S1 — 접근 제한
(function() {
  // 관리자 인증 확인 (Supabase Auth)
  const checkAccess = async () => {
    try {
      const { data: { user } } = await window.supabaseClient?.auth.getUser() || { data: { user: null } };
      if (!user) {
        document.body.innerHTML = '<h1>접근 권한이 없습니다</h1><p><a href="/">메인으로 돌아가기</a></p>';
        return;
      }
      // 관리자 역할 확인
      const { data: profile } = await window.supabaseClient
        .from('profiles')
        .select('role')
        .eq('id', user.id)
        .single();
      if (!profile || profile.role !== 'admin') {
        document.body.innerHTML = '<h1>관리자 전용 페이지입니다</h1><p><a href="/">메인으로 돌아가기</a></p>';
      }
    } catch (e) {
      document.body.innerHTML = '<h1>접근 권한이 없습니다</h1><p><a href="/">메인으로 돌아가기</a></p>';
    }
  };
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', checkAccess);
  } else {
    checkAccess();
  }
})();
</script>

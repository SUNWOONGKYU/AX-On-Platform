<!-- MAIN -->
<main class="error-page" id="main-content">
  <div class="error-content">

    <!-- SVG 일러스트레이션: 깨진 링크 / 미아 표현 -->
    <svg class="error-illustration" viewBox="0 0 280 220" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" role="img">
      <!-- 배경 원 -->
      <circle cx="140" cy="110" r="90" fill="rgba(232,146,13,0.06)" />
      <circle cx="140" cy="110" r="65" fill="rgba(232,146,13,0.05)" />

      <!-- 플로팅 그룹: 주 캐릭터 (길 잃은 아이콘) -->
      <g class="float-group">
        <!-- 문서/페이지 기본 형태 -->
        <rect x="85" y="48" width="110" height="132" rx="12" fill="#fff" stroke="rgba(26,26,46,0.1)" stroke-width="1.5"/>
        <!-- 접힌 모서리 -->
        <path d="M167 48 L195 76 L167 76 Z" fill="rgba(232,146,13,0.15)" stroke="rgba(232,146,13,0.3)" stroke-width="1"/>
        <path d="M167 48 L195 76 L167 76" fill="rgba(232,146,13,0.08)"/>

        <!-- 404 텍스트 -->
        <text x="140" y="102" text-anchor="middle" font-family="Outfit,Arial Black,sans-serif" font-weight="900" font-size="38" fill="#e8920d" opacity="0.9">404</text>

        <!-- 줄 장식 (깨진 링크 암시) -->
        <line x1="105" y1="120" x2="145" y2="120" stroke="rgba(26,26,46,0.15)" stroke-width="2" stroke-linecap="round"/>
        <line x1="153" y1="120" x2="175" y2="120" stroke="rgba(26,26,46,0.08)" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 3"/>
        <line x1="105" y1="132" x2="160" y2="132" stroke="rgba(26,26,46,0.1)" stroke-width="2" stroke-linecap="round"/>
        <line x1="105" y1="144" x2="135" y2="144" stroke="rgba(26,26,46,0.08)" stroke-width="2" stroke-linecap="round"/>
      </g>

      <!-- 플로팅 그룹: 물음표 버블 -->
      <g class="float-group-fast">
        <circle cx="62" cy="68" r="22" fill="rgba(232,146,13,0.1)" stroke="rgba(232,146,13,0.25)" stroke-width="1.5"/>
        <text x="62" y="74" text-anchor="middle" font-family="Outfit,Arial Black,sans-serif" font-weight="900" font-size="22" fill="#e8920d">?</text>
      </g>

      <!-- 플로팅 그룹: 깨진 체인 링크 -->
      <g class="float-group-slow">
        <!-- 왼쪽 링크 -->
        <path d="M206 72 C206 68 209 65 213 65 L221 65 C225 65 228 68 228 72 L228 80 C228 84 225 87 221 87 L213 87 C209 87 206 84 206 80 Z"
              fill="none" stroke="rgba(124,92,224,0.5)" stroke-width="2.5" stroke-linecap="round"/>
        <!-- 오른쪽 링크 (아래 어긋남) -->
        <path d="M216 83 C216 79 219 76 223 76 L231 76 C235 76 238 79 238 83 L238 91 C238 95 235 98 231 98 L223 98 C219 98 216 95 216 91 Z"
              fill="none" stroke="rgba(232,93,74,0.5)" stroke-width="2.5" stroke-linecap="round"/>
        <!-- 끊김 표시 -->
        <line x1="222" y1="83" x2="226" y2="78" stroke="rgba(26,26,46,0.2)" stroke-width="1.5" stroke-dasharray="2 2"/>
      </g>

      <!-- 작은 별/점 장식 -->
      <circle cx="54" cy="148" r="3" fill="rgba(232,146,13,0.3)"/>
      <circle cx="230" cy="58" r="2" fill="rgba(13,148,136,0.3)"/>
      <circle cx="245" cy="140" r="4" fill="rgba(232,146,13,0.15)"/>
      <circle cx="42" cy="108" r="2.5" fill="rgba(124,92,224,0.2)"/>
    </svg>

    <!-- 에러 코드 배지 -->
    <div class="error-code-badge">
      <span class="badge-dot"></span>
      404 Not Found
    </div>

    <!-- 제목 & 설명 -->
    <h1 class="error-title">페이지를 찾을 수 없습니다</h1>
    <p class="error-desc">
      요청하신 페이지가 존재하지 않거나 이동되었습니다.<br>
      주소를 다시 확인하거나 아래 버튼을 눌러주세요.
    </p>

    <!-- 버튼 -->
    <div class="error-actions">
      <a href="../../../../index.html" class="btn btn-primary">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 12L12 3l9 9"/><path d="M9 21V12h6v9"/>
        </svg>
        홈으로 돌아가기
      </a>
      <button onclick="history.back()" class="btn btn-outline">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/>
        </svg>
        이전 페이지로
      </button>
    </div>

  </div>

<script src="../js/error-handler.js"></script>
<script>
  // 네비게이션 스크롤 효과
  const nav = document.getElementById('nav');
  window.addEventListener('scroll', () => {
    nav.classList.toggle('scrolled', window.scrollY > 10);
  }, { passive: true });

  // 모바일 메뉴 토글
  const toggle = document.getElementById('mobileToggle');
  const navLinks = document.getElementById('navLinks');
  toggle.addEventListener('click', () => {
    const isOpen = navLinks.classList.toggle('open');
    toggle.setAttribute('aria-expanded', String(isOpen));
    toggle.setAttribute('aria-label', isOpen ? '메뉴 닫기' : '메뉴 열기');
  });

  // 에러 핸들러 초기화
  if (window.ErrorHandler) {
    window.ErrorHandler.init({ pageType: '404' });
  }
</script>

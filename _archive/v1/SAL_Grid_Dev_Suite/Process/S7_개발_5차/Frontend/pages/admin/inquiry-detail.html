<!-- @task S7F7 -->
<!--
@description 문의 상세 보기 및 답변 작성 페이지
@area Frontend
@stage S7
@url /pages/admin/inquiry-detail.html?id={inquiry_id}
-->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>문의 상세 — AX-On Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Quill.js CDN -->
    <link href="https://cdn.jsdelivr.net/npm/quill@2/dist/quill.snow.css" rel="stylesheet">
    <style>
        :root {
            --ink: #1a1a2e;
            --ink-muted: #6b7094;
            --surface: #f8f9fc;
            --surface-warm: #faf8f5;
            --surface-card: #ffffff;
            --amber: #f59e0b;
            --teal: #14b8a6;
            --coral: #f97316;
            --violet: #8b5cf6;
            --sky: #0ea5e9;
            --red: #ef4444;
            --green: #22c55e;
            --radius: 16px;
            --radius-sm: 10px;
            --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,.07), 0 2px 4px -2px rgba(0,0,0,.05);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,.08), 0 4px 6px -4px rgba(0,0,0,.05);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Sans KR', 'Outfit', sans-serif;
            background: var(--surface);
            color: var(--ink);
            line-height: 1.6;
        }

        /* ── Nav ── */
        .nav {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            background: rgba(255,255,255,.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0,0,0,.06);
            transition: box-shadow .3s;
        }
        .nav.scrolled { box-shadow: var(--shadow-md); }
        .nav-inner {
            max-width: 1200px; margin: 0 auto;
            padding: 0 2rem; height: 64px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .nav-logo {
            font-family: 'Outfit', sans-serif;
            font-weight: 700; font-size: 1.35rem;
            color: var(--ink); text-decoration: none;
        }
        .nav-logo span { color: var(--violet); }
        .nav-badge {
            display: inline-flex; align-items: center;
            padding: .25rem .6rem; border-radius: 6px;
            background: rgba(139,92,246,.1); color: var(--violet);
            font-size: .72rem; font-weight: 700;
            margin-left: .6rem;
        }
        .nav-right { display: flex; gap: .75rem; align-items: center; }
        .btn-back {
            display: inline-flex; align-items: center; gap: .4rem;
            padding: .45rem .95rem; border-radius: var(--radius-sm);
            border: 1px solid rgba(0,0,0,.1); background: transparent;
            color: var(--ink-muted); font-size: .85rem; font-weight: 500;
            cursor: pointer; text-decoration: none; transition: all .2s;
        }
        .btn-back:hover { background: rgba(0,0,0,.04); color: var(--ink); }
        .btn-ghost {
            padding: .45rem .95rem; border-radius: var(--radius-sm);
            border: 1px solid rgba(0,0,0,.1); background: transparent;
            color: var(--ink); font-size: .85rem; font-weight: 500;
            cursor: pointer; font-family: 'Noto Sans KR', sans-serif; transition: all .2s;
        }
        .btn-ghost:hover { background: rgba(0,0,0,.04); }

        /* ── Auth ── */
        .auth-loading {
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh;
        }
        .auth-loading p { color: var(--ink-muted); }
        .auth-denied {
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            min-height: 80vh; text-align: center; padding: 2rem; margin-top: 64px;
        }
        .auth-denied h2 { font-size: 1.3rem; margin-bottom: .5rem; }
        .auth-denied p { color: var(--ink-muted); }
        .auth-denied a { color: var(--violet); text-decoration: none; font-weight: 600; margin-top: 1rem; display: inline-block; }

        /* ── Layout ── */
        .page-wrap {
            max-width: 1200px; margin: 80px auto 3rem; padding: 0 2rem;
            display: grid; grid-template-columns: 1fr 420px; gap: 2rem;
        }
        @media (max-width: 960px) {
            .page-wrap { grid-template-columns: 1fr; }
        }

        /* ── Card ── */
        .card {
            background: var(--surface-card); border-radius: var(--radius);
            box-shadow: var(--shadow); overflow: hidden;
        }
        .card-header {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid rgba(0,0,0,.06);
            display: flex; align-items: center; justify-content: space-between;
        }
        .card-title {
            font-size: 1rem; font-weight: 700; color: var(--ink);
            display: flex; align-items: center; gap: .5rem;
        }
        .card-body { padding: 1.5rem; }

        /* ── Badge ── */
        .badge {
            display: inline-flex; align-items: center; gap: .3rem;
            padding: .22rem .65rem; border-radius: 20px;
            font-size: .73rem; font-weight: 600;
        }
        .badge.cat-lecture  { background: rgba(139,92,246,.1); color: #6d28d9; }
        .badge.cat-tech     { background: rgba(14,165,233,.1); color: #0369a1; }
        .badge.cat-payment  { background: rgba(245,158,11,.1); color: #b45309; }
        .badge.cat-other    { background: rgba(107,114,128,.1); color: #4b5563; }
        .badge.status-wait  { background: rgba(245,158,11,.12); color: #b45309; }
        .badge.status-done  { background: rgba(34,197,94,.12); color: #15803d; }

        /* ── Inquiry detail ── */
        .inquiry-subject {
            font-size: 1.25rem; font-weight: 700;
            margin-bottom: 1rem; line-height: 1.5;
        }
        .inquiry-meta {
            display: flex; flex-wrap: wrap; gap: .75rem;
            margin-bottom: 1.5rem;
        }
        .meta-item {
            display: flex; align-items: center; gap: .35rem;
            font-size: .82rem; color: var(--ink-muted);
        }
        .meta-item strong { color: var(--ink); font-weight: 600; }
        .meta-sep { color: rgba(0,0,0,.15); }
        .inquiry-body {
            background: var(--surface); border-radius: var(--radius-sm);
            padding: 1.25rem; font-size: .92rem;
            line-height: 1.85; white-space: pre-wrap;
            border: 1px solid rgba(0,0,0,.05);
        }

        /* ── Attachments ── */
        .attachments { margin-top: 1rem; }
        .attachment-label {
            font-size: .75rem; font-weight: 600; color: var(--ink-muted);
            text-transform: uppercase; letter-spacing: .5px; margin-bottom: .5rem;
        }
        .attachment-list { display: flex; flex-direction: column; gap: .4rem; }
        .attachment-item {
            display: flex; align-items: center; gap: .5rem;
            padding: .5rem .75rem; border-radius: 8px;
            background: var(--surface); border: 1px solid rgba(0,0,0,.06);
            font-size: .82rem;
        }
        .attachment-item a { color: var(--sky); text-decoration: none; font-weight: 500; }
        .attachment-item a:hover { text-decoration: underline; }

        /* ── Previous response ── */
        .prev-response {
            background: rgba(34,197,94,.05);
            border: 1px solid rgba(34,197,94,.15);
            border-radius: var(--radius-sm);
            padding: 1.25rem;
            margin-bottom: 1.25rem;
        }
        .prev-response-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: .75rem;
        }
        .prev-response-title {
            font-size: .82rem; font-weight: 700; color: #15803d;
            display: flex; align-items: center; gap: .35rem;
        }
        .prev-response-date { font-size: .75rem; color: var(--ink-muted); }
        .prev-response-body {
            font-size: .88rem; line-height: 1.8;
            white-space: pre-wrap;
        }

        /* ── Reply form ── */
        .form-group { margin-bottom: 1.25rem; }
        .form-label {
            display: block; font-size: .8rem; font-weight: 600;
            color: var(--ink-muted); text-transform: uppercase;
            letter-spacing: .5px; margin-bottom: .5rem;
        }
        .form-select {
            width: 100%; padding: .65rem .9rem;
            border: 1px solid rgba(0,0,0,.1); border-radius: var(--radius-sm);
            font-size: .88rem; background: var(--surface-card);
            outline: none; cursor: pointer; transition: border-color .2s;
            font-family: 'Noto Sans KR', sans-serif; color: var(--ink);
        }
        .form-select:focus { border-color: var(--violet); }

        /* Quill editor */
        .quill-wrap {
            border: 1px solid rgba(0,0,0,.1); border-radius: var(--radius-sm);
            overflow: hidden; transition: border-color .2s;
        }
        .quill-wrap:focus-within { border-color: var(--violet); }
        .quill-wrap .ql-toolbar.ql-snow {
            border: none; border-bottom: 1px solid rgba(0,0,0,.06);
            background: var(--surface);
        }
        .quill-wrap .ql-container.ql-snow {
            border: none; font-size: .9rem;
            font-family: 'Noto Sans KR', sans-serif;
        }
        .quill-wrap .ql-editor {
            min-height: 180px; max-height: 320px; overflow-y: auto;
        }

        /* File upload */
        .file-upload-area {
            border: 1.5px dashed rgba(0,0,0,.15); border-radius: var(--radius-sm);
            padding: 1rem 1.25rem;
            display: flex; align-items: center; gap: .75rem;
            cursor: pointer; transition: all .2s;
        }
        .file-upload-area:hover { border-color: var(--violet); background: rgba(139,92,246,.02); }
        .file-upload-icon { font-size: 1.25rem; flex-shrink: 0; }
        .file-upload-text { font-size: .82rem; }
        .file-upload-text span { font-weight: 600; color: var(--violet); }
        .file-upload-desc { font-size: .75rem; color: var(--ink-muted); margin-top: .15rem; }
        .file-list { margin-top: .5rem; display: flex; flex-direction: column; gap: .35rem; }
        .file-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: .4rem .75rem; border-radius: 8px;
            background: var(--surface); font-size: .8rem;
        }
        .file-item-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .file-item-remove {
            background: none; border: none; cursor: pointer;
            color: var(--ink-muted); font-size: .85rem; padding: 0 .25rem;
            flex-shrink: 0; transition: color .2s;
        }
        .file-item-remove:hover { color: var(--red); }
        .file-size-warn { font-size: .75rem; color: var(--red); margin-top: .35rem; }

        /* Submit button */
        .btn-submit {
            width: 100%; padding: .85rem;
            border-radius: var(--radius-sm); border: none;
            background: var(--violet); color: #fff;
            font-size: .95rem; font-weight: 700;
            cursor: pointer; font-family: 'Noto Sans KR', sans-serif;
            transition: all .25s;
            display: flex; align-items: center; justify-content: center; gap: .5rem;
        }
        .btn-submit:hover:not(:disabled) { opacity: .9; transform: translateY(-1px); }
        .btn-submit:disabled { opacity: .5; cursor: not-allowed; transform: none; }

        /* ── User info card ── */
        .info-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: .6rem 0; border-bottom: 1px solid rgba(0,0,0,.04);
            font-size: .87rem;
        }
        .info-row:last-child { border-bottom: none; }
        .info-key { color: var(--ink-muted); font-weight: 500; }
        .info-val { font-weight: 600; text-align: right; }

        /* ── Toast ── */
        .toast {
            position: fixed; bottom: 2rem; right: 2rem;
            padding: .7rem 1.4rem; border-radius: var(--radius-sm);
            background: var(--ink); color: #fff; font-size: .85rem;
            box-shadow: var(--shadow-lg); z-index: 300;
            transform: translateY(100px); opacity: 0; transition: all .3s;
        }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.success { background: #15803d; }
        .toast.error   { background: #b91c1c; }

        /* Loading skeleton */
        .skeleton {
            background: linear-gradient(90deg, var(--surface) 25%, rgba(0,0,0,.04) 50%, var(--surface) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.4s infinite;
            border-radius: 6px; height: 1em;
        }
        @keyframes shimmer { to { background-position: -200% 0; } }
    </style>
</head>
<body>

<!-- Nav -->
<nav class="nav" id="mainNav">
    <div class="nav-inner">
        <a href="/index.html" class="nav-logo">
            AX-<span>On</span>
            <span class="nav-badge">ADMIN</span>
        </a>
        <div class="nav-right">
            <a href="inquiries.html" class="btn-back">← 목록으로</a>
            <button class="btn-ghost" onclick="handleLogout()">로그아웃</button>
        </div>
    </div>
</nav>

<!-- Auth Loading -->
<div class="auth-loading" id="authLoading">
    <p>권한 확인 중...</p>
</div>

<!-- Auth Denied -->
<div class="auth-denied" id="authDenied" style="display:none;">
    <h2>관리자 전용 페이지입니다</h2>
    <p>관리자 권한이 필요합니다.</p>
    <a href="/index.html">메인으로 돌아가기</a>
</div>

<!-- Main -->
<div id="mainContent" style="display:none;">
    <div class="page-wrap">
        <!-- Left: Inquiry Detail -->
        <div>
            <!-- Inquiry Card -->
            <div class="card" id="inquiryCard">
                <div class="card-header">
                    <div class="card-title">📄 문의 원문</div>
                    <div id="inquiryStatusBadge"></div>
                </div>
                <div class="card-body" id="inquiryDetailBody">
                    <div class="skeleton" style="height:1.5rem; width:70%; margin-bottom:1rem;"></div>
                    <div class="skeleton" style="height:1rem; width:50%; margin-bottom:.5rem;"></div>
                    <div class="skeleton" style="height:6rem; width:100%;"></div>
                </div>
            </div>

            <!-- Previous Responses -->
            <div style="margin-top:1.5rem; display:none;" id="prevResponsesWrap">
                <div class="card">
                    <div class="card-header">
                        <div class="card-title">💬 이전 답변</div>
                    </div>
                    <div class="card-body" id="prevResponsesBody"></div>
                </div>
            </div>
        </div>

        <!-- Right: Reply + Info -->
        <div>
            <!-- Reply Form -->
            <div class="card" style="margin-bottom:1.25rem;">
                <div class="card-header">
                    <div class="card-title">✏️ 답변 작성</div>
                </div>
                <div class="card-body">
                    <div id="alreadyAnsweredBanner" style="display:none; margin-bottom:1rem; padding:.75rem 1rem; background:rgba(34,197,94,.08); border:1px solid rgba(34,197,94,.2); border-radius:10px; font-size:.85rem; color:#15803d; font-weight:600;">
                        ✅ 이미 답변이 완료된 문의입니다. 추가 답변을 작성할 수 있습니다.
                    </div>

                    <!-- Template select -->
                    <div class="form-group">
                        <label class="form-label">답변 템플릿 선택</label>
                        <select class="form-select" id="templateSelect">
                            <option value="">템플릿 선택 (선택사항)</option>
                            <option value="general">일반 안내</option>
                            <option value="tech">기술지원</option>
                            <option value="payment">결제 문의</option>
                        </select>
                    </div>

                    <!-- Quill editor -->
                    <div class="form-group">
                        <label class="form-label">답변 내용 <span style="color:var(--red);">*</span></label>
                        <div class="quill-wrap">
                            <div id="quillEditor"></div>
                        </div>
                        <div id="editorHint" style="font-size:.75rem; color:var(--ink-muted); margin-top:.35rem;">답변 내용을 입력하세요.</div>
                    </div>

                    <!-- File upload -->
                    <div class="form-group">
                        <label class="form-label">첨부파일 (최대 5MB)</label>
                        <div class="file-upload-area" onclick="document.getElementById('fileInput').click()">
                            <span class="file-upload-icon">📎</span>
                            <div>
                                <div class="file-upload-text"><span>파일 선택</span> 또는 드래그&드롭</div>
                                <div class="file-upload-desc">PNG, JPG, PDF, DOCX — 최대 5MB</div>
                            </div>
                        </div>
                        <input type="file" id="fileInput" style="display:none;" multiple accept=".png,.jpg,.jpeg,.gif,.pdf,.docx,.xlsx,.txt">
                        <div id="fileList" class="file-list"></div>
                        <div id="fileSizeWarn" class="file-size-warn" style="display:none;"></div>
                    </div>

                    <!-- Submit -->
                    <button class="btn-submit" id="submitBtn" onclick="submitResponse()">
                        <span>답변 전송</span>
                    </button>
                </div>
            </div>

            <!-- User Info Card -->
            <div class="card">
                <div class="card-header">
                    <div class="card-title">👤 문의자 정보</div>
                </div>
                <div class="card-body" id="userInfoBody">
                    <div class="skeleton" style="height:1rem; margin-bottom:.75rem;"></div>
                    <div class="skeleton" style="height:1rem; margin-bottom:.75rem;"></div>
                    <div class="skeleton" style="height:1rem;"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/quill@2/dist/quill.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../../js/config.js"></script>
<script src="../../js/admin-inquiries.js"></script>
<script>
// @task S7F7
(function () {
    'use strict';

    // Nav scroll
    const nav = document.getElementById('mainNav');
    window.addEventListener('scroll', () => {
        nav.classList.toggle('scrolled', window.scrollY > 10);
    }, { passive: true });
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>신고 관리 - AX-On Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #1a1a2e;
            --ink-muted: #6b7094;
            --surface: #f8f9fc;
            --surface-warm: #faf8f5;
            --surface-card: #ffffff;
            --amber: #f59e0b;
            --teal: #14b8a6;
            --coral: #f97316;
            --violet: #8b5cf6;
            --sky: #0ea5e9;
            --red: #ef4444;
            --green: #22c55e;
            --radius: 16px;
            --radius-sm: 10px;
            --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,.07), 0 2px 4px -2px rgba(0,0,0,.05);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,.08), 0 4px 6px -4px rgba(0,0,0,.05);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Sans KR', 'Outfit', sans-serif;
            background: var(--surface);
            color: var(--ink);
            line-height: 1.6;
        }

        /* Nav */
        .nav {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            background: rgba(255,255,255,.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0,0,0,.06);
            transition: box-shadow .3s;
        }
        .nav.scrolled { box-shadow: var(--shadow-md); }
        .nav-inner {
            max-width: 1280px; margin: 0 auto;
            padding: 0 2rem; height: 64px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .nav-logo {
            font-family: 'Outfit', sans-serif;
            font-weight: 700; font-size: 1.35rem;
            color: var(--ink); text-decoration: none;
        }
        .nav-logo span { color: var(--violet); }
        .nav-links { display: flex; gap: 2rem; align-items: center; }
        .nav-links a {
            text-decoration: none; color: var(--ink-muted);
            font-size: .9rem; font-weight: 500; transition: color .2s;
        }
        .nav-links a:hover, .nav-links a.active { color: var(--ink); }
        .nav-auth { display: flex; gap: .75rem; align-items: center; }
        .btn-ghost {
            padding: .5rem 1rem; border-radius: var(--radius-sm);
            border: 1px solid rgba(0,0,0,.1); background: transparent;
            color: var(--ink); font-size: .85rem; font-weight: 500;
            cursor: pointer; text-decoration: none; transition: all .2s;
        }
        .btn-ghost:hover { background: rgba(0,0,0,.04); }
        .btn-primary {
            padding: .5rem 1.25rem; border-radius: var(--radius-sm);
            border: none; background: var(--ink);
            color: #fff; font-size: .85rem; font-weight: 500;
            cursor: pointer; text-decoration: none; transition: all .2s;
        }
        .btn-primary:hover { opacity: .9; transform: translateY(-1px); }

        /* Page Header */
        .page-header {
            margin-top: 64px;
            padding: 3rem 2rem 2rem;
            background: linear-gradient(135deg, #1a1a2e 0%, #7c2d12 100%);
            color: #fff;
        }
        .page-header-inner {
            max-width: 1280px; margin: 0 auto;
            display: flex; align-items: flex-start; justify-content: space-between;
            flex-wrap: wrap; gap: 1rem;
        }
        .page-header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.75rem; font-weight: 700;
        }
        .page-header p {
            color: rgba(255,255,255,.7); margin-top: .5rem; font-size: .95rem;
        }
        .header-actions { display: flex; gap: .75rem; align-items: center; }
        .header-link {
            padding: .5rem 1rem; border-radius: var(--radius-sm);
            border: 1px solid rgba(255,255,255,.3);
            color: rgba(255,255,255,.85); font-size: .85rem; font-weight: 500;
            text-decoration: none; transition: all .2s;
        }
        .header-link:hover { background: rgba(255,255,255,.1); }

        /* Stats Cards */
        .stats-grid {
            max-width: 1280px; margin: -2rem auto 2rem; padding: 0 2rem;
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem;
            position: relative; z-index: 10;
        }
        .stat-card {
            background: var(--surface-card); border-radius: var(--radius);
            padding: 1.5rem; box-shadow: var(--shadow-md);
            display: flex; flex-direction: column; gap: .5rem;
        }
        .stat-card .stat-label {
            font-size: .8rem; color: var(--ink-muted); font-weight: 500;
            text-transform: uppercase; letter-spacing: .5px;
        }
        .stat-card .stat-value {
            font-family: 'Outfit', sans-serif;
            font-size: 2rem; font-weight: 700; color: var(--ink);
        }
        .stat-card .stat-icon {
            width: 40px; height: 40px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; margin-bottom: .25rem;
        }
        .stat-icon.total { background: rgba(239,68,68,.1); color: var(--red); }
        .stat-icon.pending { background: rgba(245,158,11,.1); color: var(--amber); }
        .stat-icon.done { background: rgba(34,197,94,.1); color: var(--green); }
        .stat-icon.rejected { background: rgba(107,112,148,.1); color: var(--ink-muted); }

        /* Content */
        .content {
            max-width: 1280px; margin: 0 auto; padding: 0 2rem 3rem;
        }

        /* Toolbar */
        .toolbar {
            display: flex; align-items: center; gap: 1rem;
            margin-bottom: 1.5rem; flex-wrap: wrap;
        }
        .search-box {
            flex: 1; min-width: 200px; position: relative;
        }
        .search-box input {
            width: 100%; padding: .65rem 1rem .65rem 2.5rem;
            border: 1px solid rgba(0,0,0,.1); border-radius: var(--radius-sm);
            font-size: .9rem; background: var(--surface-card);
            outline: none; transition: border-color .2s;
        }
        .search-box input:focus { border-color: var(--red); }
        .search-icon {
            position: absolute; left: .75rem; top: 50%;
            transform: translateY(-50%); font-size: .85rem; pointer-events: none;
        }
        .filter-group { display: flex; gap: .5rem; flex-wrap: wrap; }
        .filter-tab {
            padding: .5rem 1rem; border-radius: 20px;
            border: 1px solid rgba(0,0,0,.1); background: var(--surface-card);
            font-size: .8rem; font-weight: 500; cursor: pointer;
            color: var(--ink-muted); transition: all .2s;
        }
        .filter-tab:hover { border-color: var(--red); color: var(--red); }
        .filter-tab.active {
            background: var(--red); color: #fff; border-color: var(--red);
        }
        .filter-select {
            padding: .5rem .75rem; border-radius: var(--radius-sm);
            border: 1px solid rgba(0,0,0,.1); background: var(--surface-card);
            font-size: .85rem; cursor: pointer; outline: none; color: var(--ink);
        }

        /* Table */
        .table-wrap {
            background: var(--surface-card); border-radius: var(--radius);
            box-shadow: var(--shadow); overflow: hidden;
        }
        .table-wrap table {
            width: 100%; border-collapse: collapse;
        }
        .table-wrap th {
            padding: .85rem 1rem; text-align: left;
            font-size: .75rem; font-weight: 600; color: var(--ink-muted);
            text-transform: uppercase; letter-spacing: .5px;
            background: var(--surface); border-bottom: 1px solid rgba(0,0,0,.06);
            white-space: nowrap;
        }
        .table-wrap td {
            padding: .85rem 1rem; font-size: .9rem;
            border-bottom: 1px solid rgba(0,0,0,.04);
            vertical-align: middle;
        }
        .table-wrap tr:last-child td { border-bottom: none; }
        .table-wrap tr:hover td { background: rgba(239,68,68,.02); }

        /* Badge */
        .badge {
            display: inline-flex; align-items: center; gap: .3rem;
            padding: .25rem .75rem; border-radius: 20px;
            font-size: .75rem; font-weight: 600;
        }
        .badge.pending { background: rgba(245,158,11,.1); color: #b45309; }
        .badge.processed { background: rgba(34,197,94,.1); color: #15803d; }
        .badge.rejected { background: rgba(107,112,148,.1); color: var(--ink-muted); }
        .badge.spam { background: rgba(239,68,68,.1); color: #b91c1c; }
        .badge.abuse { background: rgba(249,115,22,.1); color: #c2410c; }
        .badge.false-info { background: rgba(139,92,246,.1); color: #6d28d9; }
        .badge.other { background: rgba(107,112,148,.1); color: var(--ink-muted); }
        .badge.type-post { background: rgba(14,165,233,.1); color: #0369a1; }
        .badge.type-comment { background: rgba(20,184,166,.1); color: #0f766e; }
        .badge.type-user { background: rgba(245,158,11,.1); color: #b45309; }

        .reporter-info { font-size: .8rem; color: var(--ink-muted); }
        .date-text { font-size: .85rem; color: var(--ink-muted); white-space: nowrap; }

        /* Action Buttons */
        .action-group { display: flex; gap: .4rem; flex-wrap: nowrap; }
        .action-btn {
            padding: .3rem .65rem; border-radius: 6px;
            border: none; font-size: .75rem; cursor: pointer;
            font-weight: 500; transition: all .2s; white-space: nowrap;
        }
        .action-btn.warn {
            background: rgba(245,158,11,.1); color: #b45309;
        }
        .action-btn.warn:hover { background: rgba(245,158,11,.2); }
        .action-btn.ban {
            background: rgba(239,68,68,.1); color: #b91c1c;
        }
        .action-btn.ban:hover { background: rgba(239,68,68,.2); }
        .action-btn.dismiss {
            background: rgba(107,112,148,.08); color: var(--ink-muted);
        }
        .action-btn.dismiss:hover { background: rgba(107,112,148,.15); }
        .action-btn.detail {
            background: rgba(139,92,246,.1); color: #6d28d9;
        }
        .action-btn.detail:hover { background: rgba(139,92,246,.2); }
        .action-btn:disabled {
            opacity: .4; cursor: not-allowed;
        }

        /* Pagination */
        .pagination {
            display: flex; align-items: center; justify-content: center;
            gap: .5rem; padding: 1.5rem;
            border-top: 1px solid rgba(0,0,0,.06);
        }
        .page-btn {
            width: 36px; height: 36px; border-radius: 8px;
            border: 1px solid rgba(0,0,0,.1); background: var(--surface-card);
            font-size: .85rem; cursor: pointer; color: var(--ink-muted);
            display: flex; align-items: center; justify-content: center;
            transition: all .2s;
        }
        .page-btn:hover { border-color: var(--red); color: var(--red); }
        .page-btn.active {
            background: var(--red); color: #fff; border-color: var(--red);
        }
        .page-btn:disabled { opacity: .4; cursor: not-allowed; }
        .page-info { font-size: .85rem; color: var(--ink-muted); padding: 0 .5rem; }

        /* Empty State */
        .empty-state {
            text-align: center; padding: 4rem 2rem; color: var(--ink-muted);
        }
        .empty-state .icon { font-size: 3rem; margin-bottom: 1rem; }
        .empty-state p { font-size: .95rem; }

        /* Auth Block */
        .auth-block {
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            min-height: 60vh; text-align: center; padding: 2rem;
        }
        .auth-block h1 { font-size: 1.5rem; margin-bottom: .5rem; }
        .auth-block p { color: var(--ink-muted); margin-bottom: 1.5rem; }
        .auth-block a { color: var(--violet); text-decoration: none; font-weight: 500; }

        /* Modal */
        .modal-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,.5); z-index: 200;
            align-items: center; justify-content: center; padding: 1rem;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: var(--surface-card); border-radius: var(--radius);
            max-width: 520px; width: 100%; max-height: 88vh;
            overflow-y: auto; padding: 2rem; box-shadow: var(--shadow-lg);
        }
        .modal-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 1.5rem;
        }
        .modal-header h2 { font-size: 1.15rem; font-weight: 700; }
        .modal-close-btn {
            width: 32px; height: 32px; border-radius: 8px;
            border: 1px solid rgba(0,0,0,.1); background: transparent;
            cursor: pointer; font-size: 1rem; color: var(--ink-muted);
            display: flex; align-items: center; justify-content: center;
            transition: all .2s;
        }
        .modal-close-btn:hover { background: var(--surface); }
        .modal-field { margin-bottom: 1rem; }
        .modal-field label {
            display: block; font-size: .75rem; font-weight: 600;
            color: var(--ink-muted); text-transform: uppercase;
            letter-spacing: .5px; margin-bottom: .35rem;
        }
        .modal-field .value { font-size: .9rem; line-height: 1.5; }
        .modal-field textarea, .modal-field select, .modal-field input[type="text"] {
            width: 100%; padding: .6rem .85rem;
            border: 1px solid rgba(0,0,0,.12); border-radius: var(--radius-sm);
            font-size: .9rem; font-family: inherit; outline: none;
            transition: border-color .2s; resize: vertical;
        }
        .modal-field textarea:focus,
        .modal-field select:focus,
        .modal-field input[type="text"]:focus { border-color: var(--red); }
        .modal-actions {
            display: flex; gap: .75rem; margin-top: 1.5rem;
        }
        .modal-actions button { flex: 1; }
        .btn-confirm {
            padding: .65rem 1.25rem; border-radius: var(--radius-sm);
            border: none; font-size: .9rem; font-weight: 600;
            cursor: pointer; transition: all .2s;
        }
        .btn-confirm.red { background: var(--red); color: #fff; }
        .btn-confirm.red:hover { opacity: .88; }
        .btn-confirm.amber { background: var(--amber); color: #fff; }
        .btn-confirm.amber:hover { opacity: .88; }
        .btn-confirm.gray { background: rgba(0,0,0,.08); color: var(--ink-muted); }
        .btn-confirm.gray:hover { background: rgba(0,0,0,.12); }

        /* Ban duration options */
        .duration-options {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: .5rem;
            margin-top: .5rem;
        }
        .duration-option {
            padding: .65rem; border-radius: var(--radius-sm);
            border: 2px solid rgba(0,0,0,.08); background: var(--surface-card);
            font-size: .85rem; font-weight: 500; cursor: pointer;
            text-align: center; transition: all .2s; color: var(--ink-muted);
        }
        .duration-option:hover { border-color: var(--red); color: var(--red); }
        .duration-option.selected { border-color: var(--red); background: rgba(239,68,68,.06); color: #b91c1c; font-weight: 700; }

        /* Toast */
        .toast {
            position: fixed; bottom: 2rem; right: 2rem;
            padding: .75rem 1.5rem; border-radius: var(--radius-sm);
            background: var(--ink); color: #fff; font-size: .85rem;
            box-shadow: var(--shadow-lg); z-index: 300;
            transform: translateY(100px); opacity: 0;
            transition: all .3s;
        }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.success { background: var(--green); }
        .toast.error { background: var(--red); }
        .toast.warning { background: var(--amber); }

        /* Responsive */
        @media (max-width: 1024px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 768px) {
            .nav-links { display: none; }
            .toolbar { flex-direction: column; align-items: stretch; }
            .table-wrap { overflow-x: auto; }
            .table-wrap table { min-width: 900px; }
            .modal { max-width: 100%; }
        }
        @media (max-width: 480px) {
            .stats-grid { grid-template-columns: 1fr; }
            .filter-group { flex-direction: column; }
        }
    </style>
</head>
<body>

<!-- Nav -->
<nav class="nav" id="nav">
    <div class="nav-inner">
        <a href="/" class="nav-logo">AX-<span>On</span></a>
        <div class="nav-links">
            <a href="/startup.html">시니어 AI 창업</a>
            <a href="/ax-project.html">AX 프로젝트</a>
            <a href="/expert.html">전문가</a>
            <a href="/community.html">커뮤니티</a>
            <a href="/pages/admin/reports.html" class="active">신고 관리</a>
        </div>
        <div class="nav-auth" id="navAuth">
            <a href="/pages/auth/login.html" class="btn-ghost">로그인</a>
        </div>
    </div>
</nav>

<!-- Auth Loading -->
<div id="authLoading" style="display:flex;align-items:center;justify-content:center;min-height:100vh;">
    <p style="color:var(--ink-muted);">권한 확인 중...</p>
</div>

<!-- Auth Denied -->
<div id="authDenied" class="auth-block" style="display:none;margin-top:64px;">
    <h1>관리자 전용 페이지입니다</h1>
    <p>이 페이지에 접근하려면 관리자 권한이 필요합니다.</p>
    <a href="/">메인으로 돌아가기</a>
</div>

<!-- Main Content -->
<div id="mainContent" style="display:none;">
    <div class="page-header">
        <div class="page-header-inner">
            <div>
                <h1>신고 관리</h1>
                <p>신고된 게시글, 댓글, 사용자를 검토하고 처리합니다</p>
            </div>
            <div class="header-actions">
                <a href="/pages/admin/blocked-users.html" class="header-link">차단된 사용자 관리</a>
                <a href="/pages/admin/admin-dashboard.html" class="header-link">대시보드</a>
            </div>
        </div>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-icon total">🚨</div>
            <div class="stat-label">전체 신고</div>
            <div class="stat-value" id="statTotal">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon pending">⏳</div>
            <div class="stat-label">대기중</div>
            <div class="stat-value" id="statPending">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon done">✅</div>
            <div class="stat-label">처리완료</div>
            <div class="stat-value" id="statProcessed">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon rejected">❌</div>
            <div class="stat-label">기각</div>
            <div class="stat-value" id="statRejected">0</div>
        </div>
    </div>

    <div class="content">
        <div class="toolbar">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="신고 대상, 신고자로 검색...">
            </div>
            <div class="filter-group" id="statusFilters">
                <button class="filter-tab active" data-filter="all">전체</button>
                <button class="filter-tab" data-filter="pending">대기중</button>
                <button class="filter-tab" data-filter="processed">처리완료</button>
                <button class="filter-tab" data-filter="rejected">기각</button>
            </div>
            <select class="filter-select" id="reasonFilter">
                <option value="all">모든 사유</option>
                <option value="spam">스팸</option>
                <option value="abuse">욕설/혐오</option>
                <option value="false_info">허위정보</option>
                <option value="other">기타</option>
            </select>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>신고 대상</th>
                        <th>신고 유형</th>
                        <th>신고 사유</th>
                        <th>신고자</th>
                        <th>신고일</th>
                        <th>상태</th>
                        <th>액션</th>
                    </tr>
                </thead>
                <tbody id="reportTableBody">
                    <tr>
                        <td colspan="8">
                            <div class="empty-state">
                                <div class="icon">⏳</div>
                                <p>로딩 중...</p>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
            <div class="pagination" id="pagination" style="display:none;"></div>
        </div>
    </div>
</div>

<!-- Report Detail Modal -->
<div class="modal-overlay" id="detailModal">
    <div class="modal">
        <div class="modal-header">
            <h2>신고 상세</h2>
            <button class="modal-close-btn" onclick="closeModal('detailModal')">✕</button>
        </div>
        <div id="detailContent"></div>
        <div class="modal-actions">
            <button class="btn-confirm gray" onclick="closeModal('detailModal')">닫기</button>
        </div>
    </div>
</div>

<!-- Ban Modal -->
<div class="modal-overlay" id="banModal">
    <div class="modal">
        <div class="modal-header">
            <h2>사용자 차단</h2>
            <button class="modal-close-btn" onclick="closeModal('banModal')">✕</button>
        </div>
        <div class="modal-field">
            <label>차단 대상</label>
            <div class="value" id="banTargetInfo" style="font-weight:600;"></div>
        </div>
        <div class="modal-field">
            <label>차단 기간 선택</label>
            <div class="duration-options">
                <div class="duration-option" data-days="3" onclick="selectDuration(this, 3)">3일</div>
                <div class="duration-option" data-days="7" onclick="selectDuration(this, 7)">7일</div>
                <div class="duration-option" data-days="30" onclick="selectDuration(this, 30)">30일</div>
                <div class="duration-option" data-days="0" onclick="selectDuration(this, 0)">영구 차단</div>
            </div>
        </div>
        <div class="modal-actions">
            <button class="btn-confirm gray" onclick="closeModal('banModal')">취소</button>
            <button class="btn-confirm red" onclick="confirmBan()" id="banConfirmBtn" disabled>차단 실행</button>
        </div>
    </div>
</div>

<!-- Dismiss Modal -->
<div class="modal-overlay" id="dismissModal">
    <div class="modal">
        <div class="modal-header">
            <h2>신고 기각</h2>
            <button class="modal-close-btn" onclick="closeModal('dismissModal')">✕</button>
        </div>
        <div class="modal-field">
            <label>기각 사유</label>
            <textarea id="dismissReason" rows="4" placeholder="기각 사유를 입력하세요..."></textarea>
        </div>
        <div class="modal-actions">
            <button class="btn-confirm gray" onclick="closeModal('dismissModal')">취소</button>
            <button class="btn-confirm amber" onclick="confirmDismiss()">기각 처리</button>
        </div>
    </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

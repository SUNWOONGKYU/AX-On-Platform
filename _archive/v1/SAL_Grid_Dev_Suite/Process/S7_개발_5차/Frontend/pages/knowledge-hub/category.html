<!-- 카테고리 헤더 & 소분류 탭 동적 업데이트 -->
<script>
(function() {
  // CATEGORIES 정의는 knowledge-hub.js에 있으므로 DOMContentLoaded 이후 참조
  var CAT_ICONS = {
    'programming': '&#128187;',
    'data-science': '&#128202;',
    'web-dev': '&#127760;',
    'devops': '&#128295;',
    'cloud': '&#9729;&#65039;'
  };

  var CAT_DESCS = {
    'programming': 'JavaScript, Python, Java, C++ 등 다양한 프로그래밍 언어 학습 자료',
    'data-science': '머신러닝, 딥러닝, 데이터 분석 기술과 실습 가이드',
    'web-dev': '프론트엔드, 백엔드, DevOps 웹 개발 기술 자료',
    'devops': 'Docker, Kubernetes, CI/CD 파이프라인 구성 가이드',
    'cloud': 'AWS, GCP, Azure 클라우드 플랫폼 활용 튜토리얼'
  };

  document.addEventListener('DOMContentLoaded', function() {
    var params = new URLSearchParams(window.location.search);
    var catSlug = params.get('cat') || params.get('sub') || '';

    // 카테고리 헤더 업데이트
    function updateHeader() {
      if (!catSlug) return;
      var iconEl = document.getElementById('cat-icon');
      var titleEl = document.getElementById('cat-title');
      var descEl = document.getElementById('cat-desc');
      var pageTitle = document.getElementById('page-title');
      var ogTitle = document.getElementById('og-title');

      // knowledge-hub.js의 CATEGORIES 참조
      var CATS = (window.KnowledgeHubApp && window.KnowledgeHubApp.getState) ? [] : [];
      // fallback: 고정 데이터
      var catNames = {
        'programming': 'Programming', 'data-science': 'Data Science',
        'web-dev': 'Web Development', 'devops': 'DevOps', 'cloud': 'Cloud',
        'javascript': 'JavaScript', 'python': 'Python', 'java': 'Java', 'cpp': 'C++',
        'ml': 'ML', 'deep-learning': 'Deep Learning', 'data-analysis': 'Data Analysis',
        'frontend': 'Frontend', 'backend': 'Backend', 'devops-w': 'DevOps',
        'docker': 'Docker', 'k8s': 'K8s', 'cicd': 'CI/CD',
        'aws': 'AWS', 'gcp': 'GCP', 'azure': 'Azure'
      };

      var parentSlugs = Object.keys(CAT_ICONS);
      var isParent = parentSlugs.includes(catSlug);
      var name = catNames[catSlug] || catSlug;

      if (iconEl) iconEl.innerHTML = CAT_ICONS[catSlug] || (isParent ? '&#128193;' : '&#128196;');
      if (titleEl) titleEl.textContent = name;
      if (descEl) descEl.textContent = CAT_DESCS[catSlug] || (name + ' 관련 게시글 목록');
      if (pageTitle) pageTitle.textContent = name + ' — 지식허브 — AX-On Platform';
      if (ogTitle) ogTitle.setAttribute('content', name + ' — 지식허브 — AX-On Platform');

      // Canonical URL 업데이트
      var canonical = document.getElementById('canonical-link');
      if (canonical) {
        canonical.setAttribute('href', 'https://ax-on.vercel.app/pages/knowledge-hub/category.html?cat=' + encodeURIComponent(catSlug));
      }
    }

    updateHeader();

    // 소분류 탭 렌더링 (대분류 선택 시만)
    function renderSubTabs() {
      var tabContainer = document.getElementById('cat-sub-tabs');
      if (!tabContainer) return;

      var parentCatDefs = {
        'programming': [
          { slug: 'javascript', name: 'JavaScript' }, { slug: 'python', name: 'Python' },
          { slug: 'java', name: 'Java' }, { slug: 'cpp', name: 'C++' }
        ],
        'data-science': [
          { slug: 'ml', name: 'ML' }, { slug: 'deep-learning', name: 'Deep Learning' },
          { slug: 'data-analysis', name: 'Data Analysis' }
        ],
        'web-dev': [
          { slug: 'frontend', name: 'Frontend' }, { slug: 'backend', name: 'Backend' },
          { slug: 'devops-w', name: 'DevOps' }
        ],
        'devops': [
          { slug: 'docker', name: 'Docker' }, { slug: 'k8s', name: 'K8s' }, { slug: 'cicd', name: 'CI/CD' }
        ],
        'cloud': [
          { slug: 'aws', name: 'AWS' }, { slug: 'gcp', name: 'GCP' }, { slug: 'azure', name: 'Azure' }
        ]
      };

      var currentCat = params.get('cat');
      var currentSub = params.get('sub');
      var targetParent = currentCat || (function() {
        // sub에서 부모 카테고리 찾기
        for (var p in parentCatDefs) {
          if (parentCatDefs[p].some(function(s) { return s.slug === currentSub; })) return p;
        }
        return null;
      })();

      if (!targetParent || !parentCatDefs[targetParent]) {
        tabContainer.parentElement.style.display = 'none';
        return;
      }

      var subs = parentCatDefs[targetParent];
      var html = '<a class="cat-sub-tab ' + (!currentSub ? 'active' : '') + '" href="?cat=' + targetParent + '">전체</a>';
      subs.forEach(function(sub) {
        html += '<a class="cat-sub-tab ' + (currentSub === sub.slug ? 'active' : '') + '" href="?cat=' + targetParent + '&sub=' + sub.slug + '">' + sub.name + '</a>';
      });

      tabContainer.innerHTML = html;
    }

    renderSubTabs();

    // KnowledgeHubApp 초기화 후 상태 반영 (300ms 대기)
    setTimeout(function() {
      var app = window.KnowledgeHubApp;
      if (app) {
        var st = app.getState();
        // 소분류 탭에 게시글 수 추가 가능 (categoryCounts 활용)
      }
    }, 500);
  });
})();
</script>

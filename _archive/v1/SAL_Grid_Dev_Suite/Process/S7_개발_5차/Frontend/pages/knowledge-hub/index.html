<!-- 영웅 배너 게시글 수 업데이트 -->
<script>
  document.addEventListener('DOMContentLoaded', function() {
    // KnowledgeHubApp.init()이 완료된 후 hero-post-count 업데이트
    const observer = new MutationObserver(function() {
      const app = window.KnowledgeHubApp;
      if (app) {
        const st = app.getState();
        if (st && st.posts && st.posts.length > 0) {
          const el = document.getElementById('hero-post-count');
          if (el) el.textContent = st.posts.length;
          observer.disconnect();
        }
      }
    });
    observer.observe(document.getElementById('kh-result-info') || document.body, {
      childList: true, subtree: true, characterData: true
    });
    // fallback: 2초 후 강제 업데이트
    setTimeout(function() {
      const app = window.KnowledgeHubApp;
      if (app) {
        const st = app.getState();
        const el = document.getElementById('hero-post-count');
        if (el && st && st.posts) el.textContent = st.posts.length;
      }
      observer.disconnect();
    }, 2000);
  });
</script>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="AX-On Platform 새 비밀번호 설정">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 110'><rect rx='20' width='100' height='110' fill='%23e8920d'/><text x='50' y='38' text-anchor='middle' dominant-baseline='central' font-family='Arial Black,Impact,sans-serif' font-weight='900' font-size='65' fill='white'>A</text><text x='50' y='74' text-anchor='middle' dominant-baseline='central' font-family='Arial Black,Impact,sans-serif' font-weight='900' font-size='65' fill='white'>X</text></svg>">
<title>새 비밀번호 설정 — AX-On Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet">
<script src="../../../../js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../js/password-reset.js" defer></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --ink: #1a1a2e;
  --ink-muted: #5a5f7d;
  --surface: #faf9f7;
  --surface-card: #ffffff;
  --amber: #e8920d;
  --amber-light: #f5b942;
  --amber-glow: rgba(232, 146, 13, 0.12);
  --teal: #0d9488;
  --success: #10b981;
  --warning: #f59e0b;
  --danger: #ef4444;
  --border: rgba(26, 26, 46, 0.12);
  --radius: 20px;
  --radius-sm: 12px;
  --shadow-hover: 0 12px 40px rgba(26, 26, 46, 0.12);
}

html { scroll-behavior: smooth; }

body {
  font-family: 'Noto Sans KR', sans-serif;
  background: var(--surface);
  color: var(--ink);
  line-height: 1.7;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  -webkit-font-smoothing: antialiased;
  background-image: radial-gradient(ellipse at 20% 50%, rgba(232, 146, 13, 0.06) 0%, transparent 60%),
                    radial-gradient(ellipse at 80% 20%, rgba(13, 148, 136, 0.05) 0%, transparent 50%);
}

.auth-card {
  background: var(--surface-card);
  border-radius: var(--radius);
  box-shadow: var(--shadow-hover);
  max-width: 440px;
  width: 100%;
  padding: 44px 40px;
  border: 1px solid var(--border);
}

/* Logo */
.logo { text-align: center; margin-bottom: 28px; }
.logo a {
  display: inline-flex; align-items: center; gap: 10px;
  text-decoration: none; color: var(--ink);
}
.logo-mark {
  width: 42px; height: 42px; border-radius: 12px;
  background: linear-gradient(135deg, var(--amber), var(--amber-light));
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 16px rgba(232, 146, 13, 0.3);
}
.logo-text { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 22px; letter-spacing: -0.5px; }
.logo-text span { color: var(--amber); }

.auth-title { text-align: center; font-size: 24px; font-weight: 700; color: var(--ink); margin-bottom: 6px; }
.auth-subtitle { text-align: center; font-size: 14px; color: var(--ink-muted); margin-bottom: 28px; }

/* Alert */
.alert {
  padding: 12px 16px; border-radius: var(--radius-sm);
  margin-bottom: 20px; font-size: 14px; display: none; line-height: 1.5;
}
.alert-error { background: rgba(239, 68, 68, 0.08); color: #c0392b; border: 1px solid rgba(239, 68, 68, 0.2); }
.alert-success { background: rgba(16, 185, 129, 0.08); color: #0d7a5a; border: 1px solid rgba(16, 185, 129, 0.2); }
.alert-warning { background: rgba(245, 158, 11, 0.08); color: #92640a; border: 1px solid rgba(245, 158, 11, 0.2); }

/* Form */
.form-group { margin-bottom: 18px; }
.form-label { display: block; margin-bottom: 7px; font-size: 14px; font-weight: 600; color: var(--ink); }

.pw-wrapper { position: relative; }
.pw-wrapper .form-input { padding-right: 44px; }
.pw-toggle {
  position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
  background: none; border: none; cursor: pointer; padding: 4px;
  color: var(--ink-muted); line-height: 1;
  display: flex; align-items: center; justify-content: center;
}
.pw-toggle:hover { color: var(--ink); }

.form-input {
  width: 100%; padding: 13px 16px;
  border: 1.5px solid var(--border); border-radius: var(--radius-sm);
  font-size: 15px; font-family: 'Noto Sans KR', sans-serif; color: var(--ink);
  background: var(--surface); transition: border-color 0.2s, box-shadow 0.2s; outline: none;
}
.form-input:focus { border-color: var(--amber); box-shadow: 0 0 0 3px var(--amber-glow); background: #fff; }
.form-input::placeholder { color: #aab0c4; }
.form-input.valid { border-color: var(--success); }
.form-input.invalid { border-color: var(--danger); }

/* Password strength bar */
.strength-bar-wrapper {
  margin-top: 10px;
}
.strength-label-row {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 5px;
}
.strength-label { font-size: 12px; color: var(--ink-muted); }
.strength-text { font-size: 12px; font-weight: 600; }
.strength-bar-track {
  height: 5px; border-radius: 3px;
  background: rgba(26, 26, 46, 0.1);
  overflow: hidden;
}
.strength-bar-fill {
  height: 100%; border-radius: 3px;
  transition: width 0.3s ease, background-color 0.3s ease;
  width: 0%;
}
/* Levels: 0=none, 1=weak, 2=medium, 3=strong */
.strength-bar-fill.level-0 { width: 0%;   background: transparent; }
.strength-bar-fill.level-1 { width: 33%;  background: var(--danger); }
.strength-bar-fill.level-2 { width: 66%;  background: var(--warning); }
.strength-bar-fill.level-3 { width: 100%; background: var(--success); }
.strength-text.level-1 { color: var(--danger); }
.strength-text.level-2 { color: var(--warning); }
.strength-text.level-3 { color: var(--success); }

/* Checklist */
.pw-checklist {
  margin-top: 10px;
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 4px 8px;
}
.pw-check-item {
  display: flex; align-items: center; gap: 6px;
  font-size: 12px; color: var(--ink-muted);
  transition: color 0.2s;
}
.pw-check-item .check-dot {
  width: 14px; height: 14px; border-radius: 50%;
  border: 1.5px solid #ccc;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: background 0.2s, border-color 0.2s;
  font-size: 9px; color: white;
}
.pw-check-item.met { color: var(--success); }
.pw-check-item.met .check-dot {
  background: var(--success); border-color: var(--success);
}

/* Match message */
.match-msg { margin-top: 6px; font-size: 12px; min-height: 18px; }

/* Buttons */
.btn-primary {
  width: 100%; padding: 14px;
  background: linear-gradient(135deg, var(--amber), var(--amber-light));
  color: #fff; border: none; border-radius: var(--radius-sm);
  font-size: 16px; font-weight: 700; font-family: 'Noto Sans KR', sans-serif;
  cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
  box-shadow: 0 4px 16px rgba(232, 146, 13, 0.3); margin-top: 8px;
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(232, 146, 13, 0.4); }
.btn-primary:active { transform: translateY(0); }
.btn-primary:disabled { background: #d1d5db; box-shadow: none; cursor: not-allowed; transform: none; }

.auth-footer { text-align: center; margin-top: 24px; font-size: 14px; color: var(--ink-muted); }
.auth-footer a { color: var(--amber); text-decoration: none; font-weight: 600; }
.auth-footer a:hover { text-decoration: underline; }

/* Views */
#verifyingView, #resetFormView, #successView, #errorView { display: none; }
#verifyingView.active, #resetFormView.active, #successView.active, #errorView.active { display: block; }

/* Verifying / loading state */
.verifying-box {
  text-align: center; padding: 20px 0;
}
.verifying-spinner {
  width: 52px; height: 52px;
  border: 4px solid rgba(232, 146, 13, 0.15); border-top: 4px solid var(--amber);
  border-radius: 50%; animation: spin 0.9s linear infinite;
  margin: 0 auto 16px;
}
.verifying-text { font-size: 15px; color: var(--ink-muted); }

/* Error view */
.error-icon-wrapper {
  width: 80px; height: 80px; background: var(--danger);
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  margin: 0 auto 20px; box-shadow: 0 8px 24px rgba(239, 68, 68, 0.3);
  text-align: center;
}
.error-icon-wrapper svg { width: 40px; height: 40px; fill: white; }
.error-view-title { font-size: 22px; font-weight: 700; color: var(--ink); margin-bottom: 10px; text-align: center; }
.error-view-msg { color: var(--ink-muted); font-size: 14px; margin-bottom: 24px; text-align: center; line-height: 1.6; }
.btn-link-style {
  display: inline-block; padding: 12px 32px;
  background: linear-gradient(135deg, var(--amber), var(--amber-light));
  color: #fff; text-decoration: none; border-radius: var(--radius-sm);
  font-weight: 700; font-size: 15px; transition: transform 0.2s, box-shadow 0.2s;
  box-shadow: 0 4px 16px rgba(232, 146, 13, 0.3); display: block; text-align: center;
  border: none; cursor: pointer; font-family: 'Noto Sans KR', sans-serif; width: 100%;
}
.btn-link-style:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(232, 146, 13, 0.4); }

/* Success view */
.success-icon-wrapper {
  width: 80px; height: 80px;
  background: linear-gradient(135deg, var(--success), #0acf83);
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  margin: 0 auto 20px; box-shadow: 0 8px 24px rgba(16, 185, 129, 0.3);
  animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) both;
}
@keyframes popIn {
  from { transform: scale(0.5); opacity: 0; }
  to   { transform: scale(1);   opacity: 1; }
}
.success-icon-wrapper svg { width: 40px; height: 40px; fill: white; }
.success-title { font-size: 22px; font-weight: 700; color: var(--ink); margin-bottom: 10px; text-align: center; }
.success-msg { color: var(--ink-muted); font-size: 14px; margin-bottom: 8px; text-align: center; line-height: 1.6; }
.redirect-hint {
  font-size: 13px; color: var(--ink-muted); text-align: center; margin-bottom: 22px;
}
.redirect-count { font-weight: 700; color: var(--amber); }

/* Loading overlay */
.loading-overlay {
  position: fixed; inset: 0; background: rgba(250, 249, 247, 0.85);
  display: none; align-items: center; justify-content: center; z-index: 1000;
}
.spinner {
  width: 48px; height: 48px;
  border: 4px solid rgba(232, 146, 13, 0.15); border-top: 4px solid var(--amber);
  border-radius: 50%; animation: spin 0.9s linear infinite;
}
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

@media (max-width: 480px) {
  .auth-card { padding: 32px 24px; }
  .auth-title { font-size: 21px; }
  .pw-checklist { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="auth-card">
  <div class="logo">
    <a href="../../../../index.html">
      <div class="logo-mark">
        <svg width="26" height="26" viewBox="0 0 40 44">
          <text x="20" y="16" text-anchor="middle" dominant-baseline="central" font-family="Arial Black,Impact,sans-serif" font-weight="900" font-size="28" fill="white">A</text>
          <text x="20" y="30" text-anchor="middle" dominant-baseline="central" font-family="Arial Black,Impact,sans-serif" font-weight="900" font-size="28" fill="white">X</text>
        </svg>
      </div>
      <span class="logo-text">AX-<span>On</span></span>
    </a>
  </div>

  <!-- 토큰 검증 중 -->
  <div id="verifyingView">
    <div class="verifying-box">
      <div class="verifying-spinner"></div>
      <p class="verifying-text">링크를 확인하는 중입니다...</p>
    </div>
  </div>

  <!-- 에러 뷰 (만료/무효) -->
  <div id="errorView">
    <div class="error-icon-wrapper" role="img" aria-label="오류">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
    </div>
    <h1 class="error-view-title" id="errorTitle">링크가 만료되었습니다</h1>

  <!-- 비밀번호 재설정 폼 -->
  <div id="resetFormView">
    <h1 class="auth-title">새 비밀번호 설정</h1>
    <p class="auth-subtitle">안전한 새 비밀번호를 입력해주세요</p>

    <div id="alertMessage" class="alert" role="alert"></div>

    <form id="resetPasswordForm" novalidate>
      <!-- 새 비밀번호 -->
      <div class="form-group">

            class="form-input"

          </button>

        <!-- 강도 표시 -->
        <div class="strength-bar-wrapper" id="strengthDesc" aria-live="polite">
          <div class="strength-label-row">

      <!-- 비밀번호 확인 -->

        <div class="pw-wrapper">
          <input
            class="form-input"
            type="password"
            id="confirmPassword"
            name="confirm-password"
            required
            placeholder="비밀번호 다시 입력"
            autocomplete="new-password"
            aria-describedby="matchMsg"
          >
          <button type="button" class="pw-toggle" id="toggleConfirm"
            onclick="togglePw('confirmPassword', 'toggleConfirm')"
            title="비밀번호 표시" aria-label="비밀번호 표시" aria-pressed="false">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>

<div id="loadingOverlay" class="loading-overlay" aria-hidden="true">
  <div class="spinner"></div>
</div>

<script>
// ── 전역 변수 ──
let supabaseClient = null;
let isRecoveryReady = false;

// ── SVG 아이콘 헬퍼 ──
const EYE_OPEN  = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
const EYE_CLOSE = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;

// ── Supabase 초기화 ──
async function getSupabase() {
  if (supabaseClient) return supabaseClient;
  await AXON_CONFIG.init();
  const { createClient } = supabase;
  supabaseClient = createClient(AXON_CONFIG.SUPABASE_URL, AXON_CONFIG.SUPABASE_ANON_KEY);
  return supabaseClient;
}

// ── 뷰 전환 ──
function showView(id) {
  ['verifyingView', 'errorView', 'resetFormView', 'successView'].forEach(v => {
    document.getElementById(v).classList.remove('active');
  });
  document.getElementById(id).classList.add('active');
}

// ── Alert ──
function showAlert(message, type = 'error') {
  const el = document.getElementById('alertMessage');
  if (!el) return;
  el.textContent = message;
  el.className = `alert alert-${type}`;
  el.style.display = 'block';
  if (type === 'error') setTimeout(() => { el.style.display = 'none'; }, 7000);
}

function showLoading(show) {
  document.getElementById('loadingOverlay').style.display = show ? 'flex' : 'none';
  document.getElementById('loadingOverlay').setAttribute('aria-hidden', String(!show));
  const btn = document.getElementById('submitBtn');
  if (btn) btn.disabled = show;
}

// ── 비밀번호 보기/숨기기 토글 ──
function togglePw(inputId, btnId) {
  const input = document.getElementById(inputId);
  const btn   = document.getElementById(btnId);
  const show  = input.type === 'password';
  input.type = show ? 'text' : 'password';
  btn.setAttribute('aria-pressed', String(show));
  btn.setAttribute('title', show ? '비밀번호 숨기기' : '비밀번호 표시');
  btn.setAttribute('aria-label', show ? '비밀번호 숨기기' : '비밀번호 표시');
  btn.innerHTML = show ? EYE_CLOSE : EYE_OPEN;
}

// ── 비밀번호 강도 계산 (password-reset.js의 calculateStrength와 동기화) ──
function calcStrength(pw) {
  let score = 0;
  if (pw.length >= 8)  score++;
  if (/[A-Z]/.test(pw)) score++;
  if (/[0-9]/.test(pw)) score++;
  if (/[^A-Za-z0-9]/.test(pw)) score++;
  // 길이 보너스
  if (pw.length >= 12) score = Math.min(score + 0.5, 4);
  if (score <= 1) return 1;  // 약함
  if (score <= 2) return 2;  // 중간
  return 3;                  // 강함
}

const STRENGTH_LABELS = ['', '약함', '중간', '강함'];

function updateStrengthUI(pw) {
  const level = pw.length === 0 ? 0 : calcStrength(pw);
  const bar   = document.getElementById('strengthBar');
  const text  = document.getElementById('strengthText');

  bar.className = `strength-bar-fill level-${level}`;
  text.className = `strength-text level-${level}`;
  text.textContent = pw.length > 0 ? STRENGTH_LABELS[level] : '';
}

function updateChecklist(pw) {
  const checks = {
    'chk-length':  pw.length >= 8,
    'chk-upper':   /[A-Z]/.test(pw),
    'chk-number':  /[0-9]/.test(pw),
    'chk-special': /[^A-Za-z0-9]/.test(pw),
  };
  for (const [id, met] of Object.entries(checks)) {
    const el  = document.getElementById(id);
    const dot = el.querySelector('.check-dot');
    if (met) {
      el.classList.add('met');
      dot.textContent = '✓';
    } else {
      el.classList.remove('met');
      dot.textContent = '';
    }
  }
}

function isPasswordValid(pw) {
  return pw.length >= 8 && /[A-Z]/.test(pw) && /[0-9]/.test(pw) && /[^A-Za-z0-9]/.test(pw);
}

function updateSubmitState() {
  const pw   = document.getElementById('newPassword')?.value || '';
  const conf = document.getElementById('confirmPassword')?.value || '';
  const btn  = document.getElementById('submitBtn');
  if (btn) btn.disabled = !(isPasswordValid(pw) && pw === conf);
}

// ── 실시간 검증 이벤트 ──
document.addEventListener('DOMContentLoaded', async () => {
  // 초기: 검증 중 표시
  showView('verifyingView');

  const newPwInput  = document.getElementById('newPassword');
  const confPwInput = document.getElementById('confirmPassword');

  newPwInput.addEventListener('input', () => {
    const pw = newPwInput.value;
    updateStrengthUI(pw);
    updateChecklist(pw);
    updateMatchUI();
    updateSubmitState();
  });

  confPwInput.addEventListener('input', () => {
    updateMatchUI();
    updateSubmitState();
  });

  function updateMatchUI() {
    const pw   = newPwInput.value;
    const conf = confPwInput.value;
    const msg  = document.getElementById('matchMsg');
    if (!conf) { msg.textContent = ''; confPwInput.className = 'form-input'; return; }
    if (pw === conf) {
      msg.textContent = '비밀번호가 일치합니다';
      msg.style.color = 'var(--success)';
      confPwInput.className = 'form-input valid';
    } else {
      msg.textContent = '비밀번호가 일치하지 않습니다';
      msg.style.color = 'var(--danger)';
      confPwInput.className = 'form-input invalid';
    }
  }

  // ── 폼 제출 ──
  document.getElementById('resetPasswordForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    if (!isRecoveryReady) {
      showAlert('유효한 복구 세션이 없습니다. 재설정 링크를 다시 요청해주세요.');
      return;
    }

    const pw   = newPwInput.value;
    const conf = confPwInput.value;

    if (!isPasswordValid(pw)) {
      showAlert('비밀번호 조건을 모두 충족해야 합니다 (8자 이상, 대문자, 숫자, 특수기호).');
      return;
    }
    if (pw !== conf) {
      showAlert('비밀번호가 일치하지 않습니다.');
      return;
    }

    try {
      showLoading(true);
      const client = await getSupabase();
      const { error } = await client.auth.updateUser({ password: pw });
      if (error) throw error;

      await client.auth.signOut();
      showLoading(false);

      showView('successView');

      // 3초 카운트다운 후 로그인 페이지 이동
      let count = 3;
      const countEl = document.getElementById('redirectCount');
      const interval = setInterval(() => {
        count -= 1;
        if (countEl) countEl.textContent = count;
        if (count <= 0) {
          clearInterval(interval);
          window.location.href = 'login.html';
        }
      }, 1000);

    } catch (err) {
      showLoading(false);
      if (err.message?.includes('Auth session missing') || err.message?.includes('session')) {
        showAlert('세션이 만료되었습니다. 비밀번호 재설정 링크를 다시 요청해주세요.');
        setTimeout(() => { window.location.href = 'forgot-password.html'; }, 3500);
      } else if (err.message?.includes('same_password')) {
        showAlert('새 비밀번호는 기존 비밀번호와 달라야 합니다.');
      } else if (err.message?.includes('fetch') || err.message?.includes('Failed to fetch')) {
        showAlert('네트워크 오류가 발생했습니다. 인터넷 연결을 확인해주세요.');
      } else {
        showAlert('비밀번호 재설정에 실패했습니다. 잠시 후 다시 시도해주세요.');
      }
    }
  });

  // ── 토큰/코드 검증 ──
  await verifyToken();
});

async function verifyToken() {
  try {
    const client = await getSupabase();

    const params  = new URLSearchParams(window.location.search);
    const hash    = window.location.hash;
    const code    = params.get('code');
    const hasHash = hash.includes('access_token') || hash.includes('type=recovery');

    // PKCE flow: ?code=... 파라미터
    if (code) {
      const { data, error } = await client.auth.exchangeCodeForSession(code);
      if (error) {
        showErrorView('링크가 만료되었습니다', '이 재설정 링크는 만료되었거나 이미 사용되었습니다.<br>새로운 재설정 링크를 요청해주세요.');
        return;
      }
      if (data?.session) {
        isRecoveryReady = true;
        showView('resetFormView');
        return;
      }
    }

    // Implicit flow: #access_token or #type=recovery
    if (hasHash) {
      const { data: { session } } = await client.auth.getSession();
      if (session) {
        isRecoveryReady = true;
        showView('resetFormView');
        return;
      }
    }

    // onAuthStateChange: PASSWORD_RECOVERY 이벤트 대기
    const { data: { subscription } } = client.auth.onAuthStateChange((event, session) => {
      if (event === 'PASSWORD_RECOVERY') {
        isRecoveryReady = true;
        subscription.unsubscribe();
        showView('resetFormView');
      } else if (event === 'SIGNED_IN' && session && (code || hasHash)) {
        isRecoveryReady = true;
        subscription.unsubscribe();
        showView('resetFormView');
      }
    });

    // 파라미터 없으면 즉시 에러
    if (!code && !hasHash) {
      showErrorView('유효하지 않은 링크입니다', '이 링크는 유효하지 않습니다.<br>이메일의 재설정 링크를 다시 확인하거나, 새로운 링크를 요청해주세요.');
      subscription.unsubscribe();
      return;
    }

    // 5초 타임아웃
    setTimeout(() => {
      if (!isRecoveryReady) {
        subscription.unsubscribe();
        showErrorView('링크가 만료되었습니다', '비밀번호 재설정 링크가 만료되었거나 유효하지 않습니다.<br>새로운 재설정 링크를 요청해주세요.');
      }
    }, 5000);

  } catch (err) {
    showErrorView('오류가 발생했습니다', '링크 확인 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요.');
  }
}

function showErrorView(title, msg) {
  document.getElementById('errorTitle').textContent = title;
  document.getElementById('errorMsg').innerHTML = msg;
  showView('errorView');
}
</script>

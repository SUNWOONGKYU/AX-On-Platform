<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="AX-On Platform 비밀번호 재설정 링크 발송 확인">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 110'><rect rx='20' width='100' height='110' fill='%23e8920d'/><text x='50' y='38' text-anchor='middle' dominant-baseline='central' font-family='Arial Black,Impact,sans-serif' font-weight='900' font-size='65' fill='white'>A</text><text x='50' y='74' text-anchor='middle' dominant-baseline='central' font-family='Arial Black,Impact,sans-serif' font-weight='900' font-size='65' fill='white'>X</text></svg>">
<title>이메일 발송 완료 — AX-On Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet">
<script src="../../../../js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../js/password-reset.js" defer></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --ink: #1a1a2e;
  --ink-muted: #5a5f7d;
  --surface: #faf9f7;
  --surface-card: #ffffff;
  --amber: #e8920d;
  --amber-light: #f5b942;
  --amber-glow: rgba(232, 146, 13, 0.12);
  --teal: #0d9488;
  --success: #10b981;
  --danger: #ef4444;
  --border: rgba(26, 26, 46, 0.12);
  --radius: 20px;
  --radius-sm: 12px;
  --shadow-soft: 0 4px 24px rgba(26, 26, 46, 0.06);
  --shadow-hover: 0 12px 40px rgba(26, 26, 46, 0.12);
}

html { scroll-behavior: smooth; }

body {
  font-family: 'Noto Sans KR', sans-serif;
  background: var(--surface);
  color: var(--ink);
  line-height: 1.7;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  -webkit-font-smoothing: antialiased;
  background-image: radial-gradient(ellipse at 20% 50%, rgba(232, 146, 13, 0.06) 0%, transparent 60%),
                    radial-gradient(ellipse at 80% 20%, rgba(13, 148, 136, 0.05) 0%, transparent 50%);
}

.auth-card {
  background: var(--surface-card);
  border-radius: var(--radius);
  box-shadow: var(--shadow-hover);
  max-width: 440px;
  width: 100%;
  padding: 48px 40px;
  border: 1px solid var(--border);
  text-align: center;
}

/* Logo */
.logo { margin-bottom: 32px; }
.logo a {
  display: inline-flex; align-items: center; gap: 10px;
  text-decoration: none; color: var(--ink);
}
.logo-mark {
  width: 42px; height: 42px; border-radius: 12px;
  background: linear-gradient(135deg, var(--amber), var(--amber-light));
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 16px rgba(232, 146, 13, 0.3);
}
.logo-text { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 22px; letter-spacing: -0.5px; }
.logo-text span { color: var(--amber); }

/* Check icon */
.check-icon-wrapper {
  width: 88px; height: 88px;
  background: linear-gradient(135deg, var(--success), #0acf83);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 24px;
  box-shadow: 0 8px 32px rgba(16, 185, 129, 0.35);
  animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) both;
}
@keyframes popIn {
  from { transform: scale(0.5); opacity: 0; }
  to   { transform: scale(1);   opacity: 1; }
}
.check-icon-wrapper svg { width: 44px; height: 44px; fill: white; }

.confirm-title {
  font-size: 24px; font-weight: 700; color: var(--ink);
  margin-bottom: 10px; letter-spacing: -0.3px;
}

/* Masked email display */
.email-display {
  display: inline-block;
  background: rgba(232, 146, 13, 0.09);
  border: 1px solid rgba(232, 146, 13, 0.25);
  border-radius: 8px;
  padding: 8px 20px;
  font-size: 16px;
  font-weight: 700;
  color: var(--amber);
  letter-spacing: 0.5px;
  margin: 12px 0 6px;
}

.confirm-desc {
  font-size: 14px; color: var(--ink-muted);
  margin-bottom: 8px; line-height: 1.65;
}

/* Timer */
.timer-box {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 18px;
  background: rgba(13, 148, 136, 0.07);
  border: 1px solid rgba(13, 148, 136, 0.18);
  border-radius: var(--radius-sm);
  margin: 18px 0 28px;
  font-size: 14px;
  color: #0b7a71;
  font-weight: 500;
}
.timer-box svg { flex-shrink: 0; }
.timer-count {
  font-weight: 700;
  font-size: 15px;
  color: var(--teal);
  min-width: 38px;
  display: inline-block;
}
.timer-box.expired { background: rgba(239, 68, 68, 0.07); border-color: rgba(239, 68, 68, 0.2); color: #c0392b; }
.timer-box.expired .timer-count { color: var(--danger); }

/* Alert */
.alert {
  padding: 12px 16px; border-radius: var(--radius-sm);
  margin-bottom: 18px; font-size: 14px; display: none; line-height: 1.5;
}
.alert-error { background: rgba(239, 68, 68, 0.08); color: #c0392b; border: 1px solid rgba(239, 68, 68, 0.2); }
.alert-success { background: rgba(16, 185, 129, 0.08); color: #0d7a5a; border: 1px solid rgba(16, 185, 129, 0.2); }

/* Buttons */
.btn-primary {
  width: 100%; padding: 14px;
  background: linear-gradient(135deg, var(--amber), var(--amber-light));
  color: #fff; border: none; border-radius: var(--radius-sm);
  font-size: 16px; font-weight: 700; font-family: 'Noto Sans KR', sans-serif;
  cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
  box-shadow: 0 4px 16px rgba(232, 146, 13, 0.3);
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(232, 146, 13, 0.4); }
.btn-primary:active { transform: translateY(0); }
.btn-primary:disabled {
  background: #d1d5db; box-shadow: none; cursor: not-allowed; transform: none;
}

/* Cooldown hint */
.cooldown-hint {
  font-size: 12px; color: var(--ink-muted); margin-top: 8px; min-height: 16px;
}

.divider-link {
  margin-top: 18px; font-size: 14px; color: var(--ink-muted);
}
.divider-link a {
  color: var(--amber); text-decoration: none; font-weight: 600;
}
.divider-link a:hover { text-decoration: underline; }

.auth-footer { margin-top: 14px; font-size: 14px; color: var(--ink-muted); }
.auth-footer a { color: var(--amber); text-decoration: none; font-weight: 600; }
.auth-footer a:hover { text-decoration: underline; }

/* Loading */
.loading-overlay {
  position: fixed; inset: 0; background: rgba(250, 249, 247, 0.85);
  display: none; align-items: center; justify-content: center; z-index: 1000;
}
.spinner {
  width: 48px; height: 48px;
  border: 4px solid rgba(232, 146, 13, 0.15); border-top: 4px solid var(--amber);
  border-radius: 50%; animation: spin 0.9s linear infinite;
}
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

@media (max-width: 480px) {
  .auth-card { padding: 36px 24px; }
  .confirm-title { font-size: 21px; }
}
</style>
</head>
<body>
<div class="auth-card">
  <div class="logo">
    <a href="../../../../index.html">
      <div class="logo-mark">
        <svg width="26" height="26" viewBox="0 0 40 44">
          <text x="20" y="16" text-anchor="middle" dominant-baseline="central" font-family="Arial Black,Impact,sans-serif" font-weight="900" font-size="28" fill="white">A</text>
          <text x="20" y="30" text-anchor="middle" dominant-baseline="central" font-family="Arial Black,Impact,sans-serif" font-weight="900" font-size="28" fill="white">X</text>
        </svg>
      </div>
      <span class="logo-text">AX-<span>On</span></span>
    </a>
  </div>

  <!-- Check icon -->
  <div class="check-icon-wrapper" role="img" aria-label="이메일 발송 완료">
    <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
  </div>

  <h1 class="confirm-title">재설정 링크를 발송했습니다</h1>

  <p class="confirm-desc">아래 이메일 주소로 비밀번호 재설정 링크를 보냈습니다</p>
  <div class="email-display" id="maskedEmail" aria-live="polite">○○○○○@email.com</div>
  <p class="confirm-desc" style="margin-top: 10px;">스팸함도 함께 확인해주세요.</p>

  <!-- 타이머 -->
  <div class="timer-box" id="timerBox" role="timer" aria-live="polite">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
    </svg>
    <span>5분 내 링크를 클릭해주세요 &nbsp;—&nbsp; 남은 시간</span>
    <span class="timer-count" id="timerCount">05:00</span>
  </div>

  <div id="alertMessage" class="alert" role="alert"></div>

  <!-- 다시 발송 버튼 -->
  <button type="button" class="btn-primary" id="resendBtn" onclick="handleResend()">
    다시 발송
  </button>
  <div class="cooldown-hint" id="cooldownHint"></div>

  <div class="divider-link">
    <a href="forgot-password.html">다른 이메일로 시도</a>
  </div>

  <div class="auth-footer">
    <a href="login.html">로그인 페이지로 돌아가기</a>
  </div>
</div>

<div id="loadingOverlay" class="loading-overlay" aria-hidden="true">
  <div class="spinner"></div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  // ── 이전 페이지에서 전달된 이메일 ──
  const maskedEmail = sessionStorage.getItem('ax_reset_email_masked') || '○○○○○@email.com';
  const rawEmail    = sessionStorage.getItem('ax_reset_email') || '';
  document.getElementById('maskedEmail').textContent = maskedEmail;

  // ── Supabase 초기화 ──
  let supabaseClient = null;
  async function getSupabase() {
    if (supabaseClient) return supabaseClient;
    await AXON_CONFIG.init();
    const { createClient } = supabase;
    supabaseClient = createClient(AXON_CONFIG.SUPABASE_URL, AXON_CONFIG.SUPABASE_ANON_KEY);
    return supabaseClient;
  }

  // ── 5분 카운트다운 타이머 ──
  const TIMER_SECONDS = 5 * 60;
  let remaining = TIMER_SECONDS;
  let timerInterval = null;

  function formatTime(s) {
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return `${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
  }

  function startTimer() {
    remaining = TIMER_SECONDS;
    document.getElementById('timerCount').textContent = formatTime(remaining);
    document.getElementById('timerBox').classList.remove('expired');

    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      remaining -= 1;
      document.getElementById('timerCount').textContent = formatTime(Math.max(0, remaining));
      if (remaining <= 0) {
        clearInterval(timerInterval);
        const box = document.getElementById('timerBox');
        box.classList.add('expired');
        box.innerHTML = `
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          <span>링크가 만료되었습니다. 다시 발송 버튼을 눌러주세요.</span>
        `;
      }
    }, 1000);
  }

  startTimer();

  // ── 60초 재발송 쿨다운 ──
  const COOLDOWN_SECONDS = 60;
  let cooldown = 0;
  let cooldownInterval = null;

  function startCooldown() {
    cooldown = COOLDOWN_SECONDS;
    document.getElementById('resendBtn').disabled = true;
    updateCooldownHint();
    if (cooldownInterval) clearInterval(cooldownInterval);
    cooldownInterval = setInterval(() => {
      cooldown -= 1;
      updateCooldownHint();
      if (cooldown <= 0) {
        clearInterval(cooldownInterval);
        document.getElementById('resendBtn').disabled = false;
        document.getElementById('cooldownHint').textContent = '';
      }
    }, 1000);
  }

  function updateCooldownHint() {
    document.getElementById('cooldownHint').textContent =
      cooldown > 0 ? `${cooldown}초 후 다시 발송할 수 있습니다` : '';
  }

  // ── Alert ──
  function showAlert(message, type = 'error') {
    const el = document.getElementById('alertMessage');
    el.textContent = message;
    el.className = `alert alert-${type}`;
    el.style.display = 'block';
    if (type === 'error') setTimeout(() => { el.style.display = 'none'; }, 6000);
  }

  function showLoading(show) {
    document.getElementById('loadingOverlay').style.display = show ? 'flex' : 'none';
  }

  // ── 다시 발송 ──
  window.handleResend = async function() {
    if (!rawEmail) {
      showAlert('이메일 정보가 없습니다. 이전 페이지로 돌아가 다시 시도해주세요.');
      return;
    }

    try {
      showLoading(true);
      document.getElementById('resendBtn').disabled = true;

      const client = await getSupabase();
      const redirectTo = window.location.href
        .replace(/\/pages\/auth\/.*$/, '/pages/auth/reset-password.html');

      const { error } = await client.auth.resetPasswordForEmail(rawEmail, { redirectTo });
      if (error) throw error;

      showLoading(false);
      showAlert('재설정 링크를 다시 발송했습니다.', 'success');
      startTimer();
      startCooldown();

    } catch (err) {
      showLoading(false);
      if (err.status === 429 || err.message?.includes('rate')) {
        showAlert('너무 많은 요청입니다. 잠시 후 다시 시도해주세요.');
        startCooldown();
      } else if (err.message?.includes('fetch') || err.message?.includes('Failed to fetch')) {
        showAlert('네트워크 오류가 발생했습니다. 인터넷 연결을 확인해주세요.');
        document.getElementById('resendBtn').disabled = false;
      } else {
        showAlert('발송에 실패했습니다. 잠시 후 다시 시도해주세요.');
        document.getElementById('resendBtn').disabled = false;
      }
    }
  };
});
</script>
</body>
</html>

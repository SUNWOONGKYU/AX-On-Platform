<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="AX-On Platform 비밀번호 재설정 요청">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 110'><rect rx='20' width='100' height='110' fill='%23e8920d'/><text x='50' y='38' text-anchor='middle' dominant-baseline='central' font-family='Arial Black,Impact,sans-serif' font-weight='900' font-size='65' fill='white'>A</text><text x='50' y='74' text-anchor='middle' dominant-baseline='central' font-family='Arial Black,Impact,sans-serif' font-weight='900' font-size='65' fill='white'>X</text></svg>">
<title>비밀번호 재설정 — AX-On Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet">
<script src="../../../../js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../js/password-reset.js" defer></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --ink: #1a1a2e;
  --ink-muted: #5a5f7d;
  --surface: #faf9f7;
  --surface-warm: #f5f0eb;
  --surface-card: #ffffff;
  --amber: #e8920d;
  --amber-light: #f5b942;
  --amber-glow: rgba(232, 146, 13, 0.12);
  --teal: #0d9488;
  --success: #10b981;
  --danger: #ef4444;
  --border: rgba(26, 26, 46, 0.12);
  --radius: 20px;
  --radius-sm: 12px;
  --shadow-soft: 0 4px 24px rgba(26, 26, 46, 0.06);
  --shadow-hover: 0 12px 40px rgba(26, 26, 46, 0.12);
}

html { scroll-behavior: smooth; }

body {
  font-family: 'Noto Sans KR', sans-serif;
  background: var(--surface);
  color: var(--ink);
  line-height: 1.7;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  -webkit-font-smoothing: antialiased;
  background-image: radial-gradient(ellipse at 20% 50%, rgba(232, 146, 13, 0.06) 0%, transparent 60%),
                    radial-gradient(ellipse at 80% 20%, rgba(13, 148, 136, 0.05) 0%, transparent 50%);
}

.auth-card {
  background: var(--surface-card);
  border-radius: var(--radius);
  box-shadow: var(--shadow-hover);
  max-width: 440px;
  width: 100%;
  padding: 44px 40px;
  border: 1px solid var(--border);
}

/* Logo */
.logo { text-align: center; margin-bottom: 28px; }
.logo a {
  display: inline-flex; align-items: center; gap: 10px;
  text-decoration: none; color: var(--ink);
}
.logo-mark {
  width: 42px; height: 42px; border-radius: 12px;
  background: linear-gradient(135deg, var(--amber), var(--amber-light));
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 16px rgba(232, 146, 13, 0.3);
}
.logo-text { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 22px; letter-spacing: -0.5px; }
.logo-text span { color: var(--amber); }

.auth-title { text-align: center; font-size: 24px; font-weight: 700; color: var(--ink); margin-bottom: 6px; }
.auth-subtitle { text-align: center; font-size: 14px; color: var(--ink-muted); margin-bottom: 28px; line-height: 1.6; }

/* Alert */
.alert {
  padding: 12px 16px; border-radius: var(--radius-sm);
  margin-bottom: 20px; font-size: 14px; display: none; line-height: 1.5;
}
.alert-error { background: rgba(239, 68, 68, 0.08); color: #c0392b; border: 1px solid rgba(239, 68, 68, 0.2); }
.alert-success { background: rgba(16, 185, 129, 0.08); color: #0d7a5a; border: 1px solid rgba(16, 185, 129, 0.2); }

/* Security notice */
.security-notice {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 12px 14px;
  background: rgba(13, 148, 136, 0.06);
  border: 1px solid rgba(13, 148, 136, 0.18);
  border-radius: var(--radius-sm);
  margin-bottom: 22px;
  font-size: 13px;
  color: #0d7a6a;
  line-height: 1.5;
}
.security-notice svg { flex-shrink: 0; margin-top: 1px; }

/* Form */
.form-group { margin-bottom: 20px; }
.form-label { display: block; margin-bottom: 7px; font-size: 14px; font-weight: 600; color: var(--ink); }

.email-input-wrapper { position: relative; }
.form-input {
  width: 100%; padding: 13px 16px;
  border: 1.5px solid var(--border); border-radius: var(--radius-sm);
  font-size: 15px; font-family: 'Noto Sans KR', sans-serif; color: var(--ink);
  background: var(--surface); transition: border-color 0.2s, box-shadow 0.2s; outline: none;
}
.form-input:focus { border-color: var(--amber); box-shadow: 0 0 0 3px var(--amber-glow); background: #fff; }
.form-input::placeholder { color: #aab0c4; }
.form-input.valid { border-color: var(--success); }
.form-input.invalid { border-color: var(--danger); }

/* Realtime feedback icon */
.field-icon {
  position: absolute; right: 13px; top: 50%; transform: translateY(-50%);
  font-size: 17px; line-height: 1; pointer-events: none;
  opacity: 0; transition: opacity 0.2s;
}
.field-icon.show { opacity: 1; }

.field-hint {
  margin-top: 6px; font-size: 12px;
  min-height: 18px;
}
.field-hint.valid-msg { color: var(--success); }
.field-hint.invalid-msg { color: var(--danger); }

/* Buttons */
.btn-primary {
  width: 100%; padding: 14px;
  background: linear-gradient(135deg, var(--amber), var(--amber-light));
  color: #fff; border: none; border-radius: var(--radius-sm);
  font-size: 16px; font-weight: 700; font-family: 'Noto Sans KR', sans-serif;
  cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
  box-shadow: 0 4px 16px rgba(232, 146, 13, 0.3); margin-top: 4px;
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(232, 146, 13, 0.4); }
.btn-primary:active { transform: translateY(0); }
.btn-primary:disabled { background: #d1d5db; box-shadow: none; cursor: not-allowed; transform: none; }

.auth-footer { text-align: center; margin-top: 24px; font-size: 14px; color: var(--ink-muted); }
.auth-footer a { color: var(--amber); text-decoration: none; font-weight: 600; }
.auth-footer a:hover { text-decoration: underline; }

/* Loading */
.loading-overlay {
  position: fixed; inset: 0; background: rgba(250, 249, 247, 0.85);
  display: none; align-items: center; justify-content: center; z-index: 1000;
}
.spinner {
  width: 48px; height: 48px;
  border: 4px solid rgba(232, 146, 13, 0.15); border-top: 4px solid var(--amber);
  border-radius: 50%; animation: spin 0.9s linear infinite;
}
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

@media (max-width: 480px) {
  .auth-card { padding: 32px 24px; }
  .auth-title { font-size: 21px; }
}
</style>
</head>
<body>
<div class="auth-card">
  <div class="logo">
    <a href="../../../../index.html">
      <div class="logo-mark">
        <svg width="26" height="26" viewBox="0 0 40 44">
          <text x="20" y="16" text-anchor="middle" dominant-baseline="central" font-family="Arial Black,Impact,sans-serif" font-weight="900" font-size="28" fill="white">A</text>
          <text x="20" y="30" text-anchor="middle" dominant-baseline="central" font-family="Arial Black,Impact,sans-serif" font-weight="900" font-size="28" fill="white">X</text>
        </svg>
      </div>
      <span class="logo-text">AX-<span>On</span></span>
    </a>
  </div>

  <h1 class="auth-title">비밀번호 재설정</h1>
  <p class="auth-subtitle">가입 시 사용하신 이메일 주소를 입력해주세요.<br>비밀번호 재설정 링크를 보내드립니다.</p>

  <div class="security-notice" role="note" aria-label="보안 안내">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
    </svg>
    <span>등록된 이메일로 재설정 링크를 발송합니다. 링크는 5분간 유효합니다.</span>
  </div>

  <div id="alertMessage" class="alert" role="alert"></div>

  <form id="forgotPasswordForm" novalidate>
    <div class="form-group">
      <label class="form-label" for="email">이메일</label>
      <div class="email-input-wrapper">
        <input
          class="form-input"
          type="email"
          id="email"
          name="email"
          required
          placeholder="example@email.com"
          autocomplete="email"
          inputmode="email"
          aria-describedby="emailHint"
        >
        <span class="field-icon" id="emailIcon" aria-hidden="true"></span>
      </div>
      <div class="field-hint" id="emailHint"></div>
    </div>

    <button type="submit" class="btn-primary" id="submitBtn" disabled>
      재설정 링크 발송
    </button>
  </form>

  <div class="auth-footer">
    <a href="login.html">로그인 페이지로 돌아가기</a>
  </div>
</div>

<div id="loadingOverlay" class="loading-overlay" aria-hidden="true">
  <div class="spinner"></div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  // ── Supabase 초기화 (config.js 비동기 패턴 지원) ──
  let supabaseClient = null;

  async function getSupabase() {
    if (supabaseClient) return supabaseClient;
    await AXON_CONFIG.init();
    const { createClient } = supabase;
    supabaseClient = createClient(AXON_CONFIG.SUPABASE_URL, AXON_CONFIG.SUPABASE_ANON_KEY);
    return supabaseClient;
  }

  const emailInput = document.getElementById('email');
  const emailIcon  = document.getElementById('emailIcon');
  const emailHint  = document.getElementById('emailHint');
  const submitBtn  = document.getElementById('submitBtn');

  // ── RFC 5322 간략 정규식 (실용적 수준) ──
  const RFC5322 = /^[a-zA-Z0-9.!#$%&'*+/=?^_`{|}~-]+@[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(?:\.[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)+$/;

  function validateEmail(value) {
    if (!value) return null; // 미입력 — 중립
    return RFC5322.test(value.trim());
  }

  // ── 실시간 피드백 ──
  emailInput.addEventListener('input', () => {
    const val = emailInput.value;
    const result = validateEmail(val);

    emailInput.classList.remove('valid', 'invalid');
    emailIcon.classList.remove('show');
    emailHint.className = 'field-hint';
    emailHint.textContent = '';

    if (result === null) {
      submitBtn.disabled = true;
      return;
    }
    if (result) {
      emailInput.classList.add('valid');
      emailIcon.textContent = '✅';
      emailIcon.classList.add('show');
      emailHint.classList.add('valid-msg');
      emailHint.textContent = '유효한 이메일 형식입니다';
      submitBtn.disabled = false;
    } else {
      emailInput.classList.add('invalid');
      emailIcon.textContent = '❌';
      emailIcon.classList.add('show');
      emailHint.classList.add('invalid-msg');
      emailHint.textContent = '올바른 이메일 형식을 입력하세요';
      submitBtn.disabled = true;
    }
  });

  // ── Alert 유틸 ──
  function showAlert(message, type = 'error') {
    const el = document.getElementById('alertMessage');
    el.textContent = message;
    el.className = `alert alert-${type}`;
    el.style.display = 'block';
    if (type === 'error') setTimeout(() => { el.style.display = 'none'; }, 6000);
  }

  function showLoading(show) {
    document.getElementById('loadingOverlay').style.display = show ? 'flex' : 'none';
    document.getElementById('loadingOverlay').setAttribute('aria-hidden', String(!show));
    submitBtn.disabled = show;
  }

  // ── 폼 제출 ──
  document.getElementById('forgotPasswordForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = emailInput.value.trim();

    if (!RFC5322.test(email)) {
      showAlert('올바른 이메일 형식을 입력하세요.');
      return;
    }

    try {
      showLoading(true);
      const client = await getSupabase();

      // 재설정 링크 클릭 후 도착할 reset-password.html 경로
      const redirectTo = window.location.href
        .replace(/\/pages\/auth\/.*$/, '/pages/auth/reset-password.html');

      const { error } = await client.auth.resetPasswordForEmail(email, { redirectTo });
      if (error) throw error;

      showLoading(false);

      // 이메일 마스킹 후 confirm 페이지로 전달
      const masked = maskEmail(email);
      sessionStorage.setItem('ax_reset_email', email);
      sessionStorage.setItem('ax_reset_email_masked', masked);
      window.location.href = 'forgot-password-confirm.html';

    } catch (err) {
      showLoading(false);
      if (err.status === 429 || err.message?.includes('rate')) {
        showAlert('너무 많은 요청입니다. 잠시 후 다시 시도해주세요.');
      } else if (err.message?.includes('fetch') || err.message?.includes('network') || err.message?.includes('Failed to fetch')) {
        showAlert('네트워크 오류가 발생했습니다. 인터넷 연결을 확인해주세요.');
      } else {
        showAlert('이메일 발송에 실패했습니다. 잠시 후 다시 시도해주세요.');
      }
    }
  });

  // ── 이메일 마스킹: user@domain.com → ○○○○○@domain.com ──
  function maskEmail(email) {
    const [local, domain] = email.split('@');
    const masked = '○'.repeat(Math.min(local.length, 5));
    return `${masked}@${domain}`;
  }
});
</script>
</body>
</html>

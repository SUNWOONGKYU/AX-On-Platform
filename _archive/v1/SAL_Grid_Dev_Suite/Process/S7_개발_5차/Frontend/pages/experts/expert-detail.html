<style>
/* ══════════════════════════════════════
   RESET & ROOT VARIABLES
══════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --ink: #1a1a2e;
  --ink-muted: #5a5f7d;
  --surface: #faf9f7;
  --surface-warm: #f5f0eb;
  --surface-card: #ffffff;
  --amber: #e8920d;
  --amber-light: #f5b942;
  --amber-glow: rgba(232, 146, 13, 0.12);
  --teal: #0d9488;
  --teal-light: #2dd4bf;
  --coral: #e85d4a;
  --violet: #7c5ce0;
  --sky: #3b82f6;
  --radius: 20px;
  --radius-sm: 12px;
  --shadow-soft: 0 4px 24px rgba(26, 26, 46, 0.06);
  --shadow-hover: 0 12px 40px rgba(26, 26, 46, 0.12);
  --dark-bg: #002451;
  --dark-text-muted: #7285b7;
  --dark-border: rgba(114, 133, 183, 0.15);
}

html { scroll-behavior: smooth; }

body {
  font-family: 'Noto Sans KR', sans-serif;
  background: var(--surface);
  color: var(--ink);
  line-height: 1.7;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ── FOCUS ── */
:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; border-radius: 4px; }

/* ══════════════════════════════════════
   NAV
══════════════════════════════════════ */
.nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: rgba(250, 249, 247, 0.92);
  backdrop-filter: blur(20px) saturate(1.4);
  border-bottom: 1px solid rgba(26, 26, 46, 0.06);
  transition: box-shadow 0.3s ease;
}
.nav.scrolled { box-shadow: 0 2px 20px rgba(26, 26, 46, 0.08); }

.nav-inner {
  max-width: 1280px; margin: 0 auto;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 40px; height: 72px;
}
.nav-logo {
  display: flex; align-items: center; gap: 10px;
  text-decoration: none; color: var(--ink);
  flex-shrink: 0;
}
.logo-mark {
  width: 42px; height: 42px; border-radius: 12px;
  background: linear-gradient(135deg, var(--amber), var(--amber-light));
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 16px rgba(232, 146, 13, 0.3);
}
.logo-mark svg { width: 28px; height: 32px; }
.logo-text {
  font-family: 'Outfit', sans-serif;
  font-weight: 800; font-size: 22px; letter-spacing: -0.5px;
}
.logo-text span { color: var(--amber); }

.nav-right { display: flex; align-items: center; gap: 8px; }
.nav-back {
  display: flex; align-items: center; gap: 6px;
  text-decoration: none; color: var(--ink-muted);
  font-size: 14px; font-weight: 500;
  padding: 8px 14px; border-radius: 10px;
  transition: all 0.25s ease;
}
.nav-back:hover { color: var(--ink); background: rgba(26, 26, 46, 0.04); }

.nav-auth-btn {
  text-decoration: none; font-size: 14px; font-weight: 600;
  padding: 8px 18px; border-radius: 10px; transition: all 0.3s ease;
  white-space: nowrap; font-family: 'Noto Sans KR', sans-serif;
}
.nav-login { color: var(--ink-muted); }
.nav-login:hover { color: var(--ink); }
.nav-signup { background: var(--ink); color: #fff; border-radius: 12px; }
.nav-signup:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(26,26,46,0.2); }
.nav-user-name { font-size: 14px; font-weight: 600; color: var(--ink); white-space: nowrap; }
.nav-logout-btn {
  background: none; border: 1px solid rgba(26,26,46,0.15);
  font-size: 13px; font-weight: 600; color: var(--ink-muted);
  padding: 6px 14px; border-radius: 10px; cursor: pointer;
  font-family: 'Noto Sans KR', sans-serif; transition: all 0.25s ease;
}
.nav-logout-btn:hover { color: var(--ink); border-color: var(--ink); }

/* 모바일 햄버거 */
.mobile-toggle {
  display: none; background: none; border: none;
  width: 44px; height: 44px; cursor: pointer;
  flex-direction: column; align-items: center; justify-content: center; gap: 5px;
}
.mobile-toggle span {
  display: block; width: 22px; height: 2px;
  background: var(--ink); border-radius: 2px; transition: all 0.3s ease;
}
.mobile-toggle.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.mobile-toggle.open span:nth-child(2) { opacity: 0; transform: scaleX(0); }
.mobile-toggle.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

.mobile-nav {
  display: none; flex-direction: column;
  background: var(--surface);
  padding: 12px 20px 20px;
  border-bottom: 1px solid rgba(26,26,46,0.06);
  box-shadow: 0 8px 24px rgba(26,26,46,0.08);
}
.mobile-nav.open { display: flex; }
.mobile-nav a {
  text-decoration: none; color: var(--ink-muted);
  font-size: 15px; font-weight: 500;
  padding: 12px 14px; min-height: 44px;
  display: flex; align-items: center;
  border-bottom: 1px solid rgba(26,26,46,0.04);
}
.mobile-nav a:last-child { border-bottom: none; }
.mobile-nav a:hover { color: var(--ink); }
.mobile-nav-divider { height: 1px; background: rgba(26,26,46,0.08); margin: 8px 0; }
.mobile-auth-signup {
  background: var(--ink); color: #fff !important;
  border-radius: 12px; margin-top: 4px; justify-content: center;
}

/* ══════════════════════════════════════
   LOADING / ERROR STATE
══════════════════════════════════════ */
.page-loading, .page-error {
  text-align: center; padding: 180px 40px 120px;
}
.page-loading-icon, .page-error-icon { font-size: 56px; margin-bottom: 20px; }
.page-loading-title, .page-error-title {
  font-size: 22px; font-weight: 900; margin-bottom: 8px;
}
.page-loading-desc, .page-error-desc {
  font-size: 15px; color: var(--ink-muted); margin-bottom: 24px; word-break: keep-all;
}
.page-error-link {
  display: inline-flex; align-items: center; gap: 6px;
  color: var(--sky); font-weight: 700; text-decoration: none; font-size: 15px;
}
.page-error-link:hover { text-decoration: underline; }

/* 로딩 스피너 */
@keyframes spin { to { transform: rotate(360deg); } }
.loading-spinner {
  width: 40px; height: 40px; border-radius: 50%;
  border: 3px solid rgba(232,146,13,0.2);
  border-top-color: var(--amber);
  animation: spin 0.8s linear infinite;
  margin: 0 auto 20px;
}

/* ══════════════════════════════════════
   PROFILE HERO
══════════════════════════════════════ */
.profile-hero {
  padding: 120px 40px 60px;
  text-align: center;
  position: relative; overflow: hidden;
  background: linear-gradient(180deg, var(--surface) 0%, var(--surface-warm) 100%);
}
.profile-hero::before {
  content: ''; position: absolute; top: -80px; left: 50%; transform: translateX(-50%);
  width: 700px; height: 500px; border-radius: 50%;
  background: radial-gradient(circle, var(--amber-glow) 0%, transparent 70%);
  pointer-events: none;
}
.profile-hero::after {
  content: ''; position: absolute; bottom: 0; right: -150px;
  width: 400px; height: 400px; border-radius: 50%;
  background: radial-gradient(circle, rgba(59,130,246,0.07) 0%, transparent 70%);
  pointer-events: none;
}
.profile-hero-inner {
  max-width: 680px; margin: 0 auto; position: relative; z-index: 1;
}

/* 프로필 아바타 */
.profile-avatar-wrap {
  position: relative; display: inline-block; margin-bottom: 28px;
}
.profile-avatar {
  width: 136px; height: 136px; border-radius: 50%;
  object-fit: cover;
  border: 4px solid var(--amber);
  box-shadow: 0 8px 40px rgba(232, 146, 13, 0.25);
}
.profile-badge {
  position: absolute; bottom: 6px; right: 6px;
  width: 36px; height: 36px; border-radius: 50%;
  background: linear-gradient(135deg, var(--amber), var(--amber-light));
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; border: 3px solid white;
  box-shadow: 0 2px 8px rgba(232,146,13,0.4);
}

.profile-name {
  font-family: 'Outfit', sans-serif;
  font-size: clamp(28px, 5vw, 44px);
  font-weight: 900; letter-spacing: -0.5px;
  margin-bottom: 10px;
}
.profile-tagline {
  font-size: 18px; color: var(--ink-muted);
  margin-bottom: 24px; word-break: keep-all;
}

/* 프로필 태그 */
.profile-tags {
  display: flex; flex-wrap: wrap; gap: 8px;
  justify-content: center; margin-bottom: 32px;
}
.profile-tag {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 6px 16px; border-radius: 50px;
  font-size: 13px; font-weight: 600;
}
.profile-tag.industry {
  background: rgba(232, 146, 13, 0.1); color: var(--amber);
  border: 1px solid rgba(232, 146, 13, 0.2);
}
.profile-tag.function {
  background: rgba(13, 148, 136, 0.1); color: var(--teal);
  border: 1px solid rgba(13, 148, 136, 0.2);
}

/* 액션 버튼 */
.profile-actions {
  display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;
}
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 14px 28px; border-radius: 14px;
  font-size: 15px; font-weight: 700;
  text-decoration: none; cursor: pointer;
  transition: all 0.3s ease; border: none;
  font-family: 'Noto Sans KR', sans-serif;
}
.btn-primary {
  background: linear-gradient(135deg, var(--sky), #2563eb); color: #fff;
  box-shadow: 0 6px 24px rgba(59, 130, 246, 0.3);
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 36px rgba(59, 130, 246, 0.4); }
.btn-outline {
  background: transparent; color: var(--ink);
  border: 2px solid rgba(26, 26, 46, 0.15);
}
.btn-outline:hover { border-color: var(--ink); background: rgba(26, 26, 46, 0.03); }

/* ══════════════════════════════════════
   SECTION COMMON
══════════════════════════════════════ */
.section {
  max-width: 840px; margin: 0 auto;
  padding: 60px 40px;
}
.section-title {
  font-size: 22px; font-weight: 900;
  margin-bottom: 28px; letter-spacing: -0.3px;
  display: flex; align-items: center; gap: 10px;
}
.section-title::before {
  content: ''; display: block;
  width: 4px; height: 22px;
  background: linear-gradient(135deg, var(--amber), var(--coral));
  border-radius: 2px; flex-shrink: 0;
}
.section-divider {
  max-width: 840px; margin: 0 auto;
  padding: 0 40px; border: none;
  border-top: 1px solid rgba(26, 26, 46, 0.07);
}

/* ── ABOUT ── */
.about-text {
  font-size: 17px; color: var(--ink);
  line-height: 1.9; word-break: keep-all;
}

/* ── EXPERTISE ── */
.expertise-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  gap: 12px;
}
.expertise-item {
  background: var(--surface-card);
  border: 1px solid rgba(26, 26, 46, 0.07);
  border-radius: var(--radius-sm);
  padding: 16px 18px;
  display: flex; align-items: center; gap: 10px;
  font-size: 14px; font-weight: 600;
  transition: all 0.25s ease;
}
.expertise-item:hover { border-color: rgba(232,146,13,0.2); box-shadow: var(--shadow-soft); }
.expertise-icon { font-size: 22px; flex-shrink: 0; }

/* ── CERTIFICATIONS ── */
.cert-list { display: flex; flex-direction: column; gap: 12px; }
.cert-item {
  display: flex; gap: 16px; align-items: flex-start;
  background: var(--surface-card);
  border: 1px solid rgba(26, 26, 46, 0.07);
  border-radius: var(--radius-sm);
  padding: 18px 22px;
  transition: all 0.25s ease;
}
.cert-item:hover { border-color: rgba(232,146,13,0.2); box-shadow: var(--shadow-soft); }
.cert-icon { font-size: 24px; flex-shrink: 0; padding-top: 2px; }
.cert-name { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
.cert-issuer { font-size: 13px; color: var(--ink-muted); }
.cert-year {
  display: inline-block; margin-top: 6px;
  font-size: 11px; font-weight: 700; color: var(--amber);
  background: rgba(232,146,13,0.1); padding: 2px 10px; border-radius: 50px;
}

/* ── CAREER ── */
.career-list { display: flex; flex-direction: column; gap: 16px; }
.career-item {
  display: flex; gap: 20px; align-items: flex-start;
  padding: 20px 24px;
  background: var(--surface-card);
  border: 1px solid rgba(26, 26, 46, 0.07);
  border-radius: var(--radius-sm);
  transition: all 0.25s ease;
}
.career-item:hover { border-color: rgba(59,130,246,0.2); box-shadow: var(--shadow-soft); }
.career-period {
  font-size: 13px; font-weight: 700; color: var(--amber);
  white-space: nowrap; min-width: 100px; padding-top: 2px;
}
.career-company { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
.career-role { font-size: 14px; color: var(--ink-muted); }

/* ── ACTIVITIES / PORTFOLIO ── */
.portfolio-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 20px;
}
.portfolio-card {
  background: var(--surface-card);
  border: 1px solid rgba(26, 26, 46, 0.07);
  border-radius: var(--radius);
  padding: 28px 24px;
  transition: all 0.3s ease;
}
.portfolio-card:hover {
  transform: translateY(-4px); box-shadow: var(--shadow-hover);
  border-color: rgba(232, 146, 13, 0.25);
}
.portfolio-emoji { font-size: 36px; margin-bottom: 16px; }
.portfolio-title { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
.portfolio-desc { font-size: 14px; color: var(--ink-muted); line-height: 1.7; word-break: keep-all; }
.portfolio-tags {
  display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px;
}
.portfolio-tag {
  font-size: 11px; font-weight: 600;
  background: var(--amber-glow); color: var(--amber);
  padding: 3px 10px; border-radius: 50px;
}

/* ── 소셜 공유 버튼 ── */
.share-buttons {
  display: flex; flex-wrap: wrap; gap: 12px;
  margin-bottom: 16px;
}
.share-btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 12px 22px; border-radius: var(--radius-sm);
  font-size: 14px; font-weight: 700; cursor: pointer;
  border: 1.5px solid transparent;
  font-family: 'Noto Sans KR', sans-serif;
  transition: all 0.25s ease;
  background: var(--surface-card);
  color: var(--ink);
  border-color: rgba(26, 26, 46, 0.12);
}
.share-btn:hover {
  transform: translateY(-2px); box-shadow: var(--shadow-soft);
}
.share-kakao:hover { border-color: #fee500; background: #fff9c4; }
.share-facebook:hover { border-color: #1877f2; color: #1877f2; }
.share-twitter:hover { border-color: #1da1f2; color: #1da1f2; }
.share-clipboard:hover { border-color: var(--teal); color: var(--teal); }
.share-icon { font-size: 18px; }
.share-copy-msg {
  font-size: 14px; font-weight: 600; height: 20px;
  transition: color 0.25s ease;
}
.share-copy-msg.success { color: var(--teal); }
.share-copy-msg.error { color: var(--coral); }

/* ── AX-ON BADGE 섹션 ── */
.axon-badge-section {
  background: var(--surface-warm);
  padding: 60px 40px;
  text-align: center;
}
.axon-badge-inner { max-width: 560px; margin: 0 auto; }
.axon-badge {
  display: inline-flex; align-items: center; gap: 14px;
  background: var(--surface-card);
  border: 1px solid rgba(232, 146, 13, 0.2);
  border-radius: 18px; padding: 22px 32px;
  margin-bottom: 20px;
  box-shadow: var(--shadow-soft);
  text-decoration: none;
  transition: all 0.3s ease;
}
.axon-badge:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }
.axon-badge-logo {
  width: 44px; height: 44px; border-radius: 12px;
  background: linear-gradient(135deg, var(--amber), var(--amber-light));
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.axon-badge-logo svg { width: 28px; height: 32px; }
.axon-badge-text { text-align: left; }
.axon-badge-title {
  font-family: 'Outfit', sans-serif;
  font-weight: 800; font-size: 17px; letter-spacing: -0.3px; color: var(--ink);
}
.axon-badge-title span { color: var(--amber); }
.axon-badge-subtitle { font-size: 12px; color: var(--ink-muted); }
.axon-badge-desc {
  font-size: 15px; color: var(--ink-muted);
  line-height: 1.8; word-break: keep-all;
}

/* ── FOOTER ── */
.footer {
  padding: 28px 40px 16px;
  background: var(--dark-bg);
  color: var(--dark-text-muted);
}
.footer-inner {
  max-width: 1280px; margin: 0 auto;
  display: flex; flex-direction: column; align-items: center;
  gap: 8px;
}
.footer-logo { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 20px; color: #fff; }
.footer-logo span { color: var(--amber); }
.footer-links { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; }
.footer-links a {
  color: var(--dark-text-muted); text-decoration: none; font-size: 14px;
  transition: color 0.3s ease; min-height: 44px; display: inline-flex; align-items: center;
}
.footer-links a:hover { color: var(--amber); }
.footer-copyright {
  max-width: 1280px; margin: 8px auto 0; padding: 8px 40px 0;
  border-top: 1px solid var(--dark-border);
  text-align: center; font-size: 12px; color: var(--dark-text-muted); opacity: 0.7;
}

/* ══════════════════════════════════════
   ANIMATIONS
══════════════════════════════════════ */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(24px); }
  to   { opacity: 1; transform: translateY(0); }
}
.fade-in { animation: fadeUp 0.6s ease both; }

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

/* ══════════════════════════════════════
   RESPONSIVE — 태블릿 (1024px)
══════════════════════════════════════ */
@media (max-width: 1024px) {
  .portfolio-grid { grid-template-columns: repeat(2, 1fr); }
}

/* ══════════════════════════════════════
   RESPONSIVE — 모바일 (768px)
══════════════════════════════════════ */
@media (max-width: 768px) {
  body { overflow-x: hidden; }

  /* Nav */
  .nav-inner { padding: 0 20px; height: 60px; }
  .nav-back { display: none; }
  .nav-auth-btn { display: none; }
  .mobile-toggle { display: flex; }

  /* Hero */
  .profile-hero { padding: 90px 20px 48px; }
  .profile-avatar { width: 108px; height: 108px; }
  .profile-name { font-size: clamp(24px, 7vw, 36px); }
  .profile-tagline { font-size: 16px; }

  /* Sections */
  .section { padding: 40px 20px; }

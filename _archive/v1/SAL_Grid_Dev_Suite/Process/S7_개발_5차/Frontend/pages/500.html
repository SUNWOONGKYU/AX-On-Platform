<!-- MAIN -->

      <circle cx="140" cy="110" r="65" fill="rgba(232,93,74,0.04)" />

      <!-- 플로팅 그룹: 서버 랙 -->
      <g class="float-group">
        <!-- 서버 바디 -->
        <rect x="82" y="44" width="116" height="136" rx="10" fill="#fff" stroke="rgba(26,26,46,0.1)" stroke-width="1.5"/>

        <!-- 서버 슬롯 1 (정상) -->
        <rect x="94" y="60" width="92" height="22" rx="5" fill="rgba(13,148,136,0.08)" stroke="rgba(13,148,136,0.2)" stroke-width="1"/>
        <circle cx="174" cy="71" r="4" fill="#0d9488" opacity="0.7"/>
        <line x1="102" y1="71" x2="155" y2="71" stroke="rgba(26,26,46,0.12)" stroke-width="1.5" stroke-linecap="round"/>

        <!-- 서버 슬롯 2 (경고) -->
        <rect x="94" y="88" width="92" height="22" rx="5" fill="rgba(232,146,13,0.08)" stroke="rgba(232,146,13,0.2)" stroke-width="1"/>
        <circle cx="174" cy="99" r="4" fill="#e8920d" opacity="0.8">
          <animate attributeName="opacity" values="0.8;0.2;0.8" dur="1.5s" repeatCount="indefinite"/>
        </circle>
        <line x1="102" y1="99" x2="148" y2="99" stroke="rgba(26,26,46,0.12)" stroke-width="1.5" stroke-linecap="round"/>

        <!-- 서버 슬롯 3 (오류) -->
        <rect x="94" y="116" width="92" height="22" rx="5" fill="rgba(232,93,74,0.08)" stroke="rgba(232,93,74,0.25)" stroke-width="1"/>
        <circle cx="174" cy="127" r="4" fill="#e85d4a">
          <animate attributeName="opacity" values="1;0.3;1" dur="0.8s" repeatCount="indefinite"/>
        </circle>
        <line x1="102" y1="127" x2="140" y2="127" stroke="rgba(232,93,74,0.3)" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="146" y1="122" x2="158" y2="132" stroke="rgba(232,93,74,0.5)" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="158" y1="122" x2="146" y2="132" stroke="rgba(232,93,74,0.5)" stroke-width="1.5" stroke-linecap="round"/>

        <!-- 500 표시 -->
        <text x="140" y="160" text-anchor="middle" font-family="Outfit,Arial Black,sans-serif" font-weight="900" font-size="22" fill="#e85d4a" opacity="0.85">500</text>
      </g>

      <!-- 플로팅 그룹: 경고 삼각형 -->
      <g class="float-group-fast">
        <path d="M48 80 L64 52 L80 80 Z" fill="rgba(232,146,13,0.12)" stroke="rgba(232,146,13,0.3)" stroke-width="1.5" stroke-linejoin="round"/>
        <text x="64" y="74" text-anchor="middle" font-family="Outfit,Arial Black,sans-serif" font-weight="900" font-size="14" fill="#e8920d">!</text>
      </g>

      <!-- 플로팅 그룹: 번개/에러 아이콘 -->
      <g class="float-group-slow">
        <!-- 번개 -->
        <path d="M220 52 L210 72 L218 72 L208 92 L224 68 L216 68 Z"
              fill="rgba(232,93,74,0.6)" stroke="rgba(232,93,74,0.8)" stroke-width="0.5" stroke-linejoin="round"/>
      </g>

      <!-- 연결선 (점선 - 에러 신호) -->
      <line x1="80" y1="75" x2="94" y2="75" stroke="rgba(232,146,13,0.3)" stroke-width="1.5" stroke-dasharray="3 2"/>
      <line x1="198" y1="127" x2="210" y2="75" stroke="rgba(232,93,74,0.2)" stroke-width="1.5" stroke-dasharray="3 2"/>

      <!-- 작은 점 장식 -->
      <circle cx="50" cy="152" r="3" fill="rgba(232,93,74,0.25)"/>
      <circle cx="234" cy="50" r="2" fill="rgba(13,148,136,0.3)"/>
      <circle cx="248" cy="148" r="4" fill="rgba(232,146,13,0.12)"/>

    <!-- 에러 코드 배지 -->
    <div class="error-code-badge server-error">

    <!-- 제목 & 설명 -->
    <h1 class="error-title">서버 오류가 발생했습니다</h1>

    </p>

    <!-- 버튼 -->

      <a href="../../../../index.html" class="btn btn-primary">

          <path d="M3 12L12 3l9 9"/><path d="M9 21V12h6v9"/>
        </svg>
        홈으로 돌아가기

<script src="../js/error-handler.js"></script>
<script>
  // 네비게이션 스크롤 효과
  const nav = document.getElementById('nav');
  window.addEventListener('scroll', () => {
    nav.classList.toggle('scrolled', window.scrollY > 10);
  }, { passive: true });

  // 모바일 메뉴 토글
  const toggle = document.getElementById('mobileToggle');
  const navLinks = document.getElementById('navLinks');
  toggle.addEventListener('click', () => {
    const isOpen = navLinks.classList.toggle('open');
    toggle.setAttribute('aria-expanded', String(isOpen));
    toggle.setAttribute('aria-label', isOpen ? '메뉴 닫기' : '메뉴 열기');
  });

  // 에러 핸들러 초기화
  if (window.ErrorHandler) {
    window.ErrorHandler.init({ pageType: '500' });
  }
</script>
